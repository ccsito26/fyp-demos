      if (idx >= lesson.steps.length) { finished = true; hideRing(); celebrate(); }
      else snapshot = clone(getAppState());
      panel(); readIfAuto();
    } else panel();
  }

  /* Called by app.js on every tap inside the phone (before the action runs) */
  function onTap(e, el) {
    const st = step(); if (!st || !el) return;
    const t = document.querySelector('#app ' + sel(st));
    if (t && (t === el || t.contains(el) || el.contains(t))) return;
    if (['back', 'closeModal', 'closeFlow', 'tabHome'].includes(el.dataset.act)) return; // navigation is not a "miss"
    misses++;
    if (misses >= 2) { if (mode === 'own') showNow = true; placeRing(); pulse(); }
  }

  function afterRender() { placeRing(); if (lesson || free) panel(); }

  /* ---------------- the pulsing ring ("do it with me") ---------------- */
  function hideRing() { $ring.hidden = true; }
  function pulse() { $ring.classList.remove('nudge'); void $ring.offsetWidth; $ring.classList.add('nudge'); }

  function placeRing() {
    const st = step();
    if (!st || status(st) !== 'ok' || (mode === 'own' && !showNow)) return hideRing();
    const el = document.querySelector('#app ' + sel(st));
    if (!el) return hideRing();
    // bring the target into view inside its scrolling area (only once per step)
    if (lastScrolledStep !== idx || showNow) {
      lastScrolledStep = idx;
      const sc = el.closest('.body');
      if (sc) {
        const r = el.getBoundingClientRect(), sr = sc.getBoundingClientRect();
        if (r.top < sr.top + 8 || r.bottom > sr.bottom - 8) sc.scrollTop += (r.top - sr.top) - sr.height / 2 + r.height / 2;
      }
    }
    requestAnimationFrame(() => {
      const screen = document.getElementById('screen');
      const sr = screen.getBoundingClientRect();
      const scale = sr.width / screen.offsetWidth || 1;
      const r = el.getBoundingClientRect();
      // if the button is scrolled out of sight (e.g. under the tab bar), hide the ring
      const sc = el.closest('.body');
      if (sc) { const b = sc.getBoundingClientRect(); if (r.bottom < b.top + 6 || r.top > b.bottom - 6) { hideRing(); return; } }
      const pad = 5;
      let top = (r.top - sr.top) / scale - pad, left = (r.left - sr.left) / scale - pad;
      let w = r.width / scale + pad * 2, h = r.height / scale + pad * 2;
      $ring.style.cssText = `top:${top}px;left:${left}px;width:${w}px;height:${h}px`;
      $ring.hidden = false;
      $ring.classList.toggle('label-up', top + h > screen.offsetHeight - 70);
    });
  }
  // keep the ring on the button while the page scrolls
  document.getElementById('app').addEventListener('scroll', () => placeRing(), true);
  window.addEventListener('resize', () => placeRing());

  /* ---------------- read aloud (voice) ---------------- */
  function speak(text) {
    if (!('speechSynthesis' in window)) { toast('Read aloud is not available in this browser.'); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text.replace(/[“”]/g, ''));
    u.rate = 0.88;
    const v = speechSynthesis.getVoices().find(v => /en[-_]SG/i.test(v.lang)) || speechSynthesis.getVoices().find(v => /en[-_](GB|AU|US)/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  function currentText() {
    if (finished) return lesson.done;
    const st = step(); if (!st) return '';
    return [st.say, st.tip, st.privacy || st.note].filter(Boolean).join(' ');
  }
  function readIfAuto() { if (autoRead && (step() || finished)) speak(step() ? step().say : lesson.done); }

  function celebrate() {
    const c = document.getElementById('confetti'); if (!c) return;
    c.innerHTML = Array.from({ length: 26 }, (_, i) => `<i style="left:${4 + (i * 37) % 92}%;animation-delay:${(i % 7) * 0.08}s;background:${['#00B070', '#F5B700', '#30505B', '#E8692B'][i % 4]}"></i>`).join('');
    c.classList.remove('go'); void c.offsetWidth; c.classList.add('go');
  }

  /* ---------------- side panel ---------------- */
  const modeSwitch = () => `
    <div class="mode" role="radiogroup" aria-label="How much help">
      <button role="radio" aria-checked="${mode === 'guide'}" class="${mode === 'guide' ? 'on' : ''}" data-c="mode" data-v="guide">${icon('hand', 20)} Do it with me</button>
      <button role="radio" aria-checked="${mode === 'own'}" class="${mode === 'own' ? 'on' : ''}" data-c="mode" data-v="own">${icon('book', 20)} Try on my own</button>
    </div>
    <p class="mode-help">${mode === 'guide' ? 'I will point to each button for you.' : 'I will only point when you tap “Show me where”.'}</p>`;

  let lastKey = '';
  function panel() {
    // new step → scroll the guide back to the top so the instruction is visible
    const key = `${lesson ? lesson.id : free ? 'free' : 'menu'}-${idx}-${finished}`;
    if (key !== lastKey) { lastKey = key; requestAnimationFrame(() => { document.querySelector('.coach').scrollTop = 0; }); }
    if (free) {
      $panel.innerHTML = `
        <div class="c-top"><button class="c-link" data-c="menu">${icon('left', 18)} All lessons</button></div>
        <h2 class="c-h">Free practice</h2>
        <div class="c-card"><p class="c-say">Tap anything you like. Nothing here is real, so you cannot break anything.</p>
        <p class="c-tip">Try: log in, book an appointment, change the date, cancel it again.</p></div>
        <div class="c-actions"><button class="cbtn" data-c="free">${icon('undo', 20)} Start fresh</button></div>`;
      return;
    }
    if (!lesson) {
      $panel.innerHTML = `
        <h2 class="c-h">What would you like to practise?</h2>
        <p class="c-sub">Pick one. I will guide you one step at a time.</p>
        ${modeSwitch()}
        <div class="lessons">
          ${LESSONS.map((l, i) => `<button class="lesson" data-c="start" data-v="${l.id}">
            <span class="lesson-n">${i + 1}</span>
            <span class="lesson-t"><b>${l.title}</b><small>${l.blurb} · ${l.steps.length} steps · about ${l.mins} min</small></span>${icon('right', 22)}</button>`).join('')}
          <button class="lesson lesson-free" data-c="free"><span class="lesson-n">${icon('hand', 20)}</span><span class="lesson-t"><b>Free practice</b><small>Explore on your own. Nothing is real.</small></span>${icon('right', 22)}</button>
        </div>`;
      return;
    }
    const n = lesson.steps.length;
    const li = LESSONS.indexOf(lesson);
    if (finished) {
      const nextL = LESSONS[li + 1];
      $panel.innerHTML = `
        <div class="c-top"><button class="c-link" data-c="menu">${icon('left', 18)} All lessons</button></div>
        <div class="c-done"><div class="c-done-ic">${icon('check', 40)}</div><h2>Well done!</h2><p>${lesson.done}</p></div>
        <div class="c-actions col">
          ${nextL ? `<button class="cbtn primary" data-c="start" data-v="${nextL.id}">Next: ${nextL.title} ${icon('right', 20)}</button>` : ''}
          <button class="cbtn" data-c="start" data-v="${lesson.id}">${icon('undo', 20)} Practise this again</button>
          <button class="cbtn" data-c="read">${icon('volume', 20)} Read aloud</button>
        </div>`;
      return;
    }
    const st = step(); const where = status(st);
    $panel.innerHTML = `
      <div class="c-top"><button class="c-link" data-c="menu">${icon('left', 18)} All lessons</button><span class="c-count">Lesson ${li + 1}</span></div>
      <h2 class="c-h">${lesson.title}</h2>
      <div class="c-progress" aria-label="Step ${idx + 1} of ${n}">${lesson.steps.map((_, i) => `<i class="${i < idx ? 'done' : i === idx ? 'now' : ''}"></i>`).join('')}</div>
      <div class="c-stepno">Step ${idx + 1} of ${n}</div>
      ${where === 'away' ? `
        <div class="c-card c-away"><p class="c-say">You have moved to a different page. That is okay!</p>
        <p class="c-tip">Tap the button below to go back to where we were.</p>
        <button class="cbtn primary" data-c="takeback">${icon('undo', 20)} Take me back</button></div>`
      : where === 'popup' ? `
        <div class="c-card c-away"><p class="c-say">A message has popped up. Read it, then tap its button to close it.</p></div>`
      : `
        <div class="c-card"><p class="c-say">${st.say}</p>${st.tip ? `<p class="c-tip">${st.tip}</p>` : ''}</div>
        ${st.privacy ? `<div class="c-privacy">${icon('lock', 20)}<div><b>Privacy note</b><p>${st.privacy}</p></div></div>` : ''}
        ${st.note ? `<div class="c-privacy c-note">${icon('info', 20)}<div><b>Good to know</b><p>${st.note}</p></div></div>` : ''}
        ${misses >= 2 ? `<div class="c-nudge">${mode === 'own' ? 'Need a little help? I have pointed to the right button.' : 'Almost! Tap the button inside the orange ring.'}</div>` : ''}`}
      <div class="c-actions">
        ${where === 'ok' ? `<button class="cbtn primary" data-c="show">${icon('hand', 20)} Show me where</button>` : ''}
        <button class="cbtn" data-c="read">${icon('volume', 20)} Read aloud</button>
      </div>
      <div class="c-actions small">
        <button class="c-link" data-c="start" data-v="${lesson.id}">${icon('undo', 16)} Start this lesson again</button>
        <button class="c-link" data-c="togglemode">${mode === 'guide' ? 'Switch to: Try on my own' : 'Switch to: Do it with me'}</button>
      </div>`;
  }

  $panel.addEventListener('click', (e) => {
    const b = e.target.closest('[data-c]'); if (!b) return;
    const c = b.dataset.c, v = b.dataset.v;
    if (c === 'start') start(v);
    else if (c === 'free') startFree();
    else if (c === 'menu') menu();
    else if (c === 'mode') { mode = v; panel(); placeRing(); }
    else if (c === 'togglemode') { mode = mode === 'guide' ? 'own' : 'guide'; showNow = false; panel(); placeRing(); }
    else if (c === 'show') { showNow = true; lastScrolledStep = -1; placeRing(); pulse(); }
    else if (c === 'read') speak(currentText());
    else if (c === 'takeback') { lastScrolledStep = -1; setAppState(clone(snapshot)); panel(); }
    if (typeof fit === 'function') fit();
  });

  /* ---------------- display settings (large text, contrast, spacing, presets) ---------------- */
  const root = document.documentElement;
  const disp = { fs: 'm', hc: false, sp: false, appBig: true };
  function applyDisplay() {
    root.dataset.fs = disp.fs;
    root.classList.toggle('hc', disp.hc);
    root.classList.toggle('spacing', disp.sp);
    root.classList.toggle('app-fixed', !disp.appBig);
    document.querySelectorAll('#fsSeg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fs === disp.fs));
    document.getElementById('hcToggle').checked = disp.hc;
    document.getElementById('spToggle').checked = disp.sp;
    document.getElementById('appBigToggle').checked = disp.appBig;
    document.querySelectorAll('[data-preset]').forEach(b => b.setAttribute('aria-pressed', 'false'));
    setTimeout(() => { placeRing(); if (typeof fit === 'function') fit(); }, 30);
  }
  document.getElementById('fsSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { disp.fs = b.dataset.fs; applyDisplay(); } });
  document.getElementById('hcToggle').addEventListener('change', e => { disp.hc = e.target.checked; applyDisplay(); });
  document.getElementById('spToggle').addEventListener('change', e => { disp.sp = e.target.checked; applyDisplay(); });
  document.getElementById('appBigToggle').addEventListener('change', e => { disp.appBig = e.target.checked; applyDisplay(); });
  document.getElementById('arToggle').addEventListener('change', e => { autoRead = e.target.checked; if (autoRead) readIfAuto(); });
  const PRESETS = { standard: { fs: 'm', hc: false, sp: false }, easy: { fs: 'l', hc: false, sp: true }, clearest: { fs: 'xl', hc: true, sp: true } };
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => {
    Object.assign(disp, PRESETS[b.dataset.preset]); applyDisplay(); b.setAttribute('aria-pressed', 'true');
  }));

  panel();
  return { onAction, onTap, afterRender, start, menu };
})();

</script>
  <script>
    /* Fit the phone to the window (scales the phone down on short screens). */
    function fit() {
      const w = innerWidth, root = document.documentElement;
      document.body.classList.toggle('mobile', w < 560);
      if (w < 560) { root.style.setProperty('--ps', 1); return; }
      const stacked = w < 900;
      document.body.classList.toggle('stacked', stacked);
      const availH = stacked ? innerHeight * 0.62 - 16 : innerHeight - 40;
      const availW = stacked ? w - 32 : w - 440;
      root.style.setProperty('--ps', Math.max(0.5, Math.min(1, availH / 868, availW / 414)).toFixed(3));
    }
    addEventListener('resize', fit);
    fit();
    render();
  </script>
</body>
</html>
