<!doctype html>
<html lang="en" data-fs="m">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HealthHub Practice Simulator</title>
  <!-- Fonts (falls back to system fonts when offline) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   styles.css — HealthHub practice simulator
   1. Design tokens (colours sampled from the screenshots)
   2. Page layout: phone frame + coach panel (responsive)
   3. HealthHub UI (inside the phone)
   4. Singpass screens
   5. Coach panel
   6. Accessibility modes: large text, high contrast, text spacing
   ===================================================================== */

/* ---------- 1. TOKENS ---------- */
:root {
  --teal: #30505B;        /* primary buttons, "Make new appointment" */
  --teal-dark: #1f3a43;
  --green: #00B070;       /* header rule, active tab, success tick */
  --green-dark: #00965F;
  --mint: #E0F5EE;        /* success area, note box */
  --blue: #1A7DB5;        /* links: Change, Select, Refresh */
  --slot-blue: #1666A0;   /* selected time slot */
  --badge-blue: #D5EDF6;  /* date badge */
  --time-blue: #1B86B5;
  --grey-bg: #F0F0F0;
  --band: #E6E6E6;        /* section headers, slot area */
  --line: #E2E2E2;
  --text: #2B2B2B;
  --muted: #6B6B6B;
  --sp-red: #E8313B;      /* Singpass */
  --ring: #FF6A13;        /* coach highlight */
  --ps: 1;                /* phone scale (set by fit()) */
  --app-font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  --sp-font: 'Poppins', 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 16px;
}
html[data-fs="l"] { font-size: 18px; }
html[data-fs="xl"] { font-size: 20px; }

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #E7EEEC; color: var(--text); font-family: var(--app-font); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input { font: inherit; }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--ring); outline-offset: 2px; }

/* ---------- 2. PAGE LAYOUT ---------- */
.stage { display: flex; gap: 40px; justify-content: center; align-items: flex-start; padding: 20px; min-height: 100%; }
.phone-wrap { width: calc(414px * var(--ps)); height: calc(868px * var(--ps)); flex: none; }
.phone { width: 414px; height: 868px; padding: 12px; background: #111; border-radius: 58px; transform: scale(var(--ps)); transform-origin: top left; box-shadow: 0 30px 60px -20px rgba(0,0,0,.35), inset 0 0 0 2px #333; }
#screen {
  --k: 1;
  --f11: calc(11px * var(--k)); --f12: calc(12px * var(--k)); --f13: calc(13px * var(--k)); --f14: calc(14px * var(--k));
  --f15: calc(15px * var(--k)); --f16: calc(16px * var(--k)); --f17: calc(17px * var(--k)); --f18: calc(18px * var(--k));
  --f20: calc(20px * var(--k)); --f22: calc(22px * var(--k)); --f24: calc(24px * var(--k)); --f28: calc(28px * var(--k));
  position: relative; width: 390px; height: 844px; overflow: hidden; border-radius: 46px; background: #fff;
  font-family: var(--app-font); font-size: var(--f16); color: var(--text);
}
html[data-fs="l"] #screen { --k: 1.12; }
html[data-fs="xl"] #screen { --k: 1.25; }
html.app-fixed #screen { --k: 1 !important; }
#app { position: absolute; inset: 0; }

.practice-tag { position: absolute; z-index: 60; top: 10px; left: 50%; transform: translateX(-50%); background: #000; color: #FFD43B; font: 700 10px/1 var(--app-font); letter-spacing: .14em; padding: 9px 16px; border-radius: 20px; pointer-events: none; }

.coach { width: 400px; flex: none; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow: auto; background: #fff; border-radius: 22px; padding: 20px 22px 18px; box-shadow: 0 12px 40px -18px rgba(0,0,0,.3); }

/* Tablet portrait: guide on top, phone below */
body.stacked .stage { flex-direction: column; align-items: center; gap: 16px; padding: 12px 16px; }
body.stacked .coach { order: -1; width: min(640px, 100%); position: sticky; top: 8px; z-index: 5; max-height: 40vh; padding-top: 6px; }
body.stacked .c-brand { display: none; }
body.stacked .sandbox { margin-top: 8px; padding: 8px 12px; }

/* Phone-sized screens: the app fills the screen, guide sits at the bottom */
body.mobile .stage { flex-direction: column; gap: 0; padding: 0; height: 100dvh; min-height: 0; }
body.mobile .phone-wrap { width: 100%; height: auto; flex: 1; min-height: 0; }
body.mobile .phone { width: 100%; height: 100%; padding: 0; border-radius: 0; transform: none; box-shadow: none; background: #fff; }
body.mobile #screen { width: 100%; height: 100%; border-radius: 0; }
body.mobile .coach { width: 100%; position: static; max-height: 40dvh; border-radius: 18px 18px 0 0; padding: 12px 16px; box-shadow: 0 -6px 20px rgba(0,0,0,.12); }
body.mobile .c-brand, body.mobile .sandbox { display: none; }
body.mobile .c-h { font-size: 1.15rem; margin-top: 6px; }
body.mobile .c-top { margin-top: 0; }
body.mobile .practice-tag { top: 4px; padding: 5px 10px; }

/* ---------- 3. HEALTHHUB UI ---------- */
.scr { position: absolute; inset: 0; display: flex; flex-direction: column; background: #fff; }
.body { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.body.grey { background: var(--grey-bg); }
.flex1 { flex: 1; }
.pad { padding: 16px; }
.pad-b { padding-top: 4px; padding-bottom: 14px; }
.pad-t0 { padding-top: 0; }
.muted { color: var(--muted); font-size: var(--f14); margin: 10px 0 0; }
.err { color: #C62828; font-size: var(--f14); margin-top: 8px; }
.center { display: block; margin: 14px auto; text-align: center; }

/* status bar */
.sb { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 44px; font: 600 16px/1 -apple-system, 'SF Pro Text', var(--app-font); position: relative; z-index: 2; }
.sb-right { display: flex; align-items: center; gap: 6px; font-size: 14px; }
.sb-batt { display: inline-flex; align-items: center; justify-content: center; width: 27px; height: 13px; border-radius: 4px; background: currentColor; position: relative; }
.sb-batt span { font: 700 10px/1 var(--app-font); color: #fff; }
.sb-batt::after { content: ''; position: absolute; right: -3px; top: 4px; width: 2px; height: 5px; border-radius: 0 2px 2px 0; background: currentColor; opacity: .5; }
.sb-light { background: #fff; color: #000; }
.sb-green { background: transparent; color: #000; }
.sb-dim { background: #6c6c6c; color: #fff; }
.sb-dim .sb-batt span, .sb-dark .sb-batt span { color: #6c6c6c; }
.sb-dark { background: #0d0d0d; color: #fff; }

/* header for inner pages */
.nav { height: 52px; flex: none; display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; border-bottom: 2px solid var(--green); background: #fff; }
.nav-back { display: grid; place-items: center; height: 52px; color: #333; }
.nav-title { text-align: center; font-size: var(--f17); font-weight: 600; color: #333; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-x { justify-self: center; width: 28px; height: 28px; border-radius: 50%; background: #8E8E8E; color: #fff; display: grid; place-items: center; }
.nav-x .ic { stroke-width: 3; }

/* home header */
.hh-top { height: 62px; flex: none; display: grid; grid-template-columns: 56px 1fr 56px; align-items: center; border-bottom: 1px solid var(--line); background: #fff; }
.icon-btn { display: grid; place-items: center; height: 62px; color: #444; }
.hh-logo { display: flex; justify-content: center; align-items: center; }
.hh-logo img { height: 40px; width: auto; display: block; }
.hh-title { text-align: center; font-size: var(--f18); font-weight: 700; }

/* profile row */
.who { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: #fff; flex: none; box-shadow: 0 2px 3px -2px rgba(0,0,0,.08); }
.who-av { width: 40px; height: 40px; border-radius: 10px; background: #DFF3EA; color: #1b6f4d; display: grid; place-items: center; flex: none; }
.who-txt { flex: 1; min-width: 0; }
.who-name { font-size: var(--f15); font-weight: 600; filter: blur(.0px); }
.who-id { font-size: var(--f13); color: var(--muted); }
.who-switch { display: flex; align-items: center; gap: 4px; font-size: var(--f17); color: #333; }

/* buttons */
.btn { width: 100%; min-height: 52px; border-radius: 8px; font-size: var(--f17); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; text-align: center; }
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:active { background: var(--teal-dark); }
.btn-primary[aria-disabled="true"] { background: #C7C7C7; color: #fff; cursor: not-allowed; }
.btn-outline { background: #fff; color: var(--teal); border: 1.5px solid var(--teal); }
.btn-sm { flex: 1; min-height: 44px; border: 1.5px solid var(--teal); border-radius: 8px; color: var(--teal); font-weight: 600; font-size: var(--f15); text-align: center; background: #fff; }
.link-btn { color: var(--blue); font-weight: 600; font-size: var(--f16); text-align: center; padding: 10px; }

/* login splash */
.scr-login { background: #fff; }
.scr-login .sb { position: absolute; top: 0; left: 0; right: 0; }
.login-hero { position: absolute; top: 0; left: 0; width: 100%; height: 400px; }
.login-art { position: absolute; inset: 0; pointer-events: none; }
.bubble { position: absolute; width: 58px; height: 58px; border-radius: 15px; background: #fff; border: 2.5px solid #1d3a33; display: grid; place-items: center; color: #1d3a33; box-shadow: 0 3px 0 rgba(0,0,0,.15); }
.family { position: absolute; left: 92px; top: 196px; }
.login-bell { position: absolute; top: 64px; left: 22px; width: 42px; height: 42px; border-radius: 10px; background: #1F6B4C; color: #fff; display: grid; place-items: center; z-index: 2; }
.login-bottom { position: absolute; top: 386px; left: 0; right: 0; bottom: 0; padding: 0 22px 26px; display: flex; flex-direction: column; }
.notice { display: block; width: 100%; background: rgba(66,66,66,.94); color: #fff; border-radius: 12px; padding: 14px 16px; }
.notice-h { display: flex; align-items: center; gap: 8px; font-size: var(--f16); }
.notice-all { margin-left: auto; display: flex; align-items: center; font-size: var(--f15); font-weight: 500; }
.notice-t { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 8px; font-size: var(--f15); line-height: 1.38; }
.login-btn { margin-top: 14px; font-size: var(--f18); min-height: 48px; }
.scam-card { margin-top: 22px; display: flex; align-items: center; gap: 10px; padding: 12px 12px; border-radius: 8px; background: #E7F5EF; color: var(--teal); font-weight: 600; font-size: var(--f15); box-shadow: 0 2px 6px rgba(0,0,0,.14); }
.scam-card span { flex: 1; }

/* home */
.greet { background: #EFEFEF; padding: 20px 16px 20px; }
.greet-hi { font-size: var(--f17); font-weight: 700; }
.greet-last { font-size: var(--f13); color: #333; margin-top: 8px; }
/* Healthier SG banner — positions measured from the real banner (490 × 198) */
.hsg { position: relative; display: block; width: 100%; aspect-ratio: 490 / 198; overflow: hidden;
  background: linear-gradient(to bottom, #F1FCF4 0%, #DEFAEF 61%, #01AF72 62.6%, #01AF72 100%); }
.hsg-art { position: absolute; left: 0; top: 0; height: 100%; width: auto; }
.hsg-new { position: absolute; left: 43.1%; top: 11%; height: 10.6%; padding: 0 10px; display: flex; align-items: center; border-radius: 20px; background: #EFA537; color: #fff; font: 700 12px/1 var(--app-font); letter-spacing: .02em; }
.hsg-title { position: absolute; left: 43.1%; right: 3%; top: 25%; color: #1B7652; font: 600 18px/1.3 var(--app-font); letter-spacing: -.01em; text-align: left; }
.hsg-pill { position: absolute; left: 42.7%; width: 50.4%; top: 68.2%; height: 24.7%; border-radius: 40px; background: #EDF7F3; box-shadow: 0 1px 3px rgba(0,0,0,.12); display: flex; align-items: center; justify-content: space-between; padding: 0 3px 0 0; color: #1E5C45; font: 600 15px/1 var(--app-font); }
.hsg-pill > span { flex: 1; text-align: center; padding-left: 4px; }
.hsg-pill i { height: calc(100% - 6px); aspect-ratio: 1.15; border-radius: 4px 40px 40px 4px; background: #1D6B4C; display: grid; place-items: center; }
.sec-h { display: flex; align-items: center; justify-content: space-between; padding: 22px 16px 12px; font-size: var(--f16); font-weight: 600; }
.sec-up { padding-top: 34px; }
.bot::after { content: ""; position: absolute; right: 2px; bottom: -6px; width: 76px; height: 76px; border-radius: 50%; border: 2px solid rgba(0,176,112,.55); background: rgba(255,255,255,.75); z-index: -1; }
.refresh, .edit, .viewall { display: flex; align-items: center; gap: 6px; color: var(--blue); font-weight: 600; font-size: var(--f15); }
.viewall { color: #333; }
.hcar { display: flex; gap: 12px; overflow-x: auto; padding: 0 16px 4px; scroll-snap-type: x mandatory; scrollbar-width: none; }
.hcar::-webkit-scrollbar { display: none; }
.h-appt { position: relative; flex: none; width: calc(100% - 44px); scroll-snap-align: start; display: flex; gap: 12px; padding: 16px 12px 20px; border: 1px solid #BDBDBD; border-radius: 10px; background: #fff; }
.h-appt-l { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.ofn { font-size: var(--f12); color: var(--muted); }
.chain { position: absolute; right: -16px; top: 50%; transform: translateY(-50%); width: 20px; height: 34px; display: grid; place-items: center; background: #fff; color: #777; z-index: 1; }
.dbadge { width: 58px; flex: none; height: 74px; border-radius: 14px; background: var(--badge-blue); color: var(--teal); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.dbadge b { font-size: var(--f28); font-weight: 600; }
.dbadge span { font-size: var(--f15); }
.dbadge small { font-size: var(--f13); }
.ac-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; font-size: var(--f14); color: #555; }
.ac-main b { color: #222; font-size: var(--f16); font-weight: 600; line-height: 1.25; }
.ac-time { color: var(--time-blue); font-weight: 600; font-size: var(--f16); margin: 2px 0; }
.ac-svc { color: #333; font-weight: 600; }
.ac-main small { color: var(--muted); font-size: var(--f13); }
.ac-side { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.cal-btn { width: 42px; height: 42px; border: 1.5px solid var(--teal); border-radius: 12px; display: grid; place-items: center; color: var(--teal); }
.cl-logo { height: auto; display: block; flex: none; }
.cl-badge { display: inline-grid; place-items: center; border-radius: 7px; background: var(--c); color: #fff; font: 800 9px/1 var(--app-font); letter-spacing: -.02em; flex: none; }
.home-empty { margin: 0 16px; border-radius: 12px; overflow: hidden; background: #D9F2EA; text-align: center; }
.home-empty svg { width: 100%; height: auto; display: block; }
.home-empty p { margin: 0; padding: 10px 12px 14px; font-size: var(--f15); color: #333; }
.ql { background: var(--grey-bg); padding-bottom: 16px; margin-top: 4px; }
.ql-grid, .svc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px; }
.svc-grid { padding: 16px; }
.ql-card { background: #fff; border-radius: 20px; min-height: 112px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 10px 6px; text-align: center; font-size: var(--f15); font-weight: 500; color: #333; line-height: 1.2; }
.chas { font: 800 12px/1 var(--app-font); color: #1B7FB0; border: 2px solid #1B7FB0; border-radius: 6px; padding: 9px 4px; }
.hp-row { display: flex; gap: 12px; padding: 0 16px; overflow: hidden; }
.hp-card { flex: none; width: 240px; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px solid #CFCFCF; border-radius: 12px; font-size: var(--f15); }
.hp-card span:last-child { display: flex; flex-direction: column; }
.hp-card small { color: var(--muted); font-size: var(--f13); }
.hp-add { width: 200px; }
.bot { position: absolute; right: 6px; bottom: 112px; width: 104px; height: 92px; z-index: 3; }
.bot svg { position: absolute; right: 10px; bottom: 0; width: 62px; height: 68px; }
.bot-say { position: absolute; right: 26px; top: 0; background: #fff; border: 2px solid var(--green); border-radius: 12px 12px 2px 12px; font-size: 10px; font-weight: 700; color: #1d4d3a; padding: 4px 7px; white-space: nowrap; z-index: 1; }
.tabbar { flex: none; height: 84px; display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid #DDD; background: #fff; padding-bottom: 22px; }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: var(--f13); color: #444; }
.tab-ic { width: 32px; height: 32px; border-radius: 8px; display: grid; place-items: center; }
.tab.on { color: #222; font-weight: 600; }
.tab.on .tab-ic { background: var(--green); color: #fff; }

/* lists */
.list { background: #fff; }
.h-block { padding: 16px; font-size: var(--f17); font-weight: 700; }
.h-block small { display: block; font-weight: 400; color: var(--muted); font-size: var(--f15); margin-top: 6px; line-height: 1.35; }
.band { background: var(--band); padding: 10px 16px; font-size: var(--f16); font-weight: 700; }
.row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 16px; border-bottom: 1px solid var(--line); background: #fff; color: #555; }
.row-slim { padding-top: 14px; padding-bottom: 14px; }
.row-top { align-items: flex-start; }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.row-main b { color: #222; font-size: var(--f17); font-weight: 600; }
.row-main b.fw5 { font-weight: 500; }
.row-main small { color: var(--muted); font-size: var(--f14); line-height: 1.35; }
.row-on { background: #F2FBF7; }
.row-star { background: #EEF8F4; }
.tile { width: 46px; height: 46px; border-radius: 10px; background: #DDF0F6; color: #1F6E8C; display: grid; place-items: center; flex: none; }
.rank { font-weight: 600; color: #222; }
.star { color: #9a9a9a; display: grid; place-items: center; width: 40px; height: 40px; }
.star.on { color: #E3A400; }
.star.on svg { fill: #F5C518; stroke: #D79A00; }

/* tabs */
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: #fff; flex: none; border-bottom: 1px solid var(--line); }
.tabs button { text-align: center; padding: 12px 0 11px; font-size: var(--f16); color: #555; border-bottom: 3px solid transparent; }
.tabs button.on { color: #222; font-weight: 600; border-bottom-color: var(--green); }

/* appointment cards */
.appt-card { margin: 16px; background: #fff; border-radius: 16px; padding: 16px 14px; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
.appt { display: flex; gap: 12px; }
.appt-actions { display: flex; gap: 10px; margin-top: 14px; }
.chain-div { position: relative; height: 34px; margin: 10px 0; }
.chain-div::before { content: ''; position: absolute; left: 0; right: 0; top: 50%; border-top: 1px solid #D5D5D5; }
.chain-div span { position: absolute; left: 22px; top: 0; height: 34px; padding: 0 4px; background: #fff; color: #888; display: grid; place-items: center; transform: rotate(90deg); }
.empty { text-align: center; padding: 50px 30px; color: #333; font-size: var(--f16); line-height: 1.4; }
.empty svg { width: 150px; height: 150px; }
.empty-form { padding-top: 34px; }

/* new appointment form */
.form-white { background: #fff; padding: 16px 16px 4px; }
.field { display: flex; align-items: center; gap: 10px; width: 100%; border: 1.5px solid #CFCFCF; border-radius: 8px; padding: 9px 14px; margin-bottom: 12px; background: #fff; min-height: 58px; text-align: left; }
.field-main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.field-main small { font-size: var(--f13); color: #666; }
.field-main b { font-size: var(--f18); font-weight: 600; color: #333; line-height: 1.25; }
.field-main input { border: 0; outline: 0; padding: 2px 0; font-size: var(--f18); font-weight: 600; color: #333; width: 100%; background: transparent; }
.field-input:focus-within { border-color: var(--teal); }
.ph { font-size: var(--f17); color: #777; }
.field-link { color: var(--blue); font-weight: 600; font-size: var(--f16); padding: 8px 0 8px 8px; }
.field-ic { color: var(--teal); }
.slots-h { padding: 18px 16px 6px; }
.slots-h b { font-size: var(--f17); }
.slots-h p { margin: 6px 0 0; color: #444; font-size: var(--f15); line-height: 1.35; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 8px 16px; }
.slot { background: #fff; border-radius: 8px; padding: 12px 6px; text-align: center; font-size: var(--f15); font-weight: 600; color: #222; line-height: 1.35; border: 2px solid transparent; }
.slot.on { background: var(--slot-blue); color: #fff; }
.footer { flex: none; background: #F0F0F0; padding: 14px 16px 30px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -2px 6px rgba(0,0,0,.06); }
.footer-white { background: #fff; }

/* location */
.loc-top { background: var(--grey-bg); padding-bottom: 14px; }
.note { background: var(--mint); padding: 12px 16px; font-size: var(--f15); display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.note p { flex-basis: 100%; margin: 4px 0 0; color: #333; line-height: 1.35; }
.search { display: flex; align-items: center; gap: 10px; margin: 14px 16px 0; padding: 0 14px; height: 52px; background: #fff; border-radius: 8px; border: 1.5px solid #E0E0E0; color: #666; }
.search input { flex: 1; border: 0; outline: 0; font-size: var(--f18); font-weight: 600; color: #222; background: transparent; min-width: 0; }
.search input::placeholder { font-weight: 400; color: #888; font-size: var(--f16); }
.search:focus-within { border-color: var(--teal); }

/* confirm */
.check-h { padding: 16px; background: #fff; flex: none; }
.check-h b { font-size: var(--f17); }
.check-h p { margin: 6px 0 0; color: #444; font-size: var(--f15); line-height: 1.4; }
.detail-card { margin: 24px 16px; background: #fff; border-radius: 16px; padding: 18px 20px 20px; display: grid; gap: 2px; }
.detail-card small { color: #444; font-size: var(--f15); margin-top: 12px; }
.detail-card small:first-child { margin-top: 0; }
.detail-card b { font-size: var(--f17); }

/* success */
.success-body { background: #fff; }
.success-top { background: #DCF3EB; padding: 30px 20px 74px; text-align: center; }
.success-tick { width: 76px; height: 76px; margin: 0 auto 14px; border-radius: 50%; background: #0B7A4B; color: #fff; display: grid; place-items: center; }
.success-tick .ic { stroke-width: 3; }
.success-h { font-size: var(--f24); font-weight: 700; line-height: 1.25; padding: 0 30px; }
.success-card { display: flex; gap: 12px; margin: -54px 16px 0; background: #fff; border-radius: 14px; padding: 16px 14px; box-shadow: 0 2px 10px rgba(0,0,0,.08); position: relative; }
.success-note { padding: 0 18px; color: #333; font-size: var(--f15); line-height: 1.45; }

/* pop-up dialogs */
.overlay { position: absolute; inset: 0; z-index: 20; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 14px; animation: fade .18s ease-out; }
.dialog { width: 100%; background: #fff; border-radius: 12px; padding: 26px 22px 20px; text-align: center; display: flex; flex-direction: column; gap: 12px; animation: pop .2s ease-out; max-height: 92%; overflow: auto; }
.dialog h3 { margin: 0; font-size: var(--f20); }
.dialog p { margin: 0 0 8px; font-size: var(--f17); line-height: 1.4; color: #333; }
.dialog p.big { font-size: var(--f18); margin: 6px 0 14px; }
.dialog .left { text-align: left; }
.scam-list { margin: 0 0 6px; padding-left: 20px; font-size: var(--f15); line-height: 1.45; display: grid; gap: 6px; }
.mini-appt { background: #F3F7F8; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 3px; font-size: var(--f15); margin-bottom: 4px; }
.dialog-cal { padding: 18px 16px 16px; }
.dp-h { display: flex; align-items: center; justify-content: space-between; }
.dp-h b { font-size: var(--f18); }
.dp-h button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; }
.dp-h button:disabled { opacity: .25; }
.dp-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.dp-dow span { font-size: var(--f13); color: #777; padding: 4px 0; }
.dp-d { height: 42px; border-radius: 50%; text-align: center; font-size: var(--f16); }
.dp-d:disabled { color: #C4C4C4; cursor: default; }
.dp-d.today { box-shadow: inset 0 0 0 1.5px var(--teal); }
.dp-d.on { background: var(--slot-blue); color: #fff; }

/* toast */
#toast { position: absolute; z-index: 40; left: 18px; right: 18px; bottom: 100px; background: rgba(30,30,30,.94); color: #fff; padding: 14px 16px; border-radius: 12px; font-size: var(--f15); line-height: 1.4; text-align: center; opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; }
#toast.show { opacity: 1; transform: none; }

/* ---------- 4. SINGPASS ---------- */
.scr-sp { background: #6c6c6c; font-family: var(--sp-font); }
.sp-sheet { position: relative; flex: 1; min-height: 0; margin-top: 18px; background: #fff; border-radius: 28px 28px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -2px 0 #0E5A3B; }
.sp-top { position: absolute; z-index: 3; top: 10px; left: 12px; right: 12px; display: flex; align-items: center; gap: 10px; }
.sp-circle { width: 48px; height: 48px; border-radius: 50%; background: #fff; border: 1px solid #E2E2E2; display: grid; place-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.08); color: #111; }
.sp-url { flex: 1; text-align: center; font-size: var(--f17); font-weight: 500; color: #111; background: rgba(255,255,255,.92); border-radius: 24px; padding: 12px 0; }
.sp-body { padding: 84px 26px 20px; }
.sp-appicon { width: 54px; height: 54px; border-radius: 14px; border: 1px solid #DDD; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.1); }
.hh-mini { width: 40px; height: auto; display: block; }
.sp-sub { color: #555; font-size: var(--f16); margin-top: 22px; line-height: 1.45; }
.sp-app { font-size: var(--f28); font-weight: 600; color: #111; margin-top: 4px; }
.sp-choose { margin-top: 26px; }
.sp-qr { display: block; position: relative; width: 200px; margin: 22px auto 30px; padding: 14px; border: 3px solid var(--sp-red); border-radius: 18px; background: #fff; }
.qr-svg { display: block; width: 100%; height: auto; }
.sp-qr-label { position: absolute; left: 50%; bottom: -14px; transform: translateX(-50%); background: #fff; padding: 0 8px; color: var(--sp-red); font-weight: 700; font-size: 20px; letter-spacing: -.02em; }
.sp-opt { display: flex; align-items: center; gap: 16px; width: 100%; min-height: 72px; margin-top: 14px; padding: 0 22px; background: #F4F4F6; border-radius: 6px; font-size: var(--f20); font-weight: 600; color: #111; }
.sp-red { color: var(--sp-red); }
.sp-stars { color: var(--sp-red); font-weight: 700; font-size: 22px; letter-spacing: 1px; border-bottom: 2px solid var(--sp-red); line-height: .9; }
.sp-new { font-style: normal; background: var(--sp-red); color: #fff; font-size: var(--f13); font-weight: 600; padding: 6px 9px; border-radius: 6px; }
.sp-foot { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; font-size: var(--f15); color: #444; }
.sp-bar { flex: none; display: flex; justify-content: space-between; padding: 10px 14px 28px; background: #F2F2F2; }
.sp-pill { width: 56px; height: 56px; border-radius: 30px; background: #fff; border: 1px solid #DDD; display: grid; place-items: center; color: #333; }
.sp-pill2 { width: auto; display: flex; gap: 30px; padding: 0 22px; }
.sp-backlink { display: flex; align-items: center; gap: 4px; color: var(--sp-red); font-weight: 600; font-size: var(--f15); }
.sp-h1 { font-size: var(--f24); font-weight: 600; color: #111; margin: 16px 0 6px; line-height: 1.25; }
.sp-practice { display: flex; gap: 10px; align-items: flex-start; background: #FFF6D6; border: 1px solid #F0D27A; color: #5B4500; border-radius: 10px; padding: 12px; font-size: var(--f14); line-height: 1.4; margin: 14px 0 6px; }
.sp-field { display: block; margin-top: 16px; cursor: pointer; }
.sp-field span { display: block; font-size: var(--f15); font-weight: 500; margin-bottom: 6px; }
.sp-field input { width: 100%; height: 52px; border: 1.5px solid #BDBDBD; border-radius: 8px; padding: 0 14px; font-size: var(--f18); cursor: pointer; background: #fff; }
.sp-btn { width: 100%; min-height: 54px; margin-top: 22px; border-radius: 8px; background: var(--sp-red); color: #fff; font-weight: 600; font-size: var(--f18); text-align: center; }
.sp-btn[aria-disabled="true"] { background: #F2B7BA; cursor: not-allowed; }
.sp-btn-outline { width: 100%; min-height: 54px; border-radius: 8px; border: 1.5px solid var(--sp-red); color: var(--sp-red); font-weight: 600; font-size: var(--f18); text-align: center; background: #fff; }
.sp-links { display: flex; justify-content: space-between; margin-top: 18px; color: var(--sp-red); font-weight: 500; font-size: var(--f15); }
.sp-otp { width: 100%; height: 64px; margin-top: 20px; border: 1.5px solid #BDBDBD; border-radius: 10px; text-align: center; font-size: 30px; letter-spacing: .5em; font-weight: 600; padding-left: .5em; }
.sp-otp:focus { border-color: var(--sp-red); outline: none; }
.sp-err { color: #C62828; font-size: var(--f15); margin-top: 8px; }
.ios-notif { position: absolute; z-index: 30; top: 52px; left: 10px; right: 10px; display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 20px; background: rgba(245,245,245,.97); box-shadow: 0 10px 30px rgba(0,0,0,.28); font-family: -apple-system, var(--app-font); animation: drop .35s ease-out; text-align: left; }
.ios-notif-ic { width: 36px; height: 36px; border-radius: 9px; background: #34C759; color: #fff; display: grid; place-items: center; flex: none; }
.ios-notif-body { flex: 1; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: var(--f14); color: #111; }
.ios-notif-body small { color: #777; }
.ios-notif-body > span { grid-column: 1 / -1; line-height: 1.35; }

/* Singpass app */
.scr-spapp { font-family: var(--sp-font); background: #F6F6F8; }
.spapp-top { flex: none; padding: 10px 22px 14px; background: #fff; border-bottom: 1px solid #EEE; }
.sp-word { color: var(--sp-red); font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
.spapp-body { padding: 18px 16px; }
.spapp-card { background: #fff; border-radius: 16px; padding: 22px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
.spapp-h { font-size: var(--f24); font-weight: 600; margin-top: 16px; color: #111; }
.spapp-meta { color: #666; font-size: var(--f14); margin-top: 4px; }
.spapp-warn { display: flex; gap: 10px; margin-top: 16px; padding: 12px; border-radius: 10px; background: #FDECEC; color: #8A1C22; font-size: var(--f14); line-height: 1.4; }
.spapp-warn .ic { flex: none; }
.spapp-shared { margin-top: 16px; font-size: var(--f15); }
.spapp-sh { font-weight: 600; color: #111; }
.spapp-shared ul { margin: 8px 0 0; padding-left: 20px; color: #333; line-height: 1.6; }
.scr-spapp .footer { gap: 10px; }
.scr-spapp .sp-btn { margin-top: 0; }

/* face check */
.scr-face { background: #0d0d0d; color: #fff; }
.scr-face .sb { align-self: stretch; }
.face-box { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 30px; text-align: center; }
.face-box .ic { stroke-width: 1.4; }
.face-box.scanning .ic { animation: scan 1s ease-in-out infinite; color: #7CE3B4; }
.face-ok { width: 110px; height: 110px; border-radius: 50%; border: 3px solid #34C759; color: #34C759; display: grid; place-items: center; animation: pop .3s ease-out; }
.face-t { font-size: var(--f22); font-weight: 600; }
.face-s { color: #BBB; font-size: var(--f15); line-height: 1.45; }
.face-actions { width: 100%; padding: 0 24px 44px; display: flex; flex-direction: column; gap: 12px; }
.face-btn { min-height: 56px; border-radius: 28px; background: #fff; color: #111; font-weight: 600; font-size: var(--f18); text-align: center; }
.face-cancel { min-height: 48px; color: #7AB8FF; font-size: var(--f17); text-align: center; }

/* ---------- coach ring ---------- */
#ring { position: absolute; z-index: 50; border: 4px solid var(--ring); border-radius: 14px; pointer-events: none; box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 22px 4px rgba(255,106,19,.55); animation: ringpulse 1.4s ease-in-out infinite; transition: top .25s, left .25s, width .25s, height .25s; }
#ring[hidden] { display: none; }
#ring.nudge { animation: nudge .5s ease-in-out 2, ringpulse 1.4s ease-in-out .9s infinite; }
.ring-label { position: absolute; right: -8px; top: -16px; background: var(--ring); color: #fff; font: 700 14px/1 var(--app-font); padding: 7px 12px; border-radius: 16px; white-space: nowrap; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
#ring.label-up .ring-label { top: auto; bottom: -16px; }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 55; overflow: hidden; }
#confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; opacity: 0; }
#confetti.go i { animation: fall 1.8s ease-in forwards; }

@keyframes ringpulse { 0%,100% { box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 10px 2px rgba(255,106,19,.45); } 50% { box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 0 26px 10px rgba(255,106,19,.6); } }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes fade { from { opacity: 0; } }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
@keyframes drop { from { transform: translateY(-120%); } }
@keyframes scan { 50% { transform: scale(1.08); opacity: .6; } }
@keyframes fall { 0% { opacity: 1; transform: translateY(0) rotate(0); } 100% { opacity: 0; transform: translateY(820px) rotate(540deg); } }

/* ---------- 5. COACH PANEL ---------- */
.coach { font-size: 1rem; line-height: 1.5; color: #1E2B2F; }
.c-brand { display: flex; align-items: center; gap: 12px; padding-bottom: 14px; border-bottom: 1px solid #E6ECEA; }
.c-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--teal); color: #fff; font-weight: 800; display: grid; place-items: center; font-size: 1rem; }
.c-brand b { display: block; font-size: 1.15rem; }
.c-brand small { color: #5A6B70; font-size: .85rem; line-height: 1.3; display: block; }
.sandbox { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 6px; padding: 12px 14px; border-radius: 12px; background: #E9F7F0; color: #0D5A3C; }
.sandbox svg { flex: none; margin-top: 2px; }
.sandbox p { margin: 0; font-size: .95rem; line-height: 1.4; }
.c-h { font-size: 1.4rem; line-height: 1.25; margin: 14px 0 6px; }
.c-sub { margin: 0 0 12px; color: #4A5B60; }
.c-top { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
.c-link { display: inline-flex; align-items: center; gap: 4px; color: #0F6390; font-weight: 600; font-size: .95rem; padding: 6px 0; }
.c-count { font-size: .9rem; color: #5A6B70; }
.c-progress { display: flex; gap: 5px; margin: 10px 0 6px; }
.c-progress i { flex: 1; height: 8px; border-radius: 4px; background: #DCE4E2; }
.c-progress i.done { background: var(--green); }
.c-progress i.now { background: var(--ring); }
.c-stepno { font-weight: 700; color: #B44A00; font-size: .95rem; }
.c-card { margin-top: 8px; padding: 16px 18px; border-radius: 14px; background: #FFF4EA; border: 2px solid #FFD2B0; }
.c-say { margin: 0; font-size: 1.3rem; line-height: 1.4; font-weight: 600; color: #1E2B2F; }
.c-tip { margin: 10px 0 0; font-size: 1rem; color: #4A5B60; line-height: 1.45; }
.c-away { background: #EEF4FF; border-color: #C3D5FF; }
.c-away .cbtn { margin-top: 12px; width: 100%; justify-content: center; }
.c-privacy { display: flex; gap: 10px; margin-top: 10px; padding: 12px 14px; border-radius: 12px; background: #EEF6FB; border-left: 4px solid #1F6E8C; color: #17485A; }
.c-privacy .ic { flex: none; margin-top: 2px; }
.c-privacy b { font-size: .95rem; }
.c-privacy p { margin: 2px 0 0; font-size: .95rem; line-height: 1.45; }
.c-note { background: #F3F5F4; border-left-color: #6B7C80; color: #2E3B3F; }
.c-nudge { margin-top: 10px; padding: 10px 14px; border-radius: 10px; background: #FFF8D6; color: #5B4500; font-size: .95rem; }
.c-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.c-actions.col { flex-direction: column; }
.c-actions.small { margin-top: 10px; justify-content: space-between; gap: 4px; }
.cbtn { flex: 1; min-height: 52px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 2px solid var(--teal); color: var(--teal); font-weight: 700; font-size: 1rem; background: #fff; text-align: center; }
.cbtn.primary { background: var(--teal); color: #fff; }
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 5px; border-radius: 14px; background: #EEF2F1; }
.mode button { min-height: 50px; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 10px; font-weight: 600; font-size: .95rem; color: #3A4B50; text-align: center; padding: 6px; }
.mode button.on { background: #fff; color: var(--teal); box-shadow: 0 1px 4px rgba(0,0,0,.12); }
.mode-help { margin: 6px 2px 12px; font-size: .9rem; color: #5A6B70; }
.lessons { display: grid; gap: 10px; }
.lesson { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 14px; border: 2px solid #DCE4E2; background: #fff; color: #5A6B70; }
.lesson:hover { border-color: var(--teal); }
.lesson-n { width: 40px; height: 40px; border-radius: 50%; background: var(--teal); color: #fff; font-weight: 800; display: grid; place-items: center; flex: none; }
.lesson-t { flex: 1; display: flex; flex-direction: column; }
.lesson-t b { color: #1E2B2F; font-size: 1.08rem; }
.lesson-t small { font-size: .88rem; line-height: 1.35; }
.lesson-free .lesson-n { background: #E9F7F0; color: var(--teal); }
.c-done { text-align: center; padding: 18px 8px 4px; }
.c-done-ic { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto; background: var(--green); color: #fff; display: grid; place-items: center; }
.c-done-ic .ic { stroke-width: 3; }
.c-done h2 { margin: 12px 0 4px; font-size: 1.6rem; }
.c-done p { margin: 0; font-size: 1.12rem; color: #33464B; }

.disp { margin-top: 16px; border-top: 1px solid #E6ECEA; padding-top: 12px; }
.disp summary { cursor: pointer; font-weight: 700; font-size: 1rem; padding: 6px 0; color: #1E2B2F; }
.presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 10px 0; }
.presets button, .seg button { min-height: 44px; border-radius: 10px; border: 2px solid #DCE4E2; font-weight: 600; font-size: .9rem; text-align: center; }
.presets button[aria-pressed="true"], .seg button[aria-pressed="true"] { border-color: var(--teal); background: #EAF1F2; color: var(--teal); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-weight: 600; }
.seg { display: flex; gap: 6px; }
.seg button { width: 52px; font-weight: 700; }
.switch { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: .98rem; cursor: pointer; }
.switch input { position: absolute; opacity: 0; }
.switch span { width: 48px; height: 28px; border-radius: 14px; background: #C9D3D1; position: relative; flex: none; transition: .2s; }
.switch span::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.switch input:checked + span { background: var(--green); }
.switch input:checked + span::after { left: 23px; }
.switch input:focus-visible + span { outline: 3px solid var(--ring); outline-offset: 2px; }

/* ---------- 6. ACCESSIBILITY MODES ---------- */
/* High contrast: darker text, stronger borders, underlined links */
html.hc { --muted: #333; --line: #8a8a8a; --band: #D4D4D4; --blue: #0B4F86; --time-blue: #0B4F86; --teal: #12303A; --green: #007A4D; }
html.hc #screen { color: #000; }
html.hc .row, html.hc .field, html.hc .h-appt, html.hc .hp-card { border-color: #555; }
html.hc .field-link, html.hc .refresh, html.hc .edit, html.hc .link-btn, html.hc .c-link { text-decoration: underline; text-underline-offset: 3px; }
html.hc .row-main small, html.hc .who-id, html.hc .greet-last, html.hc .ac-main, html.hc .ac-main small { color: #1a1a1a; }
html.hc .slot { border-color: #555; }
html.hc .btn-primary[aria-disabled="true"] { background: #6E6E6E; }
html.hc .notice { background: #111; }
html.hc .coach { color: #000; }
html.hc .c-tip, html.hc .c-sub, html.hc .mode-help, html.hc .lesson-t small, html.hc .c-brand small { color: #1a1a1a; }
html.hc .c-card { border-color: #B44A00; }
html.hc .cbtn, html.hc .lesson { border-width: 3px; }
html.hc body { background: #CFD8D6; }

/* Wider text spacing */
html.spacing #screen, html.spacing .coach { letter-spacing: .03em; word-spacing: .14em; }
html.spacing .c-say, html.spacing .c-tip, html.spacing .row-main, html.spacing .dialog p, html.spacing .slots-h p { line-height: 1.7; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

<body>
  <!--
    Layout:  [ phone with the simulated HealthHub app ]  [ Digi-Senior Kaki coach panel ]
    The phone screen (#screen) holds:
      #app   – redrawn by app.js on every change
      #ring  – the orange "tap here" ring the coach moves around
      #toast – short messages ("This part is not in today's practice")
  -->
  <main class="stage">
    <div class="phone-wrap">
      <div class="phone">
        <div id="screen">
          <div class="practice-tag" aria-hidden="true">PRACTICE</div>

/* ---------- Date helpers (all dates stored as 'YYYY-MM-DD' strings) ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function todayISO() { const t = new Date(); return toISO(t); }
function toISO(dt) { return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`; }
function fromISO(s) { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function isoAddDays(s, n) { const dt = fromISO(s); dt.setDate(dt.getDate()+n); return toISO(dt); }
function fmtLong(s) { const d = fromISO(s); return `${String(d.getDate()).padStart(2,'0')} ${MONTHS[d.getMonth()]} ${d.getFullYear()} (${DAYS[d.getDay()]})`; }
function fmtField(s) { const d = fromISO(s); return `${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtBadge(s) { const d = fromISO(s); return { day: String(d.getDate()).padStart(2,'0'), mon: MONTHS[d.getMonth()], yr: d.getFullYear(), dow: DAYS[d.getDay()] }; }
function timeToMinutes(t) { const [hm, ap] = t.split(' '); let [h, m] = hm.split(':').map(Number); if (ap === 'PM' && h !== 12) h += 12; if (ap === 'AM' && h === 12) h = 0; return h*60+m; }

/* ---------- Simple string hash so time slots are the same each time ---------- */
function hash(str) { let h = 2166136261; for (const c of str) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return Math.abs(h); }

/* Closest available slots from the chosen date (polyclinics are closed on Sundays). */
function generateSlots(fromDate, location, service) {
  const TIMES = ['08:15 AM','09:15 AM','10:10 AM','10:40 AM','11:10 AM','01:10 PM','02:15 PM','03:10 PM','04:20 PM'];
  let seed = hash(location + service + fromDate);
  const rnd = () => { seed = (Math.imul(seed, 1103515245) + 12345) >>> 0; return seed / 4294967296; };
  const slots = [];
  let day = isoAddDays(fromDate, 4 + Math.floor(rnd()*7));   // polyclinics are busy: first slot is days away
  while (slots.length < 8) {
    if (fromISO(day).getDay() !== 0) {
      const n = rnd() < 0.5 ? 1 : 2;
      const picks = [...TIMES].sort(() => rnd() - 0.5).slice(0, n).sort((a,b) => timeToMinutes(a)-timeToMinutes(b));
      picks.forEach(t => slots.length < 8 && slots.push({ date: day, time: t }));
    }
    day = isoAddDays(day, 1 + (rnd() < 0.35 ? 2 : 0));
  }
  return slots;
}

/* Nearest polyclinics for a postal code: find the closest postal sector, use its
   coordinates as "home", then sort by straight-line distance. Good enough to practise. */
function nearestPolyclinics(postal, n = 5) {
  const sector = parseInt(String(postal).slice(0, 2), 10);
  if (!/^\d{6}$/.test(postal) || isNaN(sector)) return null;
  const anchor = [...POLYCLINICS].sort((a, b) => Math.abs(a.sector - sector) - Math.abs(b.sector - sector))[0];
  return [...POLYCLINICS].sort((a, b) => dist(a, anchor) - dist(b, anchor)).slice(0, n);
  function dist(p, q) { return Math.hypot(p.lat - q.lat, p.lng - q.lng); }
}

   ---------------------------------------------------------------------
   How it works
   • All app data lives in one plain object `S` (the "state").

     current state. `render()` redraws the phone from `S`.
   • Every tappable element has data-act="actionName" (and optional
     data-arg). One click listener runs ACTIONS[actionName](arg),
     re-renders, then tells the Coach what happened.
   • data-g="…" marks elements the Coach (coach.js) can highlight.

   ===================================================================== */

const $app = document.getElementById('app');      // inside the phone screen
const $toast = document.getElementById('toast');

function freshState(overrides = {}) {
  return {
    screen: 'login',          // which screen is showing
    stack: [],                // screens to go "back" to
    loggedIn: false,
    appts: defaultAppointments(),
    apptTab: 'upcoming',      // Upcoming | Missed | Open
    draft: null,              // the appointment being booked
    modal: null,              // pop-up dialog currently open, e.g. { type:'fin' }
    preferred: [],            // favourite polyclinics (max 3)
    pref: null,               // working copy while on "Setup preferred polyclinics"
    locQuery: '',             // search text on "Select Location"
    lastLogin: '14/10/2026, 09:58 AM',
    sp: { filled: false, otp: '', otpError: false, notif: false, faceState: 'idle', faceMode: 'app' },
    ...overrides,
  };
}
let S = freshState();

/* --------------------------- NAVIGATION --------------------------- */
let resetScroll = true;
function go(screen, { replace = false } = {}) {
  if (!replace) S.stack.push(S.screen);
  S.screen = screen; S.modal = null; resetScroll = true;
}
function back() {
  S.modal = null; resetScroll = true;
  S.screen = S.stack.pop() || (S.loggedIn ? 'home' : 'login');
}
function resetTo(screen) { S.stack = []; S.screen = screen; S.modal = null; resetScroll = true; }

/* ----------------------------- TOAST ----------------------------- */
let toastTimer;
function toast(text) {
  $toast.textContent = text; $toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $toast.classList.remove('show'), 2800);
}

/* Fake QR code (looks like one, encodes nothing) */
function fakeQR() {
  const N = 29, cell = 6; let rects = '';
  let seed = 97;
  const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  const finder = (x, y) => `<rect x="${x*cell}" y="${y*cell}" width="${7*cell}" height="${7*cell}" fill="#000"/><rect x="${(x+1)*cell}" y="${(y+1)*cell}" width="${5*cell}" height="${5*cell}" fill="#fff"/><rect x="${(x+2)*cell}" y="${(y+2)*cell}" width="${3*cell}" height="${3*cell}" fill="#000"/>`;
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const inFinder = (x < 8 && y < 8) || (x > N - 9 && y < 8) || (x < 8 && y > N - 9);
    const inCentre = x > 10 && x < 18 && y > 10 && y < 18;
    if (!inFinder && !inCentre && rnd() > 0.52) rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}"/>`;
  }
  return `<svg viewBox="0 0 ${N*cell} ${N*cell}" class="qr-svg" aria-hidden="true"><g fill="#000">${rects}</g>${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}
    <rect x="${11.5*cell}" y="${11.5*cell}" width="${6*cell}" height="${6*cell}" rx="${1.4*cell}" fill="#E8313B"/>
    <circle cx="${14.5*cell}" cy="${13.4*cell}" r="${0.7*cell}" fill="#fff"/><rect x="${13.9*cell}" y="${14.4*cell}" width="${1.2*cell}" height="${2.2*cell}" rx="2" fill="#fff"/></svg>`;
}

/* The Singpass in-app browser sheet (shared by password & OTP pages) */
function spSheet(inner, overlay = '') {

    </div>${overlay}
  </div>`;

function tabBar(active) {
  const t = (k, ic, label, act) => `<button class="tab ${active === k ? 'on' : ''}" data-act="${act}" ${k === 'home' ? 'data-g="tab-home"' : ''}><span class="tab-ic">${icon(ic, 22)}</span>${label}</button>`;
  return `<nav class="tabbar">${t('home', 'home', 'Home', 'tabHome')}${t('services', 'grid', 'Services', 'tabServices')}${t('profiles', 'users', 'Health Profiles', 'tabProfiles')}</nav>`;
}

function upcoming() {
  return S.appts.filter(a => a.date >= todayISO()).sort((a, b) => (a.date + timeToMinutes(a.time)) > (b.date + timeToMinutes(b.time)) ? 1 : -1);
}
/* linked appointments (same group) are shown together with a chain icon */
function groupAppts(list) {
  const out = []; const seen = {};
  list.forEach(a => {
    if (a.group && seen[a.group]) seen[a.group].push(a);
    else { const g = [a]; out.push(g); if (a.group) seen[a.group] = g; }
  });
  return out;
}

function homeApptCard(a, all) {
  const g = a.group ? all.filter(x => x.group === a.group) : [a];
  const pos = g.indexOf(a) + 1;
  const b = fmtBadge(a.date);
  return `<div class="h-appt">
    <div class="h-appt-l">${dateBadge(a.date)}${g.length > 1 ? `<small class="ofn">${pos} of ${g.length}</small>` : ''}</div>
    <div class="ac-main"><b>${a.inst}</b><span class="ac-time">${b.dow}, ${a.time}</span><span>${a.dept}</span><small>${a.addr}</small><span class="ac-svc">${a.service}</span><small>${a.extra || ''}</small></div>
    <div class="ac-side">${clusterBadge(a.cluster, 32)}<button class="cal-btn" data-act="addCalFor" aria-label="Add to calendar">${icon('calDownload', 24)}</button></div>
    ${g.length > 1 && pos < g.length ? `<span class="chain">${icon('link', 18)}</span>` : ''}
  </div>`;
}

function apptBlock(a, linked) {
  const b = fmtBadge(a.date);
  const idx = upcoming().findIndex(x => x.id === a.id);
  return `${linked ? `<div class="chain-div"><span>${icon('link', 20)}</span></div>` : ''}
    <div class="appt">
      ${dateBadge(a.date)}
      <div class="ac-main"><b>${a.inst}</b><span class="ac-time">${b.dow}, ${a.time}</span><span>${a.dept}</span><small>${a.addr}</small><span class="ac-svc">${a.service}</span><small>${a.extra || ''}</small></div>
      <div class="ac-side">${clusterBadge(a.cluster, 32)}<button class="cal-btn" data-act="addCalFor" aria-label="Add to calendar">${icon('calDownload', 24)}</button></div>
    </div>
    <div class="appt-actions">
      <button class="btn-sm" data-g="resched-${idx}" data-act="reschedule" data-arg="${a.id}">Reschedule</button>
      <button class="btn-sm" data-g="cancel-${idx}" data-act="askCancel" data-arg="${a.id}">Cancel</button>
    </div>`;
}

function locList() {
  const q = S.locQuery.trim().toLowerCase();
  // match the start of any word, so "Ang" finds Ang Mo Kio but not Bukit Panjang
  const hit = (name) => !q || name.toLowerCase().split(/\s+/).some((w, i, arr) => arr.slice(i).join(' ').startsWith(q));
  const list = POLYCLINICS.filter(p => hit(p.name));
  const pref = S.preferred.map(n => POLYCLINICS.find(p => p.name === n)).filter(p => p && hit(p.name));
  const row = p => `<button class="row row-slim" data-g="loc-${slug(p.name)}" data-act="pickLocation" data-arg="${p.name}">${clusterBadge(p.cluster)}<span class="row-main"><b class="fw5">${p.name}</b></span>${icon('right', 22)}</button>`;
  return `${pref.length ? `<div class="band">Preferred Polyclinics</div>${pref.map(row).join('')}` : ''}
    <div class="band">List of Polyclinics</div>
    ${list.length ? list.map(row).join('') : `<p class="muted pad">No polyclinic matches “${S.locQuery}”. Check the spelling, or clear the search box.</p>`}
    <div style="height:24px"></div>`;
}

/* =====================================================================
   MODALS (pop-up dialogs)
   ===================================================================== */
function renderModal() {
  const m = S.modal; if (!m) return '';
  const wrap = (inner, cls = '') => `<div class="overlay"><div class="dialog ${cls}" role="dialog" aria-modal="true">${inner}</div></div>`;
  switch (m.type) {
    case 'fin': return wrap(`<h3>Financial Assistance is Available</h3><p>Need help with your medical bills? Book a Financial Counselling appointment</p>
      <button class="btn btn-primary" data-g="fin-close" data-act="closeModal">Close</button>`);
    case 'cancelConfirm': {
      const a = S.appts.find(x => x.id === m.id);
      return wrap(`<h3>Cancel Appointment</h3><p>Are you sure you want to cancel this appointment?</p>
        <div class="mini-appt"><b>${a.inst}</b><span>${fmtLong(a.date)}, ${a.time}</span><span>${a.service}</span></div>
        <button class="btn btn-primary" data-g="cancel-yes" data-act="doCancel" data-arg="${a.id}">Yes</button>
        <button class="btn btn-outline" data-act="closeModal">No</button>`);
    }
    case 'cancelled': return wrap(`<p class="big">Appointment cancelled successfully.</p><button class="btn btn-primary" data-g="cancel-ok" data-act="closeModal">OK</button>`);
    case 'prefSaved': return wrap(`<h3>Setup Successful</h3><p>Your preferred polyclinics have been saved successfully.</p><button class="btn btn-primary" data-g="pref-close" data-act="prefDone">Close</button>`);
    case 'notice': return wrap(`<h3>Important Notices</h3><p class="left">Due to scheduled maintenance, some services will be unavailable from 28 Oct 12am to 2am. Health records, HealthierSG, and appointments will not be accessible during this time.</p><button class="btn btn-primary" data-act="closeModal">Close</button>`);
    case 'scam': return wrap(`<h3>Beware of Impersonation Scams!</h3>
      <ul class="left scam-list"><li>HealthHub and MOH will <b>never</b> ask you to transfer money or buy gift cards.</li><li>Never share your Singpass password or OTP with anyone, even if they say they are from the government.</li><li>Only log in through the official HealthHub app or website.</li><li>If unsure, hang up and call the ScamShield Helpline at 1799.</li></ul>
      <button class="btn btn-primary" data-act="closeModal">Close</button>`);
    case 'logout': return wrap(`<h3>Log out?</h3><p>You will need to log in with Singpass again.</p><button class="btn btn-primary" data-g="logout-yes" data-act="doLogout">Log out</button><button class="btn btn-outline" data-act="closeModal">Stay logged in</button>`);
    case 'exitBooking': return wrap(`<h3>Exit without booking?</h3><p>Your selections will not be saved.</p><button class="btn btn-primary" data-act="exitBooking">Exit</button><button class="btn btn-outline" data-act="closeModal">Continue booking</button>`);
    case 'date': return wrap(datePicker(m), 'dialog-cal');
  }
  return '';
}

function datePicker(m) {
  const first = new Date(m.y, m.m, 1); const days = new Date(m.y, m.m + 1, 0).getDate();
  const today = todayISO(); let cells = '';
  for (let i = 0; i < first.getDay(); i++) cells += '<span></span>';
  for (let d = 1; d <= days; d++) {
    const iso = toISO(new Date(m.y, m.m, d)); const past = iso < today; const sel = iso === S.draft.date;
    cells += `<button class="dp-d ${sel ? 'on' : ''} ${iso === today ? 'today' : ''}" ${past ? 'disabled' : ''} data-act="pickDate" data-arg="${iso}">${d}</button>`;
  }
  const mm = new Date(); const atStart = m.y === mm.getFullYear() && m.m === mm.getMonth();
  return `<div class="dp-h"><button data-act="dpMonth" data-arg="-1" ${atStart ? 'disabled' : ''} aria-label="Previous month">${icon('left', 22)}</button><b>${['January','February','March','April','May','June','July','August','September','October','November','December'][m.m]} ${m.y}</b><button data-act="dpMonth" data-arg="1" aria-label="Next month">${icon('right', 22)}</button></div>
    <div class="dp-grid dp-dow">${DAYS.map(d => `<span>${d[0]}</span>`).join('')}</div>
    <div class="dp-grid">${cells}</div>
    <button class="btn btn-outline" data-act="closeModal">Cancel</button>`;
}

/* =====================================================================
   ACTIONS — what each tap does. Return 'norender' to skip redraw.
   ===================================================================== */
const ACTIONS = {
  noop() { toast(NOT_IN_PRACTICE); return 'norender'; },
  back() { back(); },
  closeFlow() { resetTo('home'); S.draft = null; },
  closeModal() { S.modal = null; },

  /* logged-out screen */
  notice() { S.modal = { type: 'notice' }; },
  scam() { S.modal = { type: 'scam' }; },
  explore() { toast(NOT_IN_PRACTICE + ' Please log in to practise.'); return 'norender'; },
  notifs() { go('notifs'); },
  openSingpass() { S.sp = { filled: false, otp: '', otpError: false, notif: false, faceState: 'idle', faceMode: 'app' }; go('singpass'); },

  /* Singpass */
  spClose() { resetTo('login'); },
  spOpenApp() { go('spapp'); },
  spPasskey() { S.sp.faceMode = 'passkey'; S.sp.faceState = 'idle'; go('spface'); },
  spPassword() { go('sppass'); },
  spFill() { S.sp.filled = true; },
  spPwLogin() {
    if (!S.sp.filled) { toast('Tap the boxes above to fill in the practice details first.'); return 'norender'; }
    S.sp.otp = ''; S.sp.notif = false; go('spotp');
    setTimeout(() => { if (S.screen === 'spotp') { S.sp.notif = true; render(); } }, 1400);
  },
  fillOtp() { S.sp.otp = '482913'; S.sp.notif = false; S.sp.otpError = false; },
  spResend() { S.sp.notif = true; toast('A new OTP was sent (practice).'); },
  spOtp() {
    if (S.sp.otp.length !== 6) return 'norender';
    if (S.sp.otp !== '482913') { S.sp.otpError = true; return; }
    loginSuccess();
  },
  spApprove() { S.sp.faceMode = 'app'; S.sp.faceState = 'idle'; go('spface'); },
  spDeny() { back(); toast('Login cancelled.'); },
  spFace() {
    S.sp.faceState = 'scanning';
    setTimeout(() => { S.sp.faceState = 'done'; render(); setTimeout(() => { loginSuccess(); render(); }, 700); }, 1100);
  },

  /* bottom tabs + home */
  tabHome() { resetTo('home'); },
  tabServices() { resetTo('services'); },
  tabProfiles() { resetTo('profiles'); },
  settings() { go('settings'); },
  askLogout() { S.modal = { type: 'logout' }; },
  doLogout() { S.loggedIn = false; if (S.nextLastLogin) S.lastLogin = S.nextLastLogin; resetTo('login'); },
  refresh() { toast('Appointments are up to date.'); return 'norender'; },
  healthierSG() { toast(NOT_IN_PRACTICE); return 'norender'; },
  chatbot() { toast('The chatbot is not part of this practice. Use the guide on the side instead.'); return 'norender'; },
  addCalFor() { toast('Added to your phone’s calendar (practice).'); return 'norender'; },
  switchUser() { toast('You only have one profile in this practice.'); return 'norender'; },

  /* appointments */
  openAppts() { S.apptTab = 'upcoming'; go('appointments'); },
  apptTab(k) { S.apptTab = k; },
  newAppt() { go('institution'); },
  newApptFromHome() { S.stack.push('home'); S.screen = 'appointments'; go('institution'); },
  hospital(name) { toast(`${name}: booking hospital appointments is not in this practice. Try "Book Polyclinic Appointment".`); return 'norender'; },
  bookPoly() { S.draft = { service: 'Doctor Consultation', location: null, date: todayISO(), slot: null }; go('newappt'); },
  changeService() { go('service'); },
  pickService(s) {
    const changed = S.draft.service !== s;
    S.draft.service = s; if (changed) S.draft.slot = null; back();
  },
  selectLocation() { S.locQuery = ''; go('location'); },
  pickLocation(name) {
    if (S.draft.location !== name) S.draft.slot = null;
    S.draft.location = name; back();
  },
  openDate() { const d = fromISO(S.draft.date); S.modal = { type: 'date', y: d.getFullYear(), m: d.getMonth() }; },
  dpMonth(n) { let { y, m } = S.modal; m += Number(n); if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.modal = { ...S.modal, y, m }; },
  pickDate(iso) { S.draft.date = iso; S.draft.slot = null; S.modal = null; },
  pickSlot(arg) { const [date, time] = arg.split('|'); S.draft.slot = { date, time }; },
  next() {
    if (!S.draft.slot) { toast('Please choose a time slot first.'); return 'norender'; }
    go('confirm');
  },
  cancelBooking() { S.modal = { type: 'exitBooking' }; },
  exitBooking() { S.draft = null; S.modal = null; S.apptTab = 'upcoming'; S.stack = ['home']; S.screen = 'appointments'; resetScroll = true; },
  confirm() {
    const d = S.draft; const p = POLYCLINICS.find(x => x.name === d.location);
    if (d.rescheduleId) S.appts = S.appts.filter(a => a.id !== d.rescheduleId);
    const id = 'n' + Date.now();
    S.appts.push({ id, inst: d.location, cluster: p ? p.cluster : 'SH', date: d.slot.date, time: d.slot.time, dept: 'Polyclinic', addr: 'Level 1, Clinic A, Room 12', service: d.service, extra: '', group: null });
    S.lastBookedId = id;
    S.stack = ['home']; S.screen = 'success'; resetScroll = true;
    S.modal = { type: 'fin' };
  },
  viewAppts() { S.draft = null; S.apptTab = 'upcoming'; S.stack = ['home']; S.screen = 'appointments'; S.modal = null; resetScroll = true; },
  addCal() { toast('Added to your phone’s calendar (practice). Your phone will remind you.'); return 'norender'; },
  reschedule(id) {
    const a = S.appts.find(x => x.id === id);
    const isPoly = POLYCLINICS.some(p => p.name === a.inst);
    if (!isPoly) { toast('For hospital appointments, please call the hospital to reschedule. Try with a polyclinic appointment.'); return 'norender'; }
    S.draft = { service: a.service, location: a.inst, date: todayISO(), slot: null, rescheduleId: id }; go('newappt');
  },
  askCancel(id) { S.modal = { type: 'cancelConfirm', id }; },
  doCancel(id) { S.appts = S.appts.filter(a => a.id !== id); S.modal = { type: 'cancelled' }; },

  /* preferred polyclinics */
  openPref() { S.pref = { postal: '', searched: '', error: false, sel: [...S.preferred] }; go('pref'); },
  postalSearch() {
    const v = S.pref.postal.trim();
    if (!/^\d{6}$/.test(v)) { S.pref.error = true; S.pref.searched = ''; return; }
    S.pref.error = false; S.pref.searched = v;
  },
  clearPostal() { S.pref.searched = ''; S.pref.postal = ''; },
  toggleStar(name) {
    const sel = S.pref.sel; const i = sel.indexOf(name);
    if (i >= 0) sel.splice(i, 1);
    else if (sel.length >= 3) { toast('You can choose up to 3. Tap a yellow star to remove one first.'); return 'norender'; }
    else sel.push(name);
  },
  savePref() {
    if (!S.pref.sel.length) { toast('Tap the star next to at least one polyclinic first.'); return 'norender'; }
    S.preferred = [...S.pref.sel]; S.modal = { type: 'prefSaved' };
  },
  prefDone() { S.modal = null; back(); },
};

function loginSuccess() {
  const prev = S.lastLogin;
  S.loggedIn = true; resetTo('home');
  S.lastLogin = prev;
  const n = new Date(); const h = n.getHours() % 12 || 12;
  S.nextLastLogin = `${String(n.getDate()).padStart(2, '0')}/${String(n.getMonth() + 1).padStart(2, '0')}/${n.getFullYear()}, ${String(h).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')} ${n.getHours() < 12 ? 'AM' : 'PM'}`;
}

/* =====================================================================
   RENDER + EVENT WIRING
   ===================================================================== */
function render() {
  const body = $app.querySelector('.body');
  const keep = !resetScroll && $app.dataset.screen === S.screen && body ? body.scrollTop : 0;
  const car = $app.querySelector('.hcar'); const keepX = car && !resetScroll ? car.scrollLeft : 0;
  $app.innerHTML = (SCREENS[S.screen] || SCREENS.home)() + renderModal();
  $app.dataset.screen = S.screen;
  const nb = $app.querySelector('.body'); if (nb) nb.scrollTop = keep;
  const nc = $app.querySelector('.hcar'); if (nc) nc.scrollLeft = keepX;
  resetScroll = false;
  if (typeof Coach !== 'undefined') Coach.afterRender();
}

/* One click handler for the whole phone */
$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (typeof Coach !== 'undefined') Coach.onTap(e, el);
  if (!el || !$app.contains(el)) return;
  if (el.getAttribute('aria-disabled') === 'true') {
    if (el.dataset.act === 'next') toast('Please choose a time slot first.');
    else if (el.dataset.act === 'spPwLogin') toast('Tap the boxes above to fill in the practice details first.');
    return;
  }
  const act = el.dataset.act, arg = el.dataset.arg;
  const fn = ACTIONS[act]; if (!fn) return;
  const r = fn(arg, el);
  if (r !== 'norender') render();
  if (typeof Coach !== 'undefined') Coach.onAction(act, arg);
});

/* Text boxes: update state without redrawing the whole screen (keeps the keyboard open) */
$app.addEventListener('input', (e) => {
  const k = e.target.dataset.in; if (!k) return;
  const v = e.target.value;
  if (k === 'locQuery') { S.locQuery = v; document.getElementById('locList').innerHTML = locList(); if (typeof Coach !== 'undefined') Coach.afterRender(); }
  if (k === 'postal') { S.pref.postal = v.replace(/\D/g, '').slice(0, 6); if (e.target.value !== S.pref.postal) e.target.value = S.pref.postal; }
  if (k === 'otp') {
    S.sp.otp = v.replace(/\D/g, '').slice(0, 6); e.target.value = S.sp.otp; S.sp.otpError = false;
    const b = document.getElementById('otpBtn'); if (b) b.setAttribute('aria-disabled', S.sp.otp.length === 6 ? 'false' : 'true');
  }
});
$app.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter') return;
  const k = e.target.dataset && e.target.dataset.in;
  if (k === 'postal') { ACTIONS.postalSearch(); render(); if (typeof Coach !== 'undefined') Coach.onAction('postalSearch'); }
  if (k === 'otp' && S.sp.otp.length === 6) { ACTIONS.spOtp(); render(); if (typeof Coach !== 'undefined') Coach.onAction('spOtp'); }
});

/* Keep the status-bar clock ticking */
setInterval(() => document.querySelectorAll('.sb-time').forEach(t => t.textContent = clock()), 20000);

/* Used by the coach to put the app into a known starting point */
function setAppState(next) { S = next; resetScroll = true; render(); }
function getAppState() { return S; }

</script>
  <script>
/* =====================================================================
   coach.js — "Digi-Senior Kaki" practice guide (the side panel)
   ---------------------------------------------------------------------
   Features from the Features deck (MoSCoW):
   MUST   • Do-it-with-me guidance   → step card + pulsing ring on the button
          • Practice sandbox          → fake data, "Take me back", "Start again"
          • Quick sign-in             → each lesson starts at the right place;
                                         practice Singpass details fill with one tap
          • Large text / High contrast / Simple layout / Linear navigation
   SHOULD • On-demand hints           → "Try on my own" mode + "Show me where"
          • Just-in-time privacy notes→ shown on the exact step they matter
   COULD  • Voice                     → "Read aloud" (browser text-to-speech)
          • Text spacing, display profiles (presets)
   WON'T (not built, as decided): async modules, self-paced library, multilingual,
          scam pop-quiz, call-a-volunteer, Senior Tech Buddy, tiers, achievements.
   ===================================================================== */

const Coach = (() => {
  const $panel = document.getElementById('coachMain');
  const $ring = document.getElementById('ring');

  /* ---------------- LESSONS ----------------

  const LESSONS = [
    {
      id: 'login', title: 'Log in with Singpass', mins: 2,

      setup: () => freshState({ screen: 'login' }),

        { screen: 'spapp', target: '[data-g=spapp-login]', match: a => a === 'spApprove',

          tip: 'Only tap Log in if YOU started this. If someone on the phone told you to, tap Cancel.',
          privacy: 'HealthHub will receive your name and NRIC from Singpass. This is normal for government health apps. Nothing else is shared.' },
        { screen: 'spface', target: '[data-g=face-scan]', match: a => a === 'spFace',
          say: 'Show it is you. Tap “Scan my face”.',
          tip: 'On a real phone, just look at the screen. You can also use your fingerprint or your 6-digit Singpass passcode.' },
      ],
      done: 'You are logged in! At the top it says “welcome back” with your name.',
    },
    {
      id: 'book', title: 'Book a polyclinic appointment', mins: 4,
      blurb: 'Choose a service, a polyclinic and a time.',
      setup: () => freshState({ screen: 'home', loggedIn: true }),
      steps: [
        { screen: 'home', target: '[data-g=ql-appointments]', match: a => a === 'openAppts',
          say: 'Tap “Appointments” under Quick Links.',
          tip: 'Scroll down a little if you cannot see it. The “Manage Appointments” button works too.' },
        { screen: 'appointments', target: '[data-g=make-new]', match: a => a === 'newAppt',
          say: 'Tap “Make new appointment”.' },
        { screen: 'institution', target: '[data-g=book-poly]', match: a => a === 'bookPoly',
          say: 'Tap “Book Polyclinic Appointment”.',
          tip: 'Hospitals are listed further down. Today we practise with a polyclinic.' },
        { screen: 'newappt', target: '[data-g=svc-change]', match: a => a === 'changeService',
          say: 'The app has chosen “Doctor Consultation” for you. To pick a different service, tap “Change”.',
          tip: 'Change is the blue word on the right of Service Type.' },
        { screen: 'service', target: '[data-g=svc-driving-licence-medical-examination]', match: a => a === 'pickService',
          say: 'Pick the service you need. For practice, scroll down and tap “Driving Licence Medical Examination”.',

        { screen: 'newappt', target: '[data-g=loc-select]', match: a => a === 'selectLocation',
          say: 'Now choose where to go. Tap “Select” next to Location.' },
        { screen: 'location', target: '[data-g=loc-ang-mo-kio-polyclinic]', match: a => a === 'pickLocation',
          say: 'Tap the polyclinic you want. For practice, tap “Ang Mo Kio Polyclinic”.',

      ],

    },
    {
      id: 'cancel', title: 'Cancel an appointment', mins: 2,
      blurb: 'Find an appointment and cancel it.',
      setup: () => freshState({ screen: 'home', loggedIn: true }),
      steps: [
        { screen: 'home', target: '[data-g=manage]', match: a => a === 'openAppts',
          say: 'Tap “Manage Appointments”.',
          tip: 'It is the dark button under your upcoming appointments.' },
        { screen: 'appointments', target: '[data-g=cancel-0]', match: a => a === 'askCancel',
          say: 'Find the appointment you want to cancel. For practice, tap “Cancel” under the first one.',
          tip: 'Read the date and the place first, so you cancel the right one.' },
        { screen: 'appointments', modal: 'cancelConfirm', target: '[data-g=cancel-yes]', match: a => a === 'doCancel',
          say: 'The app checks if you are sure. Tap “Yes”.',
          tip: 'Changed your mind? Tap “No” and nothing happens.' },
        { screen: 'appointments', modal: 'cancelled', target: '[data-g=cancel-ok]', match: a => a === 'closeModal',
          say: 'Done. Tap “OK”.' },
      ],
      done: 'The appointment is cancelled. It is no longer in your Upcoming list.',
    },
    {
      id: 'pref', title: 'Save favourite polyclinics', mins: 3,
      blurb: 'So your polyclinic shows at the top next time.',
      setup: () => freshState({ screen: 'home', loggedIn: true }),
      steps: [
        { screen: 'home', target: '[data-g=ql-appointments]', match: a => a === 'openAppts',
          say: 'Tap “Appointments” under Quick Links.' },
        { screen: 'appointments', target: '[data-g=make-new]', match: a => a === 'newAppt',
          say: 'Tap “Make new appointment”.' },
        { screen: 'institution', target: '[data-g=setup-pref]', match: a => a === 'openPref',
          say: 'Tap “Setup Preferred Polyclinics”.' },
        { screen: 'pref', target: s => s.pref && s.pref.postal.length === 6 ? '[data-g=postal-search]' : '[data-g=postal]', match: a => a === 'postalSearch',
          say: 'Type your postal code in the box, then tap “Search”. For practice, type 545025.',
          tip: 'Tap the box first and the number keypad will appear.',
          privacy: 'Your postal code is only used to find polyclinics near you.' },
        { screen: 'pref', target: s => s.pref && s.pref.sel.length ? '[data-g=pref-save]' : '[data-g=star-near-0]', match: (a, _, s) => a === 'savePref' && s.modal,
          say: 'Tap the star next to up to 3 polyclinics you like. Then tap “Save”.',
          tip: 'A yellow star with a number means it is chosen. Tap it again to remove it.' },
        { screen: 'pref', modal: 'prefSaved', target: '[data-g=pref-close]', match: a => a === 'prefDone',
          say: 'Saved! Tap “Close”.' },
      ],
      done: 'Your favourite polyclinics will now show at the top when you choose a location.',
    },
  ];

  /* ---------------- coach state ---------------- */
  let lesson = null;     // current lesson object (null = menu / free practice)
  let idx = 0;           // current step number
  let finished = false;
  let free = false;      // free practice
  let mode = 'guide';    // 'guide' = Do it with me, 'own' = Try on my own
  let showNow = false;   // ring shown on demand in 'own' mode
  let misses = 0;        // taps on the wrong thing for this step
  let snapshot = null;   // app state at the start of the step ("Take me back")
  let autoRead = false;
  let lastScrolledStep = -1;

  const clone = (o) => JSON.parse(JSON.stringify(o));
  const step = () => (lesson && !finished ? lesson.steps[idx] : null);
  const sel = (st) => (typeof st.target === 'function' ? st.target(getAppState()) : st.target);

  /* Where is the person compared with where the step expects them? */
  function status(st) {
    const s = getAppState();
    if (st.screen !== s.screen) return 'away';
    if (st.modal && (!s.modal || s.modal.type !== st.modal)) return 'away';

  /* ---------------- lesson control ---------------- */

  function onAction(act, arg) {
    const st = step(); if (!st) return;
    if (st.match(act, arg, getAppState())) {
