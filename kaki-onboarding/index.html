</script>
<script>
/* ================= Kaki Prototype v3 (from v2.1) =================
   All words on screen come from STR (one dictionary, keyed by ID) through t().
   Pictures (KAKI, TEACH, DUO, PLANT, TILE) and icon paths (P) are kept from v2. */

P.help='M12 3a9 9 0 100 18 9 9 0 000-18zM9.5 9.5a2.5 2.5 0 015 0c0 1.7-2.5 2-2.5 4M12 17h.01';
P.stop='M7 7h10v10H7z';P.logout='M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10';P.keyboard='M3 7h18v10H3zM6.5 10.5h1M9.5 10.5h1M12.5 10.5h1M15.5 10.5h1M7 14h10';
function ic(n,w){return `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w||2.2}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${P[n]||''}"/></svg>`}
const HAND_DOWN=`<svg viewBox="0 0 24 24" fill="#FFF6E0" stroke="#1A1A1A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="transform:rotate(180deg)"><path d="${P.hand}"/></svg>`;

/* ---------- language ---------- */
const LANGS=['en','zh','ms','ta'];
const NATIVE={en:'English',zh:'中文',ms:'Bahasa Melayu',ta:'தமிழ்'};
const NATIVE_SHORT={en:'English',zh:'中文',ms:'Melayu',ta:'தமிழ்'};
const MISSING=new Set();
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function attr(s){return String(s).replace(/"/g,'&quot;')}
function t(id,vars){
  const e=STR[id];let s;
  if(!e){if(!MISSING.has(id)){MISSING.add(id);console.warn('[kaki] missing text id:',id)}s=id}
  else{s=e[S.lang];if(s==null||s===''){const k=id+' ('+S.lang+')';if(!MISSING.has(k)){MISSING.add(k);console.warn('[kaki] missing translation:',k)}s=e.en}}
  if(vars)for(const k in vars)s=s.split('{'+k+'}').join(esc(vars[k]));
  return s;
}
const plain=s=>String(s).replace(/<[^>]+>/g,' ').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/\s+/g,' ').trim();

/* ---------- state ---------- */
const STYLES=[{skin:'#F2C7A5',hair:'#CBD2DC',top:'#2B59C3',glasses:true},{skin:'#D9A47C',hair:'#1B2333',top:'#0F7B5F',glasses:false},{skin:'#F7D7C4',hair:'#F1F3F6',top:'#B0245E',glasses:true},{skin:'#B07A55',hair:'#8E97A4',top:'#FCDE63',glasses:false},{skin:'#7A4E33',hair:'#1B2333',top:'#6B4FBB',glasses:true},{skin:'#F2C7A5',hair:'#6B4423',top:'#0B7285',glasses:false}];
const GSTYLES={f:[0,2,5],m:[1,3,4]};
const DEF={screen:'splash',lang:'en',scale:1,dark:false,readAuto:false,name:'Lim',title:'mdm',
 av:Object.assign({g:'f'},STYLES[0]),style:0,
 answers:[null,null,null],level:null,onboarded:false,account:null,accMode:'phone',phone:'',otp:'',
 mode:null,step:0,amt:null,wrong:0,hints:0,watch:false,showPoint:false,oops:[],t0:0,peek:false,watched:false,
 garden:{banking:0,health:0,singpass:0,safety:0,transport:0,family:0},stamps:[],
 chat:[],chatKeep:'7',listening:false,draft:'',scamText:'',scamResult:null,lessonIdx:0,quiz:null,
 banks:['DBS / POSB'],service:'paynow',guide:'health',gstep:0,gwrong:false,gpeek:false,
 sheet:null,note:null,page:{},tip:false,voiceSet:null,typeMode:false,codeSent:false,annot:false,loggedOut:false};
function clone(o){return JSON.parse(JSON.stringify(o))}
let S=clone(DEF);
try{const sv=JSON.parse(localStorage.getItem('kaki-proto-v3')||'null');if(sv)S=Object.assign(clone(DEF),sv)}catch(e){}
function save(){try{localStorage.setItem('kaki-proto-v3',JSON.stringify(S))}catch(e){}}
const app=document.getElementById('app');
let stack=[],lastSaid='';
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function nm(){return S.title==='none'?(S.name||t('name.friend')):t('name.fmt',{title:t('title.'+S.title),name:S.name||t('name.friend')})}
function homeFor(){return S.level===3?'home':'path'}
function go(s,o){if(!(o&&o.replace))stack.push(S.screen);S.screen=s;S.sheet=null;render()}
function back(){
  if(S.sheet){S.sheet=null;render();return}
  if(S.screen==='task'){S.sheet={k:'quit'};render();return}
  if(S.screen==='scamlesson'&&S.lessonIdx>0){S.lessonIdx--;S.quiz=null;render();return}
  if(S.screen==='guide'&&S.gstep>0){S.gstep--;S.gwrong=false;render();return}
  if(S.screen==='chat'&&S.listening){S.listening=false;render();return}
  S.screen=stack.pop()||(S.onboarded&&!S.loggedOut?homeFor():'splash');
  if(S.screen==='splash')stack=[];
  render();
}
function note(k,v){S.note={k,v:v||null};noteNew=true}
let noteNew=false;

/* ---------- read aloud: en-SG, zh-CN, ms-MY, ta-IN, else the nearest voice ---------- */
const VOICE={en:['en-SG','en'],zh:['zh-CN','zh'],ms:['ms-MY','ms','id'],ta:['ta-IN','ta']};
function pickVoice(lang){
  const vs=('speechSynthesis' in window)?speechSynthesis.getVoices():[];const want=VOICE[lang];
  const norm=x=>(x.lang||'').replace('_','-').toLowerCase();
  let v=vs.find(x=>norm(x)===want[0].toLowerCase());if(v)return {v,near:false};
  for(const pre of want.slice(1)){v=vs.find(x=>norm(x).split('-')[0]===pre);if(v)return {v,near:pre!==lang}}
  return {v:null,near:vs.length>0};
}
/* v3: the Hear button that started reading turns into Stop, and the words being read get a blue outline */
let speakingNow=false,speakingEl=null,speakTok=0;const nearShown={};
function setSpeaking(on,el){
  speakingNow=on;speakingEl=on?(el||null):null;app.classList.toggle('is-speaking',on);
  app.querySelectorAll('.reading').forEach(x=>x.classList.remove('reading'));
  if(on&&el)el.classList.add('reading');
  const hb=app.querySelector('.ub.hearall');if(hb)hb.setAttribute('aria-pressed',String(on));
}
function stopSpeaking(){speakTok++;try{speechSynthesis.cancel()}catch(e){}setSpeaking(false)}
function speak(text,el){
  if(!text)return;
  try{
    if(!('speechSynthesis' in window))throw 0;
    const tok=++speakTok;
    const u=new SpeechSynthesisUtterance(plain(text));const p=pickVoice(S.lang);
    u.lang=VOICE[S.lang][0];if(p.v)u.voice=p.v;u.rate=.9;
    u.onend=u.onerror=()=>{if(tok===speakTok)setSpeaking(false)};
    speechSynthesis.cancel();speechSynthesis.speak(u);setSpeaking(true,el);
    const poll=setInterval(()=>{if(tok!==speakTok){clearInterval(poll);return}if(!speechSynthesis.speaking&&!speechSynthesis.pending){clearInterval(poll);setSpeaking(false)}},900);
    if(p.near&&!nearShown[S.lang]){nearShown[S.lang]=1;note('speak.near',{lang:t('langname.'+S.lang)});render()}
  }catch(e){note('speak.none');render()}
}
if('speechSynthesis' in window){try{speechSynthesis.getVoices()}catch(e){}}

/* ---------- avatar ---------- */
function avatar(av,size,bg){
  const hair=av.g==='f'
   ?`<path d="M58 86 C56 52 80 40 100 40 C122 40 146 54 142 86 C134 66 118 60 100 60 C84 60 66 68 58 86 Z" fill="${av.hair}"/><circle cx="100" cy="38" r="15" fill="${av.hair}"/>`
   :`<path d="M60 82 C58 54 78 46 100 46 C124 46 142 56 140 82 C132 70 118 64 100 64 C84 64 68 70 60 82 Z" fill="${av.hair}"/>`;
  const collar=av.g==='f'?`<path d="M86 140 L100 156 L114 140" stroke="#FFFFFF" stroke-width="5" fill="none" stroke-linecap="round" opacity=".7"/>`:`<path d="M84 136 L100 150 L116 136 L110 196 H90 Z" fill="#FFFFFF" opacity=".85"/><path d="M96 150 L100 176 L104 150 Z" fill="#1B2333" opacity=".6"/>`;
  return `<svg viewBox="0 0 200 200" width="${size}" height="${size}" aria-hidden="true"><circle cx="100" cy="100" r="96" style="fill:${bg||'var(--card)'}"/><path d="M36 196 C40 150 64 132 100 132 C136 132 160 150 164 196 Z" fill="${av.top}"/>${collar}<rect x="90" y="112" width="20" height="24" rx="8" fill="${av.skin}"/><circle cx="100" cy="88" r="40" fill="${av.skin}"/>${hair}<ellipse cx="86" cy="92" rx="4.5" ry="5.5" fill="#1B2333"/><ellipse cx="114" cy="92" rx="4.5" ry="5.5" fill="#1B2333"/>${av.glasses?'<g stroke="#1B2333" stroke-width="3.5" fill="none"><circle cx="86" cy="92" r="11"/><circle cx="114" cy="92" r="11"/><path d="M97 92 H103"/></g>':''}<path d="M88 108 Q100 117 112 108" stroke="#1B2333" stroke-width="3.5" fill="none" stroke-linecap="round"/><ellipse cx="72" cy="104" rx="7" ry="4.5" fill="#F06292" opacity=".35"/><ellipse cx="128" cy="104" rx="7" ry="4.5" fill="#F06292" opacity=".35"/></svg>`;
}
const px=n=>Math.round(n*S.scale);

/* ---------- shared pieces ---------- */
function btn(cls,a,v,label,icon,extra){return `<button class="btn ${cls}" data-a="${a}"${v!=null?` data-v="${attr(v)}"`:''} ${extra||''}>${icon?ic(icon,2.6):''}<span>${label}</span></button>`}
function choice(o){
  const st=o.role==='radio'?`role="radio" aria-checked="${!!o.on}"`:(o.toggle?`aria-pressed="${!!o.on}"`:'');
  const mark=o.role==='radio'||o.toggle?`<span class="rd">${o.on?ic('check',3):''}</span>`:'';
  return `<button class="choice ${o.cls||''}" data-a="${o.a}"${o.v!=null?` data-v="${attr(o.v)}"`:''} ${st}>${o.icon?`<span class="pi ${o.tint||''}">${ic(o.icon)}</span>`:mark}<span class="grow"><b>${o.title}</b>${o.sub?`<span class="sub">${o.sub}</span>`:''}</span>${o.icon&&(o.role||o.toggle)?mark:''}${o.arrow?ic('right',2.6):''}</button>`;
}
/* v3: one labelled Hear button, always placed next to the words it reads */
function hear(text){return `<button class="hear" data-a="hearThis" data-v="${esc(plain(text))}"><span class="h-go">${ic('speak')}<span>${t('btn.hearThis')}</span></span><span class="h-stop">${ic('stop')}<span>${t('btn.stop')}</span></span></button>`}
function kbub(label,text,oops){return `<div class="kbub"><span class="kk">${KAKI}</span><div class="bb hearable"><div class="cardhead">${label?`<small>${label}</small>`:''}${hear(text+(oops?' '+oops:''))}</div><span>${text}</span>${oops?`<em>${oops}</em>`:''}</div></div>`}
/* v3: extra actions live in the page, so the action area keeps one main button and at most one other */
function more(items){return `<p class="sec">${t('more.title')}</p><div class="list" style="margin-top:.5em">${items.map(([a,v,icon,label,tint])=>choice({a,v,icon,tint,title:label,arrow:true})).join('')}</div>`}
/* v3: sticky step bar for do-it-with-me screens */
function nowbar(n,of,short,say){return `<div class="nowbar hearable"><div class="nowrow"><div class="nowtxt"><span class="nowstep">${t('step.of',{a:n,b:of})}</span><span class="nowdo">${short}</span></div>${hear(say)}</div>${stepBar(n-1,of)}</div>`}
/* show at most 3 choices at a time */
function pager(key,items,per){
  per=per||3;const pages=Math.ceil(items.length/per);let p=S.page[key]||0;if(p>=pages)p=0;
  const list=items.slice(p*per,p*per+per);
  const ctl=pages>1?`<p class="pageof" style="margin-top:.6em">${t('page.of',{a:p+1,b:pages})}</p>${p<pages-1?btn('soft','page',key+':'+(p+1),t('btn.more'),'right'):btn('soft','page',key+':0',t('btn.first'),'replay')}`:'';
  return {list,ctl};
}

function levelInfo(l){return [null,
 {cls:'lv-1',ic:'sprout',name:t('L1.name'),say:t('L1.say'),desc:t('L1.desc'),mode:'explain'},
 {cls:'lv-2',ic:'leaf',name:t('L2.name'),say:t('L2.say'),desc:t('L2.desc'),mode:'hint'},
 {cls:'lv-3',ic:'flower',name:t('L3.name'),say:t('L3.say'),desc:t('L3.desc'),mode:'self'}][l]}
function calcLevel(){const y=S.answers.filter(a=>a===1).length;return y<=1?1:(y===2?2:3)}
const dots=(n,of)=>`<div class="dots" role="img" aria-label="${attr(t('page.of',{a:n,b:of}))}">${Array.from({length:of},(_,i)=>`<span class="${i===n-1?'on':''}"></span>`).join('')}</div>`;

 return `<header class="top">${S.screen==='splash'?'':`<button class="hb back" data-a="back">${ic('left',2.6)}<span>${t('btn.back')}</span></button>`}<span class="sp"></span>
 <button class="hb lang" data-a="langSheet" aria-label="${attr(t('lang.btnAria',{lang:NATIVE_SHORT[S.lang]}))}">${ic('globe')}<span lang="${S.lang}">${NATIVE_SHORT[S.lang]}</span></button>
 <button class="hb help" data-a="help"${r.cur==='help'?' aria-current="page"':''}>${ic('help',2.4)}<span>${t('btn.help')}</span></button></header>`;
}
function utilHtml(r){
 const it=[`<button class="ub${r.settingsGlow?' glow':''}" data-a="go" data-v="settings"${r.cur==='settings'?' aria-current="page"':''}>${ic('gear',2)}<span>${t('btn.settings')}</span></button>`,
  `<button class="ub hearall" data-a="speak" aria-pressed="${speakingNow}"><span class="h-go">${ic('speak')}<span>${t('btn.hear')}</span></span><span class="h-stop">${ic('stop')}<span>${t('btn.stop')}</span></span></button>`];
 if(S.onboarded&&!S.loggedOut){it.push(`<button class="ub" data-a="goHome"${r.cur==='home'?' aria-current="page"':''}>${ic('home')}<span>${t('util.home')}</span></button>`);
  it.push(`<button class="ub kaki" data-a="go" data-v="chat"${r.cur==='kaki'?' aria-current="page"':''}><span class="kk" aria-hidden="true">${KAKI}</span><span>${t('btn.askKaki')}</span></button>`)}
 return `<nav class="util" aria-label="${attr(t('nav.main'))}">${it.join('')}</nav>`;
}
/* big text in a long language: the menu bar joins the end of the page so the content keeps room (nothing is cut or shrunk) */
function fitShell(){const scr=document.getElementById('scr'),u=app.querySelector('nav.util');if(!scr||!u)return;
 if(scr.clientHeight<app.clientHeight*.42||u.offsetHeight>app.clientHeight*.2){u.classList.add('inflow');scr.appendChild(u)}}
/* keep the ringed button (and its caption) in view, so the senior never has to hunt for it */
function showTarget(){const sc=document.getElementById('scr'),co=sc&&(sc.querySelector('.mb.coach')||sc.querySelector('.oopscap'));if(!co)return;
 const k=PHONE_SCALE,sr=sc.getBoundingClientRect(),cr=co.getBoundingClientRect(),cap=document.getElementById('capline');
 const nb=sc.querySelector('.nowbar'),nbh=nb?nb.offsetHeight:0;
  const bottom=((cap?cap.getBoundingClientRect().bottom:cr.bottom)-sr.top)/k+sc.scrollTop+12,top=(cr.top-sr.top)/k+sc.scrollTop-64-nbh;
 sc.scrollTop=Math.max(0,Math.min(bottom-sc.clientHeight,top))}
let lastScreen=null;
function markAnno(){const sc=document.getElementById('scr');
 const put=(el,n)=>{if(!el||el.querySelector(':scope > .anno'))return;el.classList.add('anno-host');const b=document.createElement('span');b.className='anno';b.setAttribute('aria-hidden','true');b.textContent=n;el.appendChild(b)};
 put(app.querySelector('header.top'),1);
 put(sc&&sc.querySelector('h1,h2,.brand'),2);
 put(app.querySelector('.hear'),3);
 put(sc&&sc.querySelector('.list,.mock,.lcard,.verdict,.pathlist,.pathbox,.garden,.msgs,.prom,.printcard,.say,.kbub,.qcard,.card,.smsbox,.fld,.art'),4);
 put(app.querySelector('.foot'),5);
 put(app.querySelector('nav.util'),6);}
function render(){
 if(S.screen!==lastScreen){if(speakingNow)stopSpeaking();lastScreen=S.screen}
 const fn=SCREENS[S.screen]||SCREENS.splash,r=fn();
 app.className='app'+(S.dark?' dark':'')+' lv'+(S.level||0)+(speakingNow?' is-speaking':'')+(S.annot?' annot':'');
 app.style.setProperty('--scale',S.scale);app.lang=S.lang;
 const noteH=S.note?`<div class="note" role="status"><span class="kk" style="width:2.2em;height:2.2em;flex:none" aria-hidden="true">${KAKI}</span><p>${t(S.note.k,S.note.v)}</p><button class="btn" data-a="noteOk">${t('btn.ok')}</button></div>`:'';
 app.innerHTML=`${headerHtml(r)}<main class="scr ${r.scr||''}" id="scr">${r.body}</main>${r.foot?`<div class="foot">${r.foot}</div>`:''}${r.noUtil?'':utilHtml(r)}${noteH}${r.overlay||''}${S.sheet?sheetHtml():''}`;
 fitShell();
 if(S.annot)markAnno();
 noteNew=false;placeNote();showTarget();
 save();if(r.after)r.after();updatePanel();
 app._say=r.say||'';
 if(S.readAuto&&lastSaid!==S.screen+S.lang&&r.say){lastSaid=S.screen+S.lang;speak(r.say)}
}

/* ---------- actions ---------- */
const WRONG={scan:'wrong.scan',topup:'wrong.topup',stall:'wrong.stall',a5:'wrong.amount',a20:'wrong.amount'};
function sandbox(id){
 if(id==='peek'){S.peek=!S.peek;render();return}
 if(id==='new'){S.sheet={k:'newnum'};render();return}
 if(id==='change'){S.step=2;S.amt=null;S.oops=[];render();return}
 if(id==='no'&&S.step===4){S.step=3;S.oops=[];render();return}
 const tg=target();
 if(id===tg){S.wrong=0;S.oops=[];S.showPoint=false;
  if(id==='a10'){S.amt=10;render();return}
  if(S.step===5){if(S.watch){S.watch=false;S.watched=true;S.step=0;S.amt=null;note('task.watchDone');go('intro',{replace:true});return}finishTask();return}
  S.step++;render();return}
 if(/^a\d+/.test(id))S.amt=+id.slice(1);
 S.wrong++;S.oops=['oops.ok',WRONG[id]||(id==='next'?'wrong.next':'wrong.other'),(S.wrong>=2||S.mode!=='self')?'oops.look':'oops.try'];
 if(S.mode==='self'&&S.wrong===2)S.hints++;
 render();
}
function finishTask(){const solo=S.hints===0;S.garden.banking=Math.max(S.garden.banking,solo?3:2);if(!S.stamps.includes('banking'))S.stamps.push('banking');go('done',{replace:true})}
function topicGo(v){if(v==='banking')go('bank');else if(v==='safety')go('safety');else ACT.startGuide(v)}
function sendChat(v){S.chat.push({u:v});S.chat.push({r:replyKey(v)});S.draft='';render()}

 help(){if(S.screen!=='help')go('help')},
 langSheet(){S.sheet={k:'lang'};render()},
 langPick(v){S.lang=v;S.sheet=null;note('note.langChanged');render()},
 lang(v){S.lang=v;render()},
 noteOk(){S.note=null;render()},
 splashGo(){if(S.loggedOut){S.account='login';S.accMode='phone';S.otp='';S.codeSent=false;go('account');return}if(S.onboarded){stack=[];go(homeFor(),{replace:true})}else go('lang')},
 accNext(){if(S.onboarded){S.loggedOut=false;stack=[];note('note.loggedIn',{n:nm()});go(homeFor(),{replace:true})}else go('q0')},

 tipShow(){S.tip=true;render()},tipDone(){S.tip=false;go('voice')},

 typeMode(){S.typeMode=!S.typeMode;S.listening=false;render();if(S.typeMode){const i=document.getElementById('chatIn');if(i)i.focus()}},

  if(v!==st.tg){S.gwrong=true;render();return}

  S.garden[G.leaf]=Math.max(S.garden[G.leaf],1);if(G.stamp&&!S.stamps.includes(G.stamp))S.stamps.push(G.stamp);go('guidedone',{replace:true})},

 readAuto(){S.readAuto=!S.readAuto;render()},dark(){S.dark=!S.dark;render()},

 pickLevel(v){S.pendLevel=+v;render()},
 levelDone(){const l=S.pendLevel||S.level;S.pendLevel=null;if(l&&l!==S.level){S.level=l;S.mode=null;S.onboarded=true;stack=[];note('set.levelChanged',{n:l});go(homeFor(),{replace:true})}else back()},

 lesson(){S.lessonIdx++;render();const sc=document.getElementById('scr');if(sc)sc.scrollTop=0},
 quiz(v){S.quiz=v;render()},
 lessonDone(){S.garden.safety=Math.max(S.garden.safety,S.quiz==='scam'?3:2);if(!S.stamps.includes('safety'))S.stamps.push('safety');note('stamp.new',{s:t('stamp.safety')});go('garden',{replace:true})},
 sample(v){S.scamText=t('ex.'+v+'.t');S.scamResult=null;S.sheet=null;render()},
 scamCheck(){if(!S.scamText.trim()){note('sc.empty');render();const i=document.getElementById('scamIn');if(i)i.focus();return}S.scamResult=checkScam(S.scamText);go('scamresult')},

function notesHtml(){const e=SCR[S.screen]||['story',''],f=FAM[e[0]];
 const sec=(n,ttl,body,open)=>`<details${open?' open':''}><summary>${n} · ${ttl}</summary>${body}</details>`;
 const p=x=>`<p>${esc(x)}</p>`;
 return `<p class="dnname">${esc(f.name)} template</p><p><b>Changed in v3:</b> ${esc(e[1])}</p>`+
  sec(1,'Revised layout',p(f.layout),true)+
  sec(2,'Component annotations',`<ol class="annolist">${[1,2,3,4,5,6].map(n=>`<li><span class="n">${n}</span><span>${esc((f.comps&&f.comps[n])||ANAT[n])}</span></li>`).join('')}</ol>`)+
  sec(3,'Accessibility rationale',p(f.a11y))+sec(4,'Typography',p(f.type))+sec(5,'Colour and contrast',p(f.colour))+
  sec(6,'Icons and interaction',p(f.icons))+sec(7,'Audio support',p(f.audio))+sec(8,'Why it helps older adults',p(f.why));}
/* live contrast table built from the app's own colour tokens */
function hexToRgb(h){h=(h||'').trim().replace('#','');if(h.length!==6)return 'rgb(0,0,0)';return `rgb(${parseInt(h.slice(0,2),16)},${parseInt(h.slice(2,4),16)},${parseInt(h.slice(4,6),16)})`}
function tokHtml(){const cs=getComputedStyle(app),v=n=>cs.getPropertyValue(n).trim();
 const rows=[['Body text','--ink','--bg',7],['Text on cards','--ink','--card',7],['Secondary text','--muted','--bg',7],['Main button','--on-green','--green',7],['Help button','--on-blue','--blue',7],['Gold button','--on-yellow','--yellow',7],['Green note','--green-ink','--green-t',7],['Blue note','--blue-ink','--blue-t',7],['Yellow note','--yellow-ink','--yellow-t',7],['Pink note','--pink-ink','--pink-t',7],['Red note','--red','--red-t',7],['Control borders','--line','--card',3],['Tap-here ring','--ring','--card',3]];
 return `<table class="rules">${rows.map(([n,f,b,need])=>{const r=contrast(hexToRgb(v(f)),hexToRgb(v(b)));const ok=r>=need;return `<tr class="tokrow"><td><span class="sw" style="background:${v(b)};box-shadow:inset 0 0 0 4px ${v(b)}, inset 0 0 0 7px ${v(f)}"></span>${n}</td><td class="${ok?'pass':''}">${ok?'✓':'✗'} ${r.toFixed(1)}:1</td></tr>`}).join('')}</table>`;}

 const n=document.getElementById('pNow');if(n)n.textContent=(NAMES[S.screen]||S.screen)+(S.screen==='guide'?' · '+S.guide+' step '+(S.gstep+1):S.screen==='task'?' · step '+(S.step+1)+' of 6':'');
 const ch=[S.level?'Level '+S.level:'Level not set yet','Language: '+NATIVE[S.lang],'Text: '+({1:'Normal',1.2:'Large',1.4:'Extra large'})[S.scale]];
 if(S.dark)ch.push('Dark colours');
 const pc=document.getElementById('pChips');if(pc)pc.innerHTML=ch.map(c=>`<span class="chip">${esc(c)}</span>`).join('');
 document.querySelectorAll('[data-pl]').forEach(b=>b.classList.toggle('on',b.dataset.pl===S.lang));
 const pn=document.getElementById('pNotes');if(pn){const open=[...pn.querySelectorAll('details')].map(d=>d.open);pn.innerHTML=notesHtml();if(open.length)pn.querySelectorAll('details').forEach((d,i)=>{if(open[i]!=null)d.open=open[i]})}
 const pt=document.getElementById('pTok');if(pt)pt.innerHTML=tokHtml();

/* in-page audit of the screen that is showing */
function lum(c){const m=c.match(/[\d.]+/g);if(!m)return null;const [r,g,b]=m.slice(0,3).map(x=>{x=+x/255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return {L:.2126*r+.7152*g+.0722*b,a:m[3]!=null?+m[3]:1}}
function bgOf(el){while(el&&el!==document.documentElement){const cs=getComputedStyle(el),b=cs.backgroundColor;const l=lum(b);if(l&&l.a>.5)return b;el=el.parentElement}return 'rgb(255,255,255)'}
function contrast(a,b){const x=lum(a).L,y=lum(b).L;return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function audit(){
 const vis=el=>{const r=el.getBoundingClientRect();if(!r.width||!r.height)return false;const cs=getComputedStyle(el);return cs.visibility!=='hidden'&&cs.display!=='none'};
 let minText=99,minTextEl=null,minC=99,minCEl=null;
 const tw=document.createTreeWalker(app,NodeFilter.SHOW_TEXT);let nd;
 while(nd=tw.nextNode()){if(!nd.nodeValue.trim())continue;const p=nd.parentElement;if(!p||!vis(p)||p.closest('svg')||p.closest('.anno'))continue;
  const cs=getComputedStyle(p),f=parseFloat(cs.fontSize);if(f<minText){minText=f;minTextEl=p}
  const c=contrast(cs.color,bgOf(p));if(c<minC){minC=c;minCEl=p}}
 const tg=[...app.querySelectorAll('button,input,textarea,a[href]')].filter(vis);
 let minW=999,minH=999,small=[],iconOnly=[];
 const K=PHONE_SCALE;tg.forEach(el=>{const q=el.getBoundingClientRect(),r={width:q.width/K,height:q.height/K};if(r.width<55.5||r.height<55.5)small.push(el);minW=Math.min(minW,r.width);minH=Math.min(minH,r.height);
  if(el.tagName==='BUTTON'&&!el.innerText.trim())iconOnly.push(el)});
 let close=[];const scr=document.getElementById('scr'),SR=scr&&scr.getBoundingClientRect();
 const NB=scr&&scr.querySelector('.nowbar'),NBB=NB?NB.getBoundingClientRect().bottom:0;
 const clip=el=>{const r=el.getBoundingClientRect();if(!SR||!scr.contains(el)||el.closest('.veil,.tipveil,.note'))return r;const top=Math.max(r.top,(NB&&!NB.contains(el))?Math.max(SR.top,NBB):SR.top),bottom=Math.min(r.bottom,SR.bottom);if(bottom-top<4)return null;return {left:r.left,right:r.right,top,bottom}};
 for(let i=0;i<tg.length;i++)for(let j=i+1;j<tg.length;j++){const a=tg[i],b=tg[j];if(a.contains(b)||b.contains(a))continue;if(a.closest('.veil,.tipveil,.note')!==b.closest('.veil,.tipveil,.note'))continue;
  const A=clip(a),B=clip(b);if(!A||!B)continue;
  const dx=Math.max(0,Math.max(A.left,B.left)-Math.min(A.right,B.right)),dy=Math.max(0,Math.max(A.top,B.top)-Math.min(A.bottom,B.bottom));
  const gap=((dx>0&&dy>0)?Math.hypot(dx,dy):Math.max(dx,dy))/PHONE_SCALE;if(gap<11.5)close.push([a,b,Math.round(gap)])}
 const desc=el=>el?(el.innerText||el.getAttribute('aria-label')||el.className||el.tagName).toString().trim().slice(0,40):'';
 return {screen:S.screen,lang:S.lang,minText:Math.round(minText*10)/10,minTextAt:desc(minTextEl),minContrast:Math.round(minC*100)/100,minContrastAt:desc(minCEl),
  targets:tg.length,minTarget:Math.round(minW)+'×'+Math.round(minH),small:small.map(desc),iconOnly:iconOnly.length,close:close.map(c=>desc(c[0])+' | '+desc(c[1])+' ('+c[2]+'px)'),missing:[...MISSING]};
}
function showAudit(){const a=audit(),ok=(v,p)=>`<span class="${p?'pass':''}">${p?'✓ ':'✗ '}${esc(v)}</span>`;
 document.getElementById('pAudit').innerHTML=`<table class="rules audit"><tr><td>Smallest text</td><td>${ok(a.minText+'px',a.minText>=20)}</td></tr><tr><td>Lowest text contrast</td><td>${ok(a.minContrast+':1',a.minContrast>=7)}</td></tr><tr><td>Smallest tap target</td><td>${ok(a.minTarget+'px',!a.small.length)}</td></tr><tr><td>Targets closer than 12px</td><td>${ok(String(a.close.length),!a.close.length)}</td></tr><tr><td>Icon-only buttons</td><td>${ok(String(a.iconOnly),!a.iconOnly)}</td></tr><tr><td>Missing text IDs</td><td>${ok(String(a.missing.length),!a.missing.length)}</td></tr></table>`;}
function coverage(){const ids=Object.keys(STR);const c={};LANGS.forEach(l=>c[l]=ids.filter(k=>STR[k][l]).length);
 const el=document.getElementById('pCov');if(el)el.innerHTML=`<table class="rules">${LANGS.map(l=>`<tr><td>${NATIVE[l]}</td><td>${c[l]} / ${ids.length}</td></tr>`).join('')}</table>`}
(document.querySelector('.panel')||document.createElement('div')).addEventListener('click',e=>{const b=e.target.closest('[data-p],[data-pl]');if(!b)return;
 if(b.dataset.pl){S.lang=b.dataset.pl;render();return}
 const p=b.dataset.p;S.sheet=null;
 if(p==='audit'){showAudit();return}
 if(p==='annot'){S.annot=!S.annot;render();return}
 stack=[];
 if(p==='relaunch'){S.screen='splash';render();return}
 if(p==='reset'){try{localStorage.removeItem('kaki-proto-v3')}catch(e){}const l=S.lang;S=clone(DEF);S.lang=l;note('note.reset');render();return}
 if(p==='lang'){S.onboarded=false;S.tip=false;S.voiceSet=null;go('lang',{replace:true});return}
 if(p==='survey'){S.answers=[null,null,null];go('q0',{replace:true});return}
 if(/^l[123]$/.test(p)){const l=+p[1];S.level=l;S.onboarded=true;S.mode=null;S.answers=l===1?[1,0,0]:l===2?[1,1,0]:[1,1,1];go(l===3?'home':'path',{replace:true});return}
 if(!S.level){S.level=2;S.onboarded=true}
 if(p==='task'){S.mode=null;S.screen='intro';ACT.startTask();return}
 if(p==='guide'){ACT.startGuide('health');return}
 S.onboarded=true;go(p,{replace:true});
});
window.KakiProto={S:()=>S,set:o=>{Object.assign(S,o);render()},go:s=>{S.screen=s;S.sheet=null;render()},render,audit,t,STR,missing:()=>[...MISSING],GUIDES,ACT};
/* ---------- the phone frame: fits any window, zoom or embed; full screen on real phones ---------- */
var PHONE_SCALE=1;let wasDevice=null;
function isDevice(){const q=new URLSearchParams(location.search);if(q.get('frame')==='1')return false;if(q.get('phone')==='1')return true;
 return matchMedia('(hover: none) and (pointer: coarse)').matches&&Math.min(screen.width||9999,screen.height||9999)<600}
function fitPhone(){const dev=isDevice(),root=document.documentElement,ph=document.querySelector('.phone'),box=document.querySelector('.phonebox');
 root.classList.toggle('device',dev);root.classList.toggle('landscape',dev&&innerWidth>innerHeight);
 if(dev){PHONE_SCALE=1;ph.style.transform='';box.style.width='';box.style.height='';root.style.setProperty('--vh',innerHeight+'px')}
 else{PHONE_SCALE=Math.max(.2,Math.min(1,(innerHeight-32)/860,(innerWidth-32)/414));ph.style.transform=PHONE_SCALE===1?'':'scale('+PHONE_SCALE+')';
  box.style.width=Math.round(414*PHONE_SCALE)+'px';box.style.height=Math.round(860*PHONE_SCALE)+'px'}
 const rt=document.getElementById('rotate');if(rt&&STR['rotate.text'])rt.lastElementChild.textContent=plain(t('rotate.text'));
 const ch=wasDevice!==null&&wasDevice!==dev;wasDevice=dev;return ch}
function placeNote(){const n=app.querySelector('.note'),h=app.querySelector('.top');if(n)n.style.top=((h?h.offsetHeight:0)+10)+'px'}
addEventListener('resize',()=>{if(fitPhone())render();else placeNote()});
addEventListener('orientationchange',()=>setTimeout(()=>{if(fitPhone())render()},250));
fitPhone();
S.screen='splash';S.sheet=null;S.annot=false;render();coverage();
