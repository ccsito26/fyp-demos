<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kaki Prototype v3.1.1.1 · Easy on eyes, ears &amp; hands</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Tamil:wght@400;700&display=swap">
</head><body>
<div class="stage">
  <div class="phonebox"><div class="phone"><div class="notch" aria-hidden="true"></div><div class="app" id="app" lang="en"></div></div></div>
</div>
<div id="rotate" role="alert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2h8a2 2 0 012 2v16a2 2 0 01-2 2H8a2 2 0 01-2-2V4a2 2 0 012-2zM11 18h2"/></svg><p>Please turn your phone upright to use Kaki.</p></div>
<style>
/* Kaki Prototype v2.1 — presenter page around a phone frame. */
:root{
  --page-bg:#F3F3F3; --page-fg:#1A1A1A; --page-muted:#525252; --page-card:#FFFFFF; --page-line:#C6C6C6; --page-accent:#0B5E2F; --bezel:#1A1A1A;
  --f-display:'Fredoka','Noto Sans SC','Noto Sans Tamil','Trebuchet MS',sans-serif;
  --f-body:'Atkinson Hyperlegible','Noto Sans SC','Noto Sans Tamil',Verdana,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#0E0E0E;--page-fg:#FFFFFF;--page-muted:#C6C6C6;--page-card:#2A2A2A;--page-line:#525252;--page-accent:#62DB96;--bezel:#000000;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#0E0E0E;--page-fg:#FFFFFF;--page-muted:#C6C6C6;--page-card:#2A2A2A;--page-line:#525252;--page-accent:#62DB96;--bezel:#000000;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--page-bg);color:var(--page-fg);font-family:var(--f-body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:4px solid #C96A12;outline-offset:3px}
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;padding-block:24px;min-height:100%}

/* presenter panel (team-facing, English) */
.panel{width:360px;flex:none;display:flex;flex-direction:column;gap:16px;padding-top:8px}
.panel h1{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;margin:0;color:var(--page-accent)}
.panel .sub{font-family:var(--f-display);font-weight:600;font-size:20px;margin:4px 0 0}
.panel p{margin:0;font-size:15px;line-height:1.5;color:var(--page-muted)}
.pcard{background:var(--page-card);border:1px solid var(--page-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pcard h2{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:0;color:var(--page-muted)}
.now{font-family:var(--f-display);font-size:20px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--page-bg);border:1px solid var(--page-line)}
.jump{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.jump button{min-height:44px;border-radius:12px;border:1px solid var(--page-line);background:var(--page-bg);font-size:14px;font-weight:700;cursor:pointer;text-align:left;padding:8px 10px}
.jump button:hover{border-color:var(--page-accent)}
.jump .wide{grid-column:1/-1}
.jump button.on{background:var(--page-accent);color:var(--page-card);border-color:var(--page-accent)}
.rules{width:100%;border-collapse:collapse;font-size:14px}
.rules td{padding:7px 4px;border-top:1px solid var(--page-line);vertical-align:top}
.rules td:last-child{font-weight:700;text-align:right}
.audit td:last-child{font-variant-numeric:tabular-nums}
.pass{color:var(--page-accent)}
/* The phone keeps one design size (414 × 860) and is scaled as a whole to fit the window,
   so browser zoom, a short laptop screen or an embed (e.g. Canva) never cuts off the bottom. */
.stage{padding-block:16px;align-items:center;min-height:100%}
.phonebox{flex:none;width:414px;height:860px;position:relative}
.phone{width:414px;height:860px;transform-origin:top left;flex:none;border-radius:52px;background:var(--bezel);padding:10px;position:relative;box-shadow:0 30px 60px rgba(30,15,40,.28)}
.notch{position:absolute;top:18px;left:50%;transform:translateX(-50%);width:110px;height:28px;border-radius:16px;background:var(--bezel);z-index:30;pointer-events:none}
/* on a real phone (iOS, Android): the app fills the screen, no frame */
html.device{padding:0!important;height:100%;overflow:hidden;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.device body{padding:0;margin:0;height:100%;overflow:hidden}
html.device .stage{display:block;padding:0;min-height:0}
html.device .phonebox{width:100%;height:var(--vh,100dvh)}
html.device .phone{width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;transform:none}
html.device .notch{display:none}
html.device .app{border-radius:0}
html.device .app .top{padding-top:max(12px,env(safe-area-inset-top,0px))}
html.device .app .util{padding-bottom:max(14px,env(safe-area-inset-bottom,0px))}
#rotate{display:none}
html.device.landscape #rotate{display:flex;position:fixed;inset:0;z-index:100;background:#084523;color:#FFFFFF;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:var(--f-display);font-size:24px;font-weight:600}
#rotate svg{width:72px;height:72px}
button,[role=button],input,textarea{touch-action:manipulation}

/* ================= the app ================= */
/* Colour tokens map to SGDS v3 primitives (designsystem.tech.gov.sg/foundations/colour):
   GovTech purple-100/200 surfaces, SGDS gray text, green/blue/yellow/red/cyan 100 tints with 700-800 text.
   Every text pair is 7:1 or more (WCAG AAA). The orange "tap here" ring is the one colour kept outside SGDS on purpose. */
.app{
  --bg:#F6F3FB;--card:#FFFFFF;--ink:#1A1A1A;--muted:#525252;--line:#6B6B6B;--soft:#E5DBF2;
  --green:#0B5E2F;--on-green:#FFFFFF;--green-ink:#084523;--green-t:#E3F9ED;
  --blue:#0151A0;--on-blue:#FFFFFF;--blue-ink:#013C77;--blue-t:#ECF5FE;
  --yellow:#FCDE63;--on-yellow:#1A1A1A;--yellow-ink:#483C0D;--yellow-t:#FEF4CB;--yellow-edge:#9D841C;
  --pink-ink:#74173D;--pink-t:#FDF0F6;
  --red:#791414;--on-red:#FFFFFF;--red-t:#FCF1F1;
  --ring:#C96A12;--tapbg:#7A3E12;--cream:#FFF6E0;--anno:#B82EA0;
  --scale:1;
  font-size:calc(20px * var(--scale));
  width:100%;height:100%;border-radius:42px;overflow:hidden;position:relative;display:flex;flex-direction:column;
  background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.5;
}
.app.dark{--bg:#1A1A1A;--card:#2A2A2A;--ink:#FFFFFF;--muted:#C6C6C6;--line:#868686;--soft:#3B3B3B;
  --green:#62DB96;--on-green:#063119;--green-ink:#B1EDCB;--green-t:#084523;
  --blue:#96C7F7;--on-blue:#012A54;--blue-ink:#C8E2FB;--blue-t:#013C77;
  --yellow-ink:#FCDE63;--yellow-t:#483C0D;--pink-ink:#F9D6E4;--pink-t:#74173D;--red:#F1B2B2;--on-red:#1A1A1A;--red-t:#550E0E;--cream:#483C0D}

.app h1,.app h2{font-family:var(--f-display);margin:0;line-height:1.25;text-wrap:balance}
.app h1{font-size:1.6em;font-weight:700}
.app h2{font-size:1.4em;font-weight:700}
.app p{margin:0}
.app[lang="zh"] h1,.app[lang="zh"] h2{font-family:'Noto Sans SC',var(--f-display)}
.app[lang="ta"] h1,.app[lang="ta"] h2{font-family:'Noto Sans Tamil',var(--f-display)}
.app[lang="ta"]{line-height:1.6}
.app *{overflow-wrap:break-word}
.muted{color:var(--muted)}
.row{display:flex;gap:.6em;align-items:center}
.col{display:flex;flex-direction:column;gap:.75em}
.grow{flex:1;min-width:0}
.center{text-align:center;align-items:center}
.sec{font-weight:700;margin-top:.9em}
.disp{font-family:var(--f-body);font-weight:700}
.kk{display:inline-block}
.kk svg{width:100%;height:100%;display:block}
.i{width:1.2em;height:1.2em;flex:none}
.plant svg,.ill svg,.tl svg{width:100%;height:auto;display:block}
.pi{display:flex;align-items:center;justify-content:center;background:var(--t);color:var(--c)}
.bob{animation:bob 3s ease-in-out 2}

/* ---- header: Back · Language · Help (always the same place) ---- */
.top{display:flex;flex-wrap:wrap;align-items:stretch;gap:12px;padding:40px 12px 12px;flex:none;border-bottom:2px solid var(--soft)}
.top .sp{flex:1 1 0;min-width:0}
.top .help{margin-left:auto}
.hb{min-height:56px;min-width:64px;padding:.2em .55em;border-radius:1em;border:2px solid var(--line);background:var(--card);color:var(--ink);display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;font-weight:700;font-size:1em;cursor:pointer;line-height:1.15;flex:none;text-align:center}
.hb svg{width:1.2em;height:1.2em;flex:none}
.hb.help{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.hb[aria-current="page"]{outline:3px solid var(--ring);outline-offset:2px}
.hb:hover{background:var(--soft)}
.hb.help:hover{background:var(--blue)}
.ttlbar{width:100%;font-family:var(--f-display);font-weight:600;font-size:1em}

/* ---- content ---- */
.scr{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;display:flex;flex-direction:column;padding:16px 16px 24px}
.scr > *{flex-shrink:0}
.scr.flush{padding:0}

/* ---- persistent note (replaces disappearing toasts) ---- */
.note{position:absolute;left:12px;right:12px;top:120px;z-index:45;box-shadow:0 16px 36px rgba(0,0,0,.35);background:var(--ink);color:var(--bg);border-radius:1.1em;padding:.7em .9em;display:flex;gap:.8em;align-items:center;flex-wrap:wrap}
.note p{flex:1 1 10em;font-weight:700}
.note .btn{min-height:max(56px,2.8em);flex:none;background:var(--bg);color:var(--ink);box-shadow:none;padding:.2em 1.2em}

/* ---- action buttons (same place on every screen) ---- */
.foot{flex:none;padding:12px 14px 10px;display:flex;flex-wrap:wrap;gap:12px;border-top:2px solid var(--soft);background:var(--bg)}
.foot > .btn{flex:1 1 100%}
.foot > .btn.soft,.foot > .btn.ghost{flex:1 1 6em;width:auto;min-width:min-content}
.foot > .composer{flex:1 1 100%}
.btn{display:flex;align-items:center;justify-content:center;gap:.5em;min-height:max(56px,2.8em);padding:.45em 1.1em;border-radius:1.4em;border:0;font-family:var(--f-body);font-weight:700;font-size:1.1em;cursor:pointer;text-align:center;line-height:1.3;width:100%}
.btn svg{width:1.2em;height:1.2em;flex:none}
.btn.pri{background:var(--green);color:var(--on-green);box-shadow:0 .2em 0 var(--green-ink)}
.btn.gold{background:var(--yellow);color:var(--on-yellow);box-shadow:0 .2em 0 var(--yellow-edge)}
.btn.ghost{background:var(--card);color:var(--green-ink);border:3px solid var(--green)}
.app.dark .btn.ghost{color:var(--green-ink)}
.btn.soft{background:var(--card);color:var(--ink);border:2px solid var(--line);font-family:var(--f-body);font-weight:700;font-size:1em}
.btn.danger{background:var(--red);color:var(--on-red)}
.btn:hover{filter:brightness(1.06)}
.lv1 .btn:hover,.lv1 .btn:focus-visible{transform:scale(1.04)}

/* ---- utility bar: Settings · Hear it · Home · Ask Kaki ---- */
.util{flex:none;display:flex;flex-wrap:wrap;gap:12px;padding:12px 12px 14px;background:var(--card);border-top:2px solid var(--soft)}
.ub{flex:1 1 0;min-width:max(64px,min-content);min-height:56px;border-radius:1em;border:2px solid transparent;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.05em;font-weight:700;font-size:1em;line-height:1.1;cursor:pointer;padding:.2em .35em;text-align:center}
.ub svg{width:1.3em;height:1.3em}
.ub .kk{width:1.3em;height:1.3em}
.util.inflow{margin:24px -16px -24px;border-radius:0;padding-bottom:20px}
.ub[aria-current="page"]{border-color:var(--green);background:var(--green-t);color:var(--green-ink)}
.ub.kaki{background:var(--pink-t);color:var(--pink-ink)}
.ub.glow{outline:4px solid var(--ring);outline-offset:3px;position:relative;z-index:37}

/* ---- cards, badges ---- */
.card{background:var(--card);border-radius:1.2em;padding:.9em 1em;border:2px solid var(--soft)}
.badge{display:inline-flex;align-items:center;gap:.4em;border-radius:1em;padding:.25em .7em;font-weight:700;font-size:1em;align-self:flex-start;line-height:1.4}
.badge svg{width:1em;height:1em}
.b-blue{background:var(--blue-t);color:var(--blue-ink)}
.b-yellow{background:var(--yellow-t);color:var(--yellow-ink)}
.b-green{background:var(--green-t);color:var(--green-ink)}
.b-pink{background:var(--pink-t);color:var(--pink-ink)}
.b-red{background:var(--red-t);color:var(--red)}
.dots{display:flex;gap:.45em;justify-content:center;align-items:center}
.dots span{width:.7em;height:.7em;border-radius:.35em;background:var(--line)}
.dots span.on{width:1.9em;background:var(--green)}
.pageof{font-weight:700;text-align:center;color:var(--muted)}

/* choice buttons (radio-like, max 3 per screen) */
.choice{display:flex;align-items:center;gap:.8em;min-height:max(64px,3.2em);padding:.6em .9em;border-radius:1.3em;border:3px solid var(--line);background:var(--card);cursor:pointer;text-align:left;width:100%;color:var(--ink)}
.choice .rd{width:1.6em;height:1.6em;border-radius:50%;border:3px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center}
.choice[aria-checked="true"],.choice[aria-pressed="true"]{border-color:var(--green);background:var(--green-t)}
.choice[aria-checked="true"] .rd,.choice[aria-pressed="true"] .rd{border-color:var(--green);background:var(--green);color:var(--on-green)}
.choice .rd svg{width:1em;height:1em}
.choice b{display:block;font-family:var(--f-body);font-weight:700;font-size:1.1em;line-height:1.3}
.choice .sub{display:block;color:var(--muted)}
.choice[aria-checked="true"] .sub,.choice[aria-pressed="true"] .sub{color:var(--green-ink)}
.choice .pi{width:2.6em;height:2.6em;border-radius:.8em;flex:none}
.choice .pi svg{width:1.4em;height:1.4em}
.list{display:flex;flex-direction:column;gap:12px}

/* fields */
.fld{display:flex;flex-direction:column;gap:.35em;font-weight:700}
.inp{min-height:max(56px,2.8em);border-radius:1em;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:.3em .8em;font-size:1em;font-weight:400;width:100%}
.inp:focus,.tarea:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 4px var(--green-t)}
.otp{letter-spacing:.5em;text-align:center;font-family:var(--f-display);font-size:1.4em;font-weight:600}
.tarea{min-height:6em;border-radius:1em;border:2px solid var(--line);background:var(--card);color:var(--ink);padding:.6em .8em;width:100%;resize:vertical;font-size:1em;line-height:1.5}
.vh-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.link{background:none;border:0;color:var(--blue-ink);font-weight:700;font-size:1em;text-decoration:underline;text-underline-offset:3px;cursor:pointer;min-height:max(56px,2.8em);padding:.3em .6em;align-self:center}

/* sheets (dialogs) */
.veil{position:absolute;inset:0;background:rgba(20,10,30,.55);z-index:40;display:flex;align-items:flex-end}
.sheet{background:var(--bg);width:100%;max-height:90%;overflow-y:auto;border-radius:1.6em 1.6em 0 0;padding:1.2em 16px 24px;display:flex;flex-direction:column;gap:12px}
.sheet h2{display:flex;gap:.4em;align-items:center}
.sheet .msgbox{background:var(--green-t);color:var(--green-ink);border-radius:1em;padding:.7em .9em;font-weight:700}

/* splash */
.splash{background:#084523;color:#FFFFFF;align-items:center;overflow-x:hidden;overflow-y:auto;padding:0}
.splash .tl{position:absolute;opacity:.14}
.splash .brand{font-family:var(--f-display);font-weight:700;font-size:4em;line-height:.95;color:#FCDE63}
.splash .tag{font-family:var(--f-display);font-weight:600;font-size:1.3em;color:#FFFFFF}
.splash .art{position:relative;flex:1 1 0;width:100%;display:flex;align-items:center;justify-content:center;min-height:9em}
.splash.scr > .art{flex-shrink:1}
.splash .art .ill svg{max-height:100%}
.splash .ill{position:relative;width:18em;max-width:94%;animation:rise 1s .2s cubic-bezier(.3,1.3,.6,1) both}
.splash .bub{position:absolute;right:1em;top:8%;background:#FFFFFF;color:#1A1A1A;border-radius:1.2em 1.2em .25em 1.2em;padding:.4em .8em;font-family:var(--f-display);font-weight:600;font-size:1.1em}
.splash .line{font-weight:700;color:#FFFFFF;text-align:center}
.splash .btn{background:#FCDE63;color:#1A1A1A;box-shadow:0 .2em 0 #9D841C}
@keyframes rise{0%{transform:translateY(40px) scale(.85);opacity:0}70%{transform:translateY(-6px);opacity:1}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.3em)}}
@keyframes tap{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,.3em)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* language */
.hellos{font-family:var(--f-display);font-weight:600;font-size:1.5em;line-height:1.3}
.hellos span{display:block}
.zh{font-family:'Noto Sans SC',sans-serif}
.ta{font-family:'Noto Sans Tamil',sans-serif}
.langbtn .nat{font-family:var(--f-body);font-weight:700;font-size:1.15em}
.langbtn .zh,.langbtn .ta{font-weight:700}

/* text size */
.fs .tx{font-weight:700;line-height:1.2}

/* tip overlay on text size */
.tipveil{position:absolute;inset:0;background:rgba(20,10,30,.6);z-index:35;display:flex;align-items:center;justify-content:center;padding:16px}
.tipcard{background:var(--card);border-radius:1.4em;padding:1.2em;display:flex;flex-direction:column;gap:1em;max-width:22em;box-shadow:0 20px 40px rgba(0,0,0,.3)}

/* promises */
.prom{display:flex;flex-direction:column;gap:12px;margin-top:.6em}
.prom .pc{display:flex;align-items:center;gap:.8em;background:var(--card);border-radius:1.2em;padding:.7em .9em;border:2px solid var(--soft)}
.prom .ic{width:2.6em;height:2.6em;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.prom .ic svg{width:1.4em;height:1.4em}

/* avatar */
.avrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(7em,1fr));gap:12px}
.avbtn{display:flex;flex-direction:column;align-items:center;gap:.4em;padding:.7em .5em;border-radius:1.4em;border:3px solid var(--line);background:var(--card);cursor:pointer;font-family:var(--f-body);font-weight:700;font-size:1.1em;color:var(--ink);min-height:56px}
.avbtn[aria-checked="true"],.avbtn[aria-pressed="true"]{border-color:var(--green);background:var(--green-t)}

/* questions */
.qcard{background:var(--card);border-radius:1.4em;padding:1em;border:3px solid var(--yellow)}
.qcard .qt{font-family:var(--f-body);font-weight:700;font-size:1.25em;line-height:1.4;margin-top:.3em}
.qcard .qnum{font-weight:700;color:var(--muted)}
.prog{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35em}
.prog span{height:.5em;border-radius:.3em;background:var(--soft)}
.prog span.on{background:var(--green)}

/* result */
.lvbadge{width:9em;height:9em;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;border:.4em solid var(--yellow);color:#FFFFFF;animation:pop .6s both}
.lvbadge svg{width:3.4em;height:3.4em}
.lvbadge b{font-family:var(--f-display);font-size:1.2em}
.lv-1{background:#605111}.lv-2{background:#013C77}.lv-3{background:#0B5E2F}
.why{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center}

/* path */
.pathlist{display:flex;flex-direction:column;gap:12px;margin-top:.8em}
.pstep{display:flex;flex-wrap:wrap;align-items:center;gap:.8em;background:var(--card);border-radius:1.2em;padding:.6em .8em;border:2px solid var(--soft)}
.pstep .num{width:2.2em;height:2.2em;border-radius:50%;background:var(--soft);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:700;flex:none}

.gstep{display:flex;flex-direction:column;gap:10px}

/* the phone-screen card */
.mock{background:#FFFFFF;color:#1A1A1A;border-radius:1.4em;border:2px solid #C6C6C6;box-shadow:0 .3em 0 #DFDFDF;overflow:visible}

.mh{display:flex;justify-content:space-between;align-items:center;gap:.5em;flex-wrap:wrap;font-family:var(--f-body);font-weight:700;font-size:1.1em}

/* done */
.hero{background:#084523;color:#FFFFFF;border-radius:0 0 2em 2em;padding:1.4em 16px 1.6em;display:flex;flex-direction:column;align-items:center;gap:.8em;margin:-16px -16px 0}

.hero .sun svg{width:3.2em;height:3.2em}

.stats span{font-weight:700}
.stampx{width:5em;height:5em;border-radius:50%;background:#74173D;border:.25em solid #FFFFFF;color:#FFFFFF;display:flex;align-items:center;justify-content:center;flex:none;transform:rotate(-8deg);box-shadow:0 0 0 2px #74173D}

/* garden */
.garden{position:relative;display:flex;justify-content:center;background:radial-gradient(circle at 50% 70%,var(--green-t),transparent 70%);margin:0 -16px}

.chipst{font-weight:700;border-radius:.8em;padding:.1em .6em;display:inline-block}
.stamps{display:flex;gap:12px;flex-wrap:wrap}
.stp{display:flex;flex-direction:column;align-items:center;gap:.3em;width:5.2em;text-align:center;font-weight:700;line-height:1.3}

/* print card */
.printcard{background:#FFFFFF;color:#1A1A1A;border:3px solid #1A1A1A;border-radius:1.1em;padding:1em;display:flex;flex-direction:column;gap:.8em}

.printcard .warn{background:#FCF1F1;color:#791414;border-radius:.8em;padding:.6em .8em;font-weight:700;display:flex;gap:.5em;align-items:flex-start}

/* scam */
.lcard{border-radius:1.4em;padding:1.1em;display:flex;flex-direction:column;gap:.7em;align-items:center;text-align:center;background:var(--red-t);color:var(--ink)}

.lcard .big svg{width:2.2em;height:2.2em}
.smsbox{background:var(--card);border:2px solid var(--line);border-radius:1.1em;padding:.8em .9em}
.verdict{border-radius:1.3em;overflow:hidden;background:var(--card);border:2px solid var(--soft)}
.verdict .vh{padding:.7em .9em;display:flex;gap:.6em;align-items:center;font-family:var(--f-display);font-weight:700;font-size:1.3em;color:#FFFFFF}

"voice.yes":{en:"Yes, read to me",zh:"好，读给我听",ms:"Ya, bacakan untuk saya",ta:"ஆம், எனக்கு வாசியுங்கள்"},
"voice.yesSub":{en:"Kaki talks when a new screen opens",zh:"新画面打开时 Kaki 会说话",ms:"Kaki bercakap apabila skrin baharu dibuka",ta:"புதிய திரை திறக்கும்போது காக்கி பேசும்"},

"voice.noSub":{en:"You can tap Hear it at the bottom any time",zh:"随时可以点下面的“听一听”",ms:"Anda boleh ketik Dengar di bawah bila-bila masa",ta:"எப்போது வேண்டுமானாலும் கீழே உள்ள “கேளுங்கள்” என்பதைத் தட்டலாம்"},
"voice.sample":{en:"Hello! This is my voice. I will read each screen to you.",zh:"您好！这是我的声音。我会把每个画面读给您听。",ms:"Helo! Ini suara saya. Saya akan bacakan setiap skrin untuk anda.",ta:"வணக்கம்! இது என் குரல். ஒவ்வொரு திரையையும் உங்களுக்கு வாசிப்பேன்."},

"lang.note":{en:"You stay on the same screen. You can change this any time with the language button at the top.",zh:"您会留在同一个画面。随时可以用最上面的语言按钮更换。",ms:"Anda kekal di skrin yang sama. Anda boleh menukarnya bila-bila masa dengan butang bahasa di atas.",ta:"நீங்கள் அதே திரையில் இருப்பீர்கள். மேலே உள்ள மொழி பொத்தானால் எப்போது வேண்டுமானாலும் மாற்றலாம்."},

"speak.none":{en:"Read aloud is not available on this phone yet. A family member can turn on “text to speech” in the phone settings.",zh:"这部手机还不能朗读。家人可以在手机设置里打开“文字转语音”。",ms:"Bacaan suara belum ada pada telefon ini. Ahli keluarga boleh menghidupkan “teks ke pertuturan” dalam tetapan telefon.",ta:"இந்தத் தொலைபேசியில் இன்னும் வாசிப்பு வசதி இல்லை. குடும்பத்தினர் தொலைபேசி அமைப்புகளில் “உரையிலிருந்து பேச்சு” என்பதை இயக்கலாம்."},
"speak.near":{en:"This phone has no {lang} voice yet, so Kaki is using the closest voice.",zh:"这部手机还没有{lang}的声音，所以 Kaki 用最接近的声音来读。",ms:"Telefon ini belum ada suara {lang}, jadi Kaki menggunakan suara yang paling hampir.",ta:"இந்தத் தொலைபேசியில் {lang} குரல் இன்னும் இல்லை. அதனால் காக்கி அருகிலுள்ள குரலைப் பயன்படுத்துகிறது."},

"tip.text":{en:"You can change the text size any time. Tap Settings at the bottom of the screen. The language button is always at the top.",zh:"您随时可以更改字体大小，只要点屏幕下方的“设置”。语言按钮一直在最上面。",ms:"Anda boleh menukar saiz tulisan bila-bila masa. Ketik Tetapan di bahagian bawah skrin. Butang bahasa sentiasa di atas.",ta:"எழுத்து அளவை எப்போது வேண்டுமானாலும் மாற்றலாம். திரையின் கீழே உள்ள “அமைப்புகள்” என்பதைத் தட்டுங்கள். மொழி பொத்தான் எப்போதும் மேலே இருக்கும்."},

"hello.title":{en:"Hello, friend!",zh:"您好，朋友！",ms:"Helo, kawan!",ta:"வணக்கம், நண்பரே!"},

"prom.title":{en:"Kaki helps you become a digital friend by:",zh:"Kaki 会这样帮助您：",ms:"Kaki membantu anda dengan:",ta:"காக்கி உங்களுக்கு இப்படி உதவும்:"},
"prom.1":{en:"Guiding you step by step",zh:"一步一步带着您",ms:"Membimbing anda langkah demi langkah",ta:"படிப்படியாக வழிகாட்டுதல்"},
"prom.2":{en:"Teaching with patience",zh:"耐心地教",ms:"Mengajar dengan sabar",ta:"பொறுமையாகக் கற்பித்தல்"},
"prom.3":{en:"A reward for every task",zh:"每完成一项都有奖励",ms:"Ganjaran untuk setiap tugasan",ta:"ஒவ்வொரு பணிக்கும் ஒரு பரிசு"},
"prom.4":{en:"Being a friend you can trust",zh:"做您信得过的朋友",ms:"Menjadi kawan yang boleh dipercayai",ta:"நம்பக்கூடிய நண்பனாக இருப்பது"},
"prom.note":{en:"You press every button yourself. Kaki only shows the way.",zh:"每个按钮都由您自己按，Kaki 只是带路。",ms:"Anda sendiri yang menekan setiap butang. Kaki hanya menunjuk jalan.",ta:"ஒவ்வொரு பொத்தானையும் நீங்களே அழுத்துவீர்கள். காக்கி வழி மட்டும் காட்டும்."},

"tour.1":{en:"Learn a real task, like sending money with PayNow",zh:"学真实的事情，比如用 PayNow 转钱",ms:"Belajar tugasan sebenar, seperti menghantar wang dengan PayNow",ta:"PayNow மூலம் பணம் அனுப்புவது போன்ற உண்மையான பணியைக் கற்றுக்கொள்ளுங்கள்"},

"acc.title":{en:"Nice to meet you, {n}",zh:"很高兴认识您，{n}",ms:"Gembira berkenalan, {n}",ta:"உங்களைச் சந்தித்ததில் மகிழ்ச்சி, {n}"},
"acc.loginTitle":{en:"Welcome back, {n}",zh:"欢迎回来，{n}",ms:"Selamat kembali, {n}",ta:"மீண்டும் வருக, {n}"},
"acc.easy":{en:"Easy login with your phone",zh:"用手机轻松登录",ms:"Log masuk mudah dengan telefon anda",ta:"உங்கள் தொலைபேசியுடன் எளிதான உள்நுழைவு"},
"acc.easySub":{en:"We send a short code by SMS (a text message) to your phone. You type the code here. No password needed.",zh:"我们会用短信（手机文字信息）发一个简短的号码给您，您把号码输入这里就可以，不需要密码。",ms:"Kami hantar kod pendek melalui SMS (mesej teks) ke telefon anda. Anda taip kod itu di sini. Tidak perlu kata laluan.",ta:"உங்கள் தொலைபேசிக்குக் குறுஞ்செய்தி (SMS) மூலம் ஒரு சிறிய குறியீட்டை அனுப்புவோம். அதை இங்கே தட்டச்சு செய்யுங்கள். கடவுச்சொல் தேவையில்லை."},
"acc.phone":{en:"Your phone number",zh:"您的手机号码",ms:"Nombor telefon anda",ta:"உங்கள் தொலைபேசி எண்"},

"acc.code":{en:"The code from your SMS",zh:"短信里的号码",ms:"Kod daripada SMS anda",ta:"குறுஞ்செய்தியில் வந்த குறியீடு"},
"acc.codeSent":{en:"Practice SMS sent. Your Kaki code is 2468.",zh:"练习短信已发出。您的 Kaki 号码是 2468。",ms:"SMS latihan telah dihantar. Kod Kaki anda ialah 2468.",ta:"பயிற்சி குறுஞ்செய்தி அனுப்பப்பட்டது. உங்கள் காக்கி குறியீடு 2468."},
"acc.secret":{en:"Keep codes secret. Kaki will never call you or ask for your code.",zh:"号码要保密。Kaki 绝对不会打电话给您，也不会问您要号码。",ms:"Rahsiakan kod anda. Kaki tidak akan menelefon anda atau meminta kod anda.",ta:"குறியீடுகளை ரகசியமாக வைத்திருங்கள். காக்கி ஒருபோதும் உங்களை அழைக்காது, உங்கள் குறியீட்டைக் கேட்காது."},
"acc.useEmail":{en:"Use email and password instead",zh:"改用电邮和密码",ms:"Guna e-mel dan kata laluan",ta:"மின்னஞ்சல், கடவுச்சொல் பயன்படுத்து"},

"acc.emailTitle":{en:"Email and password",zh:"电邮和密码",ms:"E-mel dan kata laluan",ta:"மின்னஞ்சல், கடவுச்சொல்"},

"acc.pwTip":{en:"Write your password down and keep it somewhere safe at home.",zh:"把密码写下来，放在家里安全的地方。",ms:"Tulis kata laluan anda dan simpan di tempat yang selamat di rumah.",ta:"உங்கள் கடவுச்சொல்லை எழுதி, வீட்டில் பாதுகாப்பான இடத்தில் வையுங்கள்."},

"q.hello":{en:"Hello {n},",zh:"{n}，您好，",ms:"Helo {n},",ta:"வணக்கம் {n},"},
"q.intro":{en:"before we start, 3 simple questions will set a starting point for your journey.",zh:"开始前，请回答 3 个简单的问题，帮您找到最合适的起点。",ms:"sebelum mula, 3 soalan mudah akan menentukan titik permulaan perjalanan anda.",ta:"தொடங்கும் முன், 3 எளிய கேள்விகள் உங்கள் பயணத்தின் தொடக்கப் புள்ளியை அமைக்கும்."},
"q.noMarks":{en:"No marks, no test. Just your starting point.",zh:"没有分数，不是考试，只是您的起点。",ms:"Tiada markah, bukan ujian. Hanya titik permulaan anda.",ta:"மதிப்பெண் இல்லை, தேர்வு இல்லை. உங்கள் தொடக்கப் புள்ளி மட்டுமே."},
"q.count":{en:"Question {a} of 3",zh:"第 {a} 题，共 3 题",ms:"Soalan {a} daripada 3",ta:"கேள்வி {a} / 3"},
"q.1":{en:"Can you send a WhatsApp message or voice note by yourself?",zh:"您能自己发 WhatsApp 信息或语音吗？",ms:"Bolehkah anda menghantar mesej atau nota suara WhatsApp sendiri?",ta:"நீங்களாகவே WhatsApp செய்தி அல்லது குரல் பதிவை அனுப்ப முடியுமா?"},
"q.2":{en:"Can you download a new app from the app store by yourself?",zh:"您能自己从应用商店下载新的应用吗？",ms:"Bolehkah anda memuat turun aplikasi baharu dari gedung aplikasi sendiri?",ta:"ஆப் ஸ்டோரிலிருந்து புதிய செயலியை நீங்களாகவே பதிவிறக்க முடியுமா?"},
"q.3":{en:"Can you check a medical appointment or make a payment online?",zh:"您能在网上查看看病的预约，或者付款吗？",ms:"Bolehkah anda menyemak temu janji perubatan atau membuat bayaran dalam talian?",ta:"இணையத்தில் மருத்துவச் சந்திப்பைச் சரிபார்க்க அல்லது பணம் செலுத்த முடியுமா?"},
"q.yes":{en:"Yes",zh:"可以",ms:"Ya",ta:"ஆம்"},
"q.no":{en:"No",zh:"不可以",ms:"Tidak",ta:"இல்லை"},
"q.needAnswer":{en:"Please tap Yes or No first. Then tap Next.",zh:"请先点“可以”或“不可以”，然后点“下一步”。",ms:"Sila ketik Ya atau Tidak dahulu. Kemudian ketik Seterusnya.",ta:"முதலில் “ஆம்” அல்லது “இல்லை” என்பதைத் தட்டுங்கள். பிறகு “அடுத்து” என்பதைத் தட்டுங்கள்."},

"L1.desc":{en:"Kaki shows every step and stays with you. You get a short list of lessons, with no busy home page.",zh:"Kaki 会带您走每一步。您会看到简单的课程清单，没有复杂的主页。",ms:"Kaki tunjukkan setiap langkah dan sentiasa bersama anda. Anda dapat senarai pelajaran yang ringkas, tanpa halaman utama yang sibuk.",ta:"காக்கி ஒவ்வொரு படியையும் காட்டி உங்களுடன் இருக்கும். நெரிசலான முகப்புப் பக்கம் இல்லாமல், சிறிய பாடப் பட்டியல் கிடைக்கும்."},
"L2.desc":{en:"Kaki gives a hint when you need one. You choose from a short, plain list of lessons.",zh:"需要时 Kaki 会给您提示。您从简单的课程清单里挑选。",ms:"Kaki beri petunjuk apabila anda perlukannya. Anda pilih daripada senarai pelajaran yang ringkas.",ta:"தேவைப்படும்போது காக்கி குறிப்பு தரும். எளிய பாடப் பட்டியலிலிருந்து நீங்கள் தேர்ந்தெடுப்பீர்கள்."},
"L3.desc":{en:"You start on the full home page and can go anywhere. Kaki is one tap away.",zh:"您从完整的主页开始，想去哪里都可以。Kaki 一点就到。",ms:"Anda mula di halaman utama penuh dan boleh pergi ke mana sahaja. Kaki hanya satu ketikan jauhnya.",ta:"முழு முகப்புப் பக்கத்திலிருந்து தொடங்கி எங்கும் செல்லலாம். காக்கி ஒரு தட்டலில் வரும்."},

"bank.sub":{en:"Pick any. Kaki uses this to show you a layout you know.",zh:"可以选多个。Kaki 会给您看熟悉的样子。",ms:"Pilih mana-mana. Kaki gunakan ini untuk tunjuk susun atur yang anda kenal.",ta:"எதை வேண்டுமானாலும் தேர்ந்தெடுங்கள். உங்களுக்குப் பழக்கமான வடிவத்தைக் காட்டக் காக்கி இதைப் பயன்படுத்தும்."},

/* ---- before the PayNow practice ---- */
"intro.badge":{en:"Practice copy · pretend money",zh:"练习版 · 假钱",ms:"Salinan latihan · wang olok-olok",ta:"பயிற்சிப் பதிப்பு · போலிப் பணம்"},
"intro.title":{en:"Send money with PayNow",zh:"用 PayNow 转钱",ms:"Hantar wang dengan PayNow",ta:"PayNow மூலம் பணம் அனுப்புதல்"},
"intro.meta":{en:"6 steps · about 4 minutes · Level {n}",zh:"6 步 · 大约 4 分钟 · 第 {n} 级",ms:"6 langkah · lebih kurang 4 minit · Tahap {n}",ta:"6 படிகள் · சுமார் 4 நிமிடம் · நிலை {n}"},
"intro.kakiLabel":{en:"Kaki says",zh:"Kaki 说",ms:"Kata Kaki",ta:"காக்கி சொல்கிறது"},
"intro.kaki":{en:"PayNow is a way to send money using a phone number. I show the way, and you do the tapping. Nothing real is sent.",zh:"PayNow 是用手机号码转钱的方法。我来带路，您自己点。不会真的转出任何钱。",ms:"PayNow ialah cara menghantar wang menggunakan nombor telefon. Saya tunjuk jalan, anda yang ketik. Tiada wang sebenar dihantar.",ta:"PayNow என்பது தொலைபேசி எண்ணைப் பயன்படுத்திப் பணம் அனுப்பும் வழி. நான் வழி காட்டுவேன், நீங்கள் தட்டுவீர்கள். உண்மையான பணம் எதுவும் அனுப்பப்படாது."},
"intro.helpQ":{en:"How much help would you like?",zh:"您需要多少帮助？",ms:"Berapa banyak bantuan yang anda mahu?",ta:"உங்களுக்கு எவ்வளவு உதவி வேண்டும்?"},
"mode.explain":{en:"Explain simply",zh:"简单讲解",ms:"Terangkan dengan mudah",ta:"எளிதாக விளக்கு"},
"mode.hint":{en:"Give me a hint",zh:"给我提示",ms:"Beri saya petunjuk",ta:"எனக்குக் குறிப்பு கொடு"},
"mode.self":{en:"Try it myself",zh:"我自己试",ms:"Saya cuba sendiri",ta:"நானே முயற்சிக்கிறேன்"},
"mode.explainSub":{en:"Kaki explains each step and points to the button.",zh:"Kaki 讲解每一步，并指出要点的按钮。",ms:"Kaki terangkan setiap langkah dan tunjuk butangnya.",ta:"காக்கி ஒவ்வொரு படியையும் விளக்கி, பொத்தானைச் சுட்டிக்காட்டும்."},
"mode.hintSub":{en:"Kaki circles the button and gives a short hint.",zh:"Kaki 圈出按钮，给一个简短的提示。",ms:"Kaki bulatkan butang dan beri petunjuk ringkas.",ta:"காக்கி பொத்தானைச் சுற்றி வட்டமிட்டு, சிறு குறிப்பு தரும்."},
"mode.selfSub":{en:"No circles at first. A hint appears if you get stuck.",zh:"一开始没有圈。如果您卡住了，就会出现提示。",ms:"Tiada bulatan pada mulanya. Petunjuk muncul jika anda tersekat.",ta:"முதலில் வட்டம் இருக்காது. நீங்கள் தடுமாறினால் குறிப்பு தோன்றும்."},
"try.title":{en:"Ready to try?",zh:"准备好试试了吗？",ms:"Sedia untuk mencuba?",ta:"முயற்சிக்கத் தயாரா?"},
"try.say":{en:"You can watch me do it first, or try it yourself now. Both are fine.",zh:"您可以先看我做一遍，或者现在就自己试。两样都可以。",ms:"Anda boleh tengok saya buat dahulu, atau cuba sendiri sekarang. Kedua-duanya baik.",ta:"முதலில் நான் செய்வதைப் பார்க்கலாம், அல்லது இப்போதே நீங்களே முயற்சிக்கலாம். இரண்டுமே நல்லது."},
"try.watch":{en:"Watch Kaki do it first",zh:"先看 Kaki 做一遍",ms:"Tengok Kaki buat dahulu",ta:"முதலில் காக்கி செய்வதைப் பாருங்கள்"},
"try.start":{en:"I’ll try it now",zh:"我现在就试",ms:"Saya cuba sekarang",ta:"இப்போதே முயற்சிக்கிறேன்"},
"try.watched":{en:"You watched Kaki. Now it is your turn!",zh:"您看完了 Kaki 的示范，现在轮到您了！",ms:"Anda sudah tengok Kaki. Sekarang giliran anda!",ta:"காக்கி செய்ததைப் பார்த்தீர்கள். இப்போது உங்கள் முறை!"},

/* ---- the PayNow practice (do-it-with-me) ---- */
"task.title":{en:"Send money with PayNow",zh:"用 PayNow 转钱",ms:"Hantar wang dengan PayNow",ta:"PayNow மூலம் பணம் அனுப்புதல்"},
"task.do":{en:"Do this",zh:"这样做",ms:"Buat ini",ta:"இதைச் செய்யுங்கள்"},
"task.watch":{en:"Watch Kaki",zh:"看 Kaki 做",ms:"Tengok Kaki",ta:"காக்கியைப் பாருங்கள்"},
"task.ribbon":{en:"Practice copy · pretend money · safe to try",zh:"练习版 · 假钱 · 放心试",ms:"Salinan latihan · wang olok-olok · selamat dicuba",ta:"பயிற்சிப் பதிப்பு · போலிப் பணம் · பயமின்றி முயற்சிக்கலாம்"},
"task.again":{en:"Show me again",zh:"再教我一次",ms:"Tunjuk sekali lagi",ta:"மீண்டும் காட்டுங்கள்"},
"task.person":{en:"Ask a person",zh:"找人帮忙",ms:"Minta bantuan orang",ta:"ஒருவரிடம் கேளுங்கள்"},
"task.watchNext":{en:"Show me the next step",zh:"给我看下一步",ms:"Tunjuk langkah seterusnya",ta:"அடுத்த படியைக் காட்டுங்கள்"},
"task.watchNote":{en:"Kaki is showing you. Just watch, then tap the button below when you are ready.",zh:"Kaki 正在示范给您看。看完准备好了，就点下面的按钮。",ms:"Kaki sedang tunjuk kepada anda. Tengok sahaja, kemudian ketik butang di bawah apabila anda bersedia.",ta:"காக்கி உங்களுக்குக் காட்டுகிறது. பாருங்கள், தயாரானதும் கீழே உள்ள பொத்தானைத் தட்டுங்கள்."},
"task.find":{en:"Find the right button and tap it.",zh:"找到对的按钮，点一下。",ms:"Cari butang yang betul dan ketik.",ta:"சரியான பொத்தானைக் கண்டுபிடித்துத் தட்டுங்கள்."},
"task.stop":{en:"Stop practising",zh:"停止练习",ms:"Berhenti berlatih",ta:"பயிற்சியை நிறுத்து"},
"st.1.t":{en:"Open PayNow",zh:"打开 PayNow",ms:"Buka PayNow",ta:"PayNow-ஐத் திறங்கள்"},
"st.1.explain":{en:"PayNow sends money using a phone number. Tap the green PayNow button. I put an orange ring around it.",zh:"PayNow 用手机号码转钱。点绿色的 PayNow 按钮，我在它外面画了一个橙色的圈。",ms:"PayNow menghantar wang menggunakan nombor telefon. Ketik butang hijau PayNow. Saya letak bulatan oren di sekelilingnya.",ta:"PayNow தொலைபேசி எண் மூலம் பணம் அனுப்பும். பச்சை நிற PayNow பொத்தானைத் தட்டுங்கள். அதைச் சுற்றி ஆரஞ்சு வட்டம் போட்டிருக்கிறேன்."},
"st.1.hint":{en:"Find the green button with the paper plane.",zh:"找那个有纸飞机的绿色按钮。",ms:"Cari butang hijau dengan gambar kapal terbang kertas.",ta:"காகித விமானப் படம் உள்ள பச்சைப் பொத்தானைக் கண்டுபிடியுங்கள்."},
"st.1.self":{en:"Start a PayNow transfer.",zh:"开始一次 PayNow 转账。",ms:"Mulakan pemindahan PayNow.",ta:"ஒரு PayNow பரிமாற்றத்தைத் தொடங்குங்கள்."},
"st.1.cap":{en:"Tap PayNow.",zh:"点 PayNow。",ms:"Ketik PayNow.",ta:"PayNow-ஐத் தட்டுங்கள்."},
"st.2.t":{en:"Choose who gets the money",zh:"选收钱的人",ms:"Pilih siapa yang terima wang",ta:"பணம் யாருக்கு எனத் தேர்ந்தெடுங்கள்"},
"st.2.explain":{en:"Now choose who gets the money. Tap Wei Ming, your son. He is already saved, which is safer.",zh:"现在选择谁收钱。点您的儿子 Wei Ming。他已经存在名单里，这样比较安全。",ms:"Sekarang pilih siapa yang menerima wang. Ketik Wei Ming, anak anda. Dia sudah disimpan, jadi lebih selamat.",ta:"இப்போது பணம் யாருக்கு எனத் தேர்ந்தெடுங்கள். உங்கள் மகன் Wei Ming-ஐத் தட்டுங்கள். அவர் ஏற்கனவே சேமிக்கப்பட்டவர், அது பாதுகாப்பானது."},
"st.2.hint":{en:"Pick your son from your saved list.",zh:"从存好的名单里选您的儿子。",ms:"Pilih anak anda daripada senarai yang disimpan.",ta:"சேமித்த பட்டியலிலிருந்து உங்கள் மகனைத் தேர்ந்தெடுங்கள்."},
"st.2.self":{en:"Choose your son.",zh:"选您的儿子。",ms:"Pilih anak anda.",ta:"உங்கள் மகனைத் தேர்ந்தெடுங்கள்."},
"st.2.cap":{en:"Tap Wei Ming.",zh:"点 Wei Ming。",ms:"Ketik Wei Ming.",ta:"Wei Ming-ஐத் தட்டுங்கள்."},
"st.3.t":{en:"Choose the amount",zh:"选金额",ms:"Pilih jumlah",ta:"தொகையைத் தேர்ந்தெடுங்கள்"},
"st.3.explain":{en:"Choose how much to send. Tap $10, then tap Next.",zh:"选择要转多少钱。点 $10，然后点“下一步”。",ms:"Pilih berapa banyak untuk dihantar. Ketik $10, kemudian ketik Seterusnya.",ta:"எவ்வளவு அனுப்ப வேண்டும் எனத் தேர்ந்தெடுங்கள். $10 என்பதைத் தட்டி, பிறகு “அடுத்து” என்பதைத் தட்டுங்கள்."},
"st.3.hint":{en:"Tap $10, then Next.",zh:"点 $10，再点“下一步”。",ms:"Ketik $10, kemudian Seterusnya.",ta:"$10, பிறகு “அடுத்து”."},
"st.3.self":{en:"Send him $10.",zh:"转 $10 给他。",ms:"Hantar $10 kepadanya.",ta:"அவருக்கு $10 அனுப்புங்கள்."},
"st.3.cap":{en:"Tap $10.",zh:"点 $10。",ms:"Ketik $10.",ta:"$10 என்பதைத் தட்டுங்கள்."},
"st.3.cap2":{en:"Now tap Next.",zh:"现在点“下一步”。",ms:"Sekarang ketik Seterusnya.",ta:"இப்போது “அடுத்து” என்பதைத் தட்டுங்கள்."},
"st.4.t":{en:"Check the name",zh:"检查名字",ms:"Semak nama",ta:"பெயரைச் சரிபாருங்கள்"},
"st.4.explain":{en:"Always check the name before you send. It says TAN WEI MING, your son. If it is right, tap Send now.",zh:"转钱前一定要检查名字。这里写着 TAN WEI MING，是您的儿子。没错的话，点“现在发送”。",ms:"Sentiasa semak nama sebelum menghantar. Tertulis TAN WEI MING, anak anda. Jika betul, ketik Hantar sekarang.",ta:"அனுப்பும் முன் எப்போதும் பெயரைச் சரிபாருங்கள். TAN WEI MING என்று உள்ளது, உங்கள் மகன். சரியாக இருந்தால் “இப்போது அனுப்பு” என்பதைத் தட்டுங்கள்."},
"st.4.hint":{en:"Check the name, then tap Send now.",zh:"检查名字，再点“现在发送”。",ms:"Semak nama, kemudian ketik Hantar sekarang.",ta:"பெயரைச் சரிபார்த்து, “இப்போது அனுப்பு” என்பதைத் தட்டுங்கள்."},
"st.4.self":{en:"Check, then send.",zh:"检查，然后发送。",ms:"Semak, kemudian hantar.",ta:"சரிபார்த்து, அனுப்புங்கள்."},
"st.4.cap":{en:"Tap Send now.",zh:"点“现在发送”。",ms:"Ketik Hantar sekarang.",ta:"“இப்போது அனுப்பு” என்பதைத் தட்டுங்கள்."},
"st.5.t":{en:"Say yes to send",zh:"确认发送",ms:"Sahkan untuk hantar",ta:"அனுப்ப உறுதிசெய்யுங்கள்"},
"st.5.explain":{en:"The app asks: are you sure? This is your last chance to stop. Everything is right, so tap Yes, send.",zh:"应用会问：您确定吗？这是最后一次可以停下来的机会。一切都对，就点“是，发送”。",ms:"Aplikasi bertanya: anda pasti? Ini peluang terakhir untuk berhenti. Semuanya betul, jadi ketik Ya, hantar.",ta:"“உறுதியா?” என்று செயலி கேட்கிறது. நிறுத்த இதுவே கடைசி வாய்ப்பு. எல்லாம் சரியாக இருப்பதால் “ஆம், அனுப்புங்கள்” என்பதைத் தட்டுங்கள்."},
"st.5.hint":{en:"Tap Yes, send.",zh:"点“是，发送”。",ms:"Ketik Ya, hantar.",ta:"“ஆம், அனுப்புங்கள்” என்பதைத் தட்டுங்கள்."},
"st.5.self":{en:"Confirm the payment.",zh:"确认这笔付款。",ms:"Sahkan bayaran itu.",ta:"கட்டணத்தை உறுதிசெய்யுங்கள்."},
"st.5.cap":{en:"Tap Yes, send.",zh:"点“是，发送”。",ms:"Ketik Ya, hantar.",ta:"“ஆம், அனுப்புங்கள்” என்பதைத் தட்டுங்கள்."},
"st.6.t":{en:"All done",zh:"完成了",ms:"Semua selesai",ta:"எல்லாம் முடிந்தது"},
"st.6.explain":{en:"Sent! This was pretend money, so nothing left your bank. Tap Done.",zh:"发送了！这是假钱，您的银行户口没有少钱。点“完成”。",ms:"Sudah dihantar! Ini wang olok-olok, jadi tiada wang keluar dari bank anda. Ketik Selesai.",ta:"அனுப்பப்பட்டது! இது போலிப் பணம், உங்கள் வங்கியிலிருந்து எதுவும் போகவில்லை. “முடிந்தது” என்பதைத் தட்டுங்கள்."},
"st.6.hint":{en:"Tap Done.",zh:"点“完成”。",ms:"Ketik Selesai.",ta:"“முடிந்தது” என்பதைத் தட்டுங்கள்."},
"st.6.self":{en:"Finish up.",zh:"完成它。",ms:"Selesaikan.",ta:"முடித்துவிடுங்கள்."},
"st.6.cap":{en:"Tap Done.",zh:"点“完成”。",ms:"Ketik Selesai.",ta:"“முடிந்தது” என்பதைத் தட்டுங்கள்."},
"oops.ok":{en:"That’s OK, nothing happened.",zh:"没关系，什么都没有发生。",ms:"Tidak mengapa, tiada apa yang berlaku.",ta:"பரவாயில்லை, எதுவும் நடக்கவில்லை."},
"oops.look":{en:"Look for the orange ring, then tap it.",zh:"找那个橙色的圈，然后点它。",ms:"Cari bulatan oren, kemudian ketik.",ta:"ஆரஞ்சு வட்டத்தைத் தேடி, அதைத் தட்டுங்கள்."},
"oops.try":{en:"Have another look, then try again.",zh:"再看一看，然后再试一次。",ms:"Lihat sekali lagi, kemudian cuba semula.",ta:"மீண்டும் ஒருமுறை பார்த்து, மறுபடி முயற்சி செய்யுங்கள்."},
"wrong.scan":{en:"Scan is for paying at a shop with a QR code (a square barcode).",zh:"“扫码”是在商店用二维码（方形的码）付款用的。",ms:"Imbas digunakan untuk membayar di kedai dengan kod QR (kod bar segi empat).",ta:"“ஸ்கேன்” என்பது கடையில் QR குறியீட்டுடன் (சதுரக் குறியீடு) செலுத்துவதற்கு."},
"wrong.topup":{en:"Top up adds money to a wallet. Today we use PayNow.",zh:"“充值”是给钱包加钱的。今天我们用 PayNow。",ms:"Tambah nilai menambah wang ke dompet. Hari ini kita guna PayNow.",ta:"“பணம் சேர்” பணப்பையில் பணம் சேர்க்கும். இன்று நாம் PayNow பயன்படுத்துகிறோம்."},
"wrong.stall":{en:"That is a food stall. We are sending money to your son.",zh:"那是一个小食摊。我们是要转钱给您的儿子。",ms:"Itu gerai makanan. Kita menghantar wang kepada anak anda.",ta:"அது ஒரு உணவுக் கடை. நாம் உங்கள் மகனுக்குப் பணம் அனுப்புகிறோம்."},
"wrong.amount":{en:"In this practice we send $10.",zh:"这次练习我们转 $10。",ms:"Dalam latihan ini kita hantar $10.",ta:"இந்தப் பயிற்சியில் நாம் $10 அனுப்புகிறோம்."},
"wrong.next":{en:"First choose $10. Then tap Next.",zh:"先选 $10，再点“下一步”。",ms:"Pilih $10 dahulu. Kemudian ketik Seterusnya.",ta:"முதலில் $10 என்பதைத் தேர்ந்தெடுங்கள். பிறகு “அடுத்து” என்பதைத் தட்டுங்கள்."},
"wrong.other":{en:"That button is not part of today’s lesson.",zh:"那个按钮不在今天的课里。",ms:"Butang itu bukan sebahagian daripada pelajaran hari ini.",ta:"அந்தப் பொத்தான் இன்றைய பாடத்தில் இல்லை."},

"new.title":{en:"Stop and check",zh:"停一停，查一查",ms:"Berhenti dan semak",ta:"நிறுத்திச் சரிபாருங்கள்"},
"new.text":{en:"Scammers often ask you to pay a new number. Sometimes they pretend to be family. Only pay numbers you already know.",zh:"骗子常常叫您转钱给一个新号码，有时还会假装是家人。只转钱给您早就认识的号码。",ms:"Penipu selalu minta anda bayar ke nombor baharu. Kadang-kadang mereka berpura-pura menjadi keluarga. Bayar hanya kepada nombor yang anda sudah kenal.",ta:"மோசடிக்காரர்கள் அடிக்கடி புதிய எண்ணுக்குப் பணம் அனுப்பச் சொல்வார்கள். சில நேரம் குடும்பத்தினர் போல் நடிப்பார்கள். ஏற்கனவே தெரிந்த எண்களுக்கு மட்டும் பணம் அனுப்புங்கள்."},
"new.todo":{en:"Not sure who it is? Call the person on their old number first.",zh:"不确定是谁？先打他们原来的号码问一问。",ms:"Tidak pasti siapa? Telefon orang itu di nombor lamanya dahulu.",ta:"யார் என்று உறுதியில்லையா? முதலில் அவர்களின் பழைய எண்ணுக்கு அழையுங்கள்."},
"new.back":{en:"Go back to my saved list",zh:"回到我存好的名单",ms:"Kembali ke senarai simpanan saya",ta:"என் சேமித்த பட்டியலுக்குத் திரும்பு"},
"new.learn":{en:"Learn the 3 scam signs",zh:"学 3 个诈骗迹象",ms:"Belajar 3 tanda penipuan",ta:"மோசடியின் 3 அறிகுறிகளைக் கற்றுக்கொள்"},
"quit.title":{en:"Stop practising?",zh:"要停止练习吗？",ms:"Berhenti berlatih?",ta:"பயிற்சியை நிறுத்தவா?"},
"quit.text":{en:"That’s OK. Your progress is saved, and you can start again any time.",zh:"没关系。您的进度已经保存，随时可以重新开始。",ms:"Tidak mengapa. Kemajuan anda disimpan, dan anda boleh mula semula bila-bila masa.",ta:"பரவாயில்லை. உங்கள் முன்னேற்றம் சேமிக்கப்பட்டுள்ளது, எப்போது வேண்டுமானாலும் மீண்டும் தொடங்கலாம்."},
"quit.keep":{en:"Keep going",zh:"继续练习",ms:"Teruskan",ta:"தொடருங்கள்"},
"quit.stop":{en:"Stop for now",zh:"先停下来",ms:"Berhenti dahulu",ta:"இப்போதைக்கு நிறுத்து"},

"done.real":{en:"Real test: try it on your own banking app next, then tick it in your garden.",zh:"真正的考验：下次在您自己的银行应用上试试，然后在花园里打勾。",ms:"Ujian sebenar: cuba pada aplikasi bank anda sendiri nanti, kemudian tandakan di taman anda.",ta:"உண்மையான சோதனை: அடுத்து உங்கள் சொந்த வங்கிச் செயலியில் முயற்சி செய்து, பிறகு தோட்டத்தில் குறியிடுங்கள்."},

"card.badge":{en:"Large-print lesson card",zh:"大字课程卡",ms:"Kad pelajaran cetakan besar",ta:"பெரிய எழுத்துப் பாட அட்டை"},

"card.1":{en:"Open your bank app. Tap PayNow.",zh:"打开银行应用，点 PayNow。",ms:"Buka aplikasi bank anda. Ketik PayNow.",ta:"உங்கள் வங்கிச் செயலியைத் திறந்து PayNow-ஐத் தட்டுங்கள்."},

"card.3":{en:"Choose the amount. Tap Next.",zh:"选金额，点“下一步”。",ms:"Pilih jumlah. Ketik Seterusnya.",ta:"தொகையைத் தேர்ந்தெடுத்து “அடுத்து” என்பதைத் தட்டுங்கள்."},
"card.4":{en:"Check the name. Right person? Tap Send now.",zh:"检查名字。人对了吗？点“现在发送”。",ms:"Semak nama. Orang yang betul? Ketik Hantar sekarang.",ta:"பெயரைச் சரிபாருங்கள். சரியான நபரா? “இப்போது அனுப்பு” என்பதைத் தட்டுங்கள்."},

"card.warn":{en:"Never send money to a new number someone texts you.",zh:"千万不要转钱给别人用短信发给您的新号码。",ms:"Jangan sekali-kali hantar wang ke nombor baharu yang seseorang hantar melalui mesej.",ta:"யாராவது குறுஞ்செய்தியில் அனுப்பும் புதிய எண்ணுக்கு ஒருபோதும் பணம் அனுப்பாதீர்கள்."},
"card.note":{en:"Ask the staff at Kaki Corner to print this card for you. You can open it again any time from your garden.",zh:"可以请 Kaki 学习角的职员帮您印这张卡。您随时可以从花园里再打开它。",ms:"Minta kakitangan di Sudut Kaki cetak kad ini untuk anda. Anda boleh buka semula bila-bila masa dari taman anda.",ta:"இந்த அட்டையை அச்சிட்டுத் தரக் காக்கி மூலை ஊழியர்களிடம் கேளுங்கள். உங்கள் தோட்டத்திலிருந்து எப்போது வேண்டுமானாலும் மீண்டும் திறக்கலாம்."},

"guide.soon":{en:"This is a picture guide. A full practice copy is coming soon.",zh:"这是图片指南。完整的练习版很快就会推出。",ms:"Ini panduan bergambar. Salinan latihan penuh akan datang tidak lama lagi.",ta:"இது படங்களுடன் கூடிய வழிகாட்டி. முழுப் பயிற்சிப் பதிப்பு விரைவில் வரும்."},
"guide.prev":{en:"Previous step",zh:"上一步",ms:"Langkah sebelumnya",ta:"முந்தைய படி"},

"guide.doneTitle":{en:"Well done!",zh:"做得好！",ms:"Syabas!",ta:"நன்று!"},
"guide.doneText":{en:"You have seen every step. You can open this guide again any time.",zh:"您已经看完每一步了。随时可以再打开这个指南。",ms:"Anda sudah lihat setiap langkah. Anda boleh buka panduan ini lagi bila-bila masa.",ta:"எல்லாப் படிகளையும் பார்த்துவிட்டீர்கள். இந்த வழிகாட்டியை எப்போது வேண்டுமானாலும் மீண்டும் திறக்கலாம்."},
"guide.wrong":{en:"That’s OK, nothing happened. In this step, tap the button with the orange ring.",zh:"没关系，什么都没有发生。这一步请点有橙色圈的按钮。",ms:"Tidak mengapa, tiada apa yang berlaku. Dalam langkah ini, ketik butang yang ada bulatan oren.",ta:"பரவாயில்லை, எதுவும் நடக்கவில்லை. இந்தப் படியில் ஆரஞ்சு வட்டம் உள்ள பொத்தானைத் தட்டுங்கள்."},

"g.singpass.3.d":{en:"Tap Approve, then look at the phone or touch the sensor.",zh:"点“批准”，然后看着手机，或者按一下指纹的地方。",ms:"Ketik Luluskan, kemudian lihat telefon atau sentuh pengimbas.",ta:"“ஒப்புதல்” என்பதைத் தட்டி, பிறகு தொலைபேசியைப் பாருங்கள் அல்லது கைரேகைப் பகுதியைத் தொடுங்கள்."},

"g.transport.4.t":{en:"Save the stop for next time",zh:"收藏这个车站，下次更快",ms:"Simpan perhentian ini untuk lain kali",ta:"அடுத்த முறைக்கு இந்த நிறுத்தத்தைச் சேமியுங்கள்"},
"g.transport.4.d":{en:"Tap Save this stop. Next time it will be at the top.",zh:"点“收藏这个车站”，下次它就会在最上面。",ms:"Ketik Simpan perhentian ini. Lain kali ia akan berada di atas.",ta:"“இந்த நிறுத்தத்தைச் சேமி” என்பதைத் தட்டுங்கள். அடுத்த முறை அது மேலே இருக்கும்."},
"g.transport.4.cap":{en:"Tap Save this stop.",zh:"点“收藏这个车站”。",ms:"Ketik Simpan perhentian ini.",ta:"“இந்த நிறுத்தத்தைச் சேமி” என்பதைத் தட்டுங்கள்."},
"g.save":{en:"Save this stop",zh:"收藏这个车站",ms:"Simpan perhentian ini",ta:"இந்த நிறுத்தத்தைச் சேமி"},
"g.family.title":{en:"Video call your family",zh:"和家人视频通话",ms:"Panggilan video dengan keluarga",ta:"குடும்பத்தினருடன் வீடியோ அழைப்பு"},
"g.family.1.t":{en:"Open WhatsApp",zh:"打开 WhatsApp",ms:"Buka WhatsApp",ta:"WhatsApp-ஐத் திறங்கள்"},
"g.family.1.d":{en:"Tap the green WhatsApp app once.",zh:"点一下绿色的 WhatsApp。",ms:"Ketik aplikasi WhatsApp hijau sekali.",ta:"பச்சை நிற WhatsApp செயலியை ஒருமுறை தட்டுங்கள்."},
"g.family.1.cap":{en:"Tap WhatsApp.",zh:"点 WhatsApp。",ms:"Ketik WhatsApp.",ta:"WhatsApp-ஐத் தட்டுங்கள்."},
"g.family.2.t":{en:"Choose the person",zh:"选要找的人",ms:"Pilih orang itu",ta:"அந்த நபரைத் தேர்ந்தெடுங்கள்"},
"g.family.2.d":{en:"Tap the chat with the person you want to call.",zh:"点您想打给的那个人的聊天。",ms:"Ketik perbualan dengan orang yang anda mahu telefon.",ta:"நீங்கள் அழைக்க விரும்பும் நபரின் உரையாடலைத் தட்டுங்கள்."},
"g.family.2.cap":{en:"Tap Wei Ming.",zh:"点 Wei Ming。",ms:"Ketik Wei Ming.",ta:"Wei Ming-ஐத் தட்டுங்கள்."},
"g.famGroup":{en:"Family group",zh:"家人群组",ms:"Kumpulan keluarga",ta:"குடும்பக் குழு"},
"g.neighbour":{en:"Mrs Tan (neighbour)",zh:"陈太太（邻居）",ms:"Puan Tan (jiran)",ta:"திருமதி டான் (அண்டை வீட்டார்)"},
"g.family.3.t":{en:"Tap the video camera",zh:"点摄像机",ms:"Ketik kamera video",ta:"வீடியோ கேமராவைத் தட்டுங்கள்"},
"g.family.3.d":{en:"At the top of the chat, tap the video camera. The phone starts calling your son.",zh:"在聊天画面上方，点摄像机。手机就会开始打给您的儿子。",ms:"Di bahagian atas perbualan, ketik kamera video. Telefon akan mula memanggil anak anda.",ta:"உரையாடலின் மேலே உள்ள வீடியோ கேமராவைத் தட்டுங்கள். தொலைபேசி உங்கள் மகனை அழைக்கத் தொடங்கும்."},
"g.family.3.cap":{en:"Tap Video call.",zh:"点“视频通话”。",ms:"Ketik Panggilan video.",ta:"“வீடியோ அழைப்பு” என்பதைத் தட்டுங்கள்."},
"g.video":{en:"Video call",zh:"视频通话",ms:"Panggilan video",ta:"வீடியோ அழைப்பு"},
"g.voice":{en:"Voice call",zh:"语音通话",ms:"Panggilan suara",ta:"குரல் அழைப்பு"},
"g.family.4.t":{en:"Talk, then end the call",zh:"聊完，挂断",ms:"Berbual, kemudian tamatkan panggilan",ta:"பேசி முடித்து, அழைப்பை முடியுங்கள்"},
"g.family.4.d":{en:"Hold the phone in front of your face. When you finish, tap the red End call button.",zh:"把手机拿在脸的前面。聊完了，点红色的“挂断”。",ms:"Pegang telefon di hadapan muka anda. Apabila selesai, ketik butang merah Tamatkan panggilan.",ta:"தொலைபேசியை உங்கள் முகத்துக்கு முன் பிடியுங்கள். பேசி முடித்ததும் சிவப்பு “அழைப்பை முடி” பொத்தானைத் தட்டுங்கள்."},
"g.family.4.cap":{en:"Tap End call.",zh:"点“挂断”。",ms:"Ketik Tamatkan panggilan.",ta:"“அழைப்பை முடி” என்பதைத் தட்டுங்கள்."},
"g.onCall":{en:"On a video call with Wei Ming",zh:"正在和 Wei Ming 视频通话",ms:"Dalam panggilan video dengan Wei Ming",ta:"Wei Ming-உடன் வீடியோ அழைப்பில்"},
"g.end":{en:"End call",zh:"挂断",ms:"Tamatkan panggilan",ta:"அழைப்பை முடி"},
"g.topup.title":{en:"Top up a wallet",zh:"给钱包充值",ms:"Tambah nilai dompet",ta:"பணப்பையில் பணம் சேர்த்தல்"},
"g.topup.2.t":{en:"Tap Top up",zh:"点“充值”",ms:"Ketik Tambah nilai",ta:"“பணம் சேர்” என்பதைத் தட்டுங்கள்"},
"g.topup.2.d":{en:"Top up moves money from your bank account into your wallet, for paying at shops.",zh:"充值是把银行户口的钱放进钱包，方便在商店付款。",ms:"Tambah nilai memindahkan wang dari akaun bank ke dompet anda, untuk membayar di kedai.",ta:"“பணம் சேர்” உங்கள் வங்கிக் கணக்கிலிருந்து பணப்பைக்குப் பணத்தை மாற்றும். கடைகளில் செலுத்த இது உதவும்."},
"g.topup.2.cap":{en:"Tap Top up.",zh:"点“充值”。",ms:"Ketik Tambah nilai.",ta:"“பணம் சேர்” என்பதைத் தட்டுங்கள்."},
"g.topup.3.t":{en:"Choose an amount",zh:"选金额",ms:"Pilih jumlah",ta:"தொகையைத் தேர்ந்தெடுங்கள்"},
"g.topup.3.d":{en:"Tap how much you want to add.",zh:"点您要加多少钱。",ms:"Ketik jumlah yang anda mahu tambah.",ta:"எவ்வளவு சேர்க்க வேண்டுமோ அதைத் தட்டுங்கள்."},
"g.topup.3.cap":{en:"Tap $20.",zh:"点 $20。",ms:"Ketik $20.",ta:"$20 என்பதைத் தட்டுங்கள்."},
"g.topup.4.d":{en:"Add $20 to your wallet? If that is right, tap Confirm.",zh:"给钱包加 $20？对的话，点“确认”。",ms:"Tambah $20 ke dompet anda? Jika betul, ketik Sahkan.",ta:"உங்கள் பணப்பையில் $20 சேர்க்கவா? சரி என்றால் “உறுதிசெய்” என்பதைத் தட்டுங்கள்."},
"g.topup.sure":{en:"Add $20.00 to your wallet",zh:"给钱包加 $20.00",ms:"Tambah $20.00 ke dompet anda",ta:"பணப்பையில் $20.00 சேர்"},
"g.scan.title":{en:"Scan to pay at a shop",zh:"在商店扫码付款",ms:"Imbas untuk bayar di kedai",ta:"கடையில் ஸ்கேன் செய்து செலுத்துதல்"},
"g.scan.1.t":{en:"Tap Scan",zh:"点“扫码”",ms:"Ketik Imbas",ta:"“ஸ்கேன்” என்பதைத் தட்டுங்கள்"},
"g.scan.1.d":{en:"In your bank app, tap Scan. It opens the camera to read the shop’s QR code (a square barcode).",zh:"在银行应用里点“扫码”，手机会打开相机，读商店的二维码（一个方形的码）。",ms:"Dalam aplikasi bank, ketik Imbas. Ia membuka kamera untuk membaca kod QR kedai (kod bar segi empat).",ta:"வங்கிச் செயலியில் “ஸ்கேன்” என்பதைத் தட்டுங்கள். கடையின் QR குறியீட்டை (சதுர வடிவக் குறியீடு) படிக்கக் கேமரா திறக்கும்."},
"g.scan.1.cap":{en:"Tap Scan.",zh:"点“扫码”。",ms:"Ketik Imbas.",ta:"“ஸ்கேன்” என்பதைத் தட்டுங்கள்."},
"g.scan.2.t":{en:"Let the app use the camera",zh:"让应用使用相机",ms:"Benarkan aplikasi guna kamera",ta:"செயலி கேமராவைப் பயன்படுத்த அனுமதியுங்கள்"},
"g.scan.2.d":{en:"The first time, the phone asks to use the camera. Tap Allow. Then hold the phone still over the code at the counter.",zh:"第一次用时，手机会问能不能用相机，点“允许”。然后把手机稳稳地对着柜台的二维码。",ms:"Kali pertama, telefon minta izin guna kamera. Ketik Benarkan. Kemudian pegang telefon dengan tenang di atas kod di kaunter.",ta:"முதல் முறை, கேமராவைப் பயன்படுத்தத் தொலைபேசி அனுமதி கேட்கும். “அனுமதி” என்பதைத் தட்டுங்கள். பிறகு கவுண்டரில் உள்ள குறியீட்டின் மேல் தொலைபேசியை அசையாமல் பிடியுங்கள்."},
"g.scan.2.cap":{en:"Tap Allow.",zh:"点“允许”。",ms:"Ketik Benarkan.",ta:"“அனுமதி” என்பதைத் தட்டுங்கள்."},
"g.camAsk":{en:"Let Bank app use the camera?",zh:"让银行应用使用相机吗？",ms:"Benarkan aplikasi bank guna kamera?",ta:"வங்கிச் செயலி கேமராவைப் பயன்படுத்தலாமா?"},
"g.allow":{en:"Allow",zh:"允许",ms:"Benarkan",ta:"அனுமதி"},
"g.dontAllow":{en:"Don’t allow",zh:"不允许",ms:"Jangan benarkan",ta:"அனுமதிக்காதே"},
"g.scan.3.t":{en:"Check the shop name",zh:"看清楚店名",ms:"Semak nama kedai",ta:"கடையின் பெயரைச் சரிபாருங்கள்"},
"g.scan.3.d":{en:"The shop name appears. Make sure it is the shop you are standing at.",zh:"屏幕会显示店名，确认是您所在的那家店。",ms:"Nama kedai akan muncul. Pastikan ia kedai tempat anda berada.",ta:"கடையின் பெயர் தோன்றும். நீங்கள் நிற்கும் கடைதான் என உறுதிசெய்யுங்கள்."},
"g.scan.3.cap":{en:"Tap This is the right shop.",zh:"点“店名没错”。",ms:"Ketik Kedai ini betul.",ta:"“சரியான கடை” என்பதைத் தட்டுங்கள்."},
"g.rightShop":{en:"This is the right shop",zh:"店名没错",ms:"Kedai ini betul",ta:"சரியான கடை"},
"g.wrongShop":{en:"Not this shop",zh:"不是这家店",ms:"Bukan kedai ini",ta:"இந்தக் கடை அல்ல"},
"g.scan.4.t":{en:"Type the amount and pay",zh:"输入金额，付款",ms:"Taip jumlah dan bayar",ta:"தொகையைத் தட்டச்சு செய்து செலுத்துங்கள்"},
"g.scan.4.d":{en:"Type the price and check it. Tap Pay. The app asks “Are you sure?” before it pays.",zh:"输入价钱，检查一下，再点“付款”。付款前应用会问“您确定吗？”。",ms:"Taip harga dan semak. Ketik Bayar. Aplikasi akan tanya “Anda pasti?” sebelum membayar.",ta:"விலையைத் தட்டச்சு செய்து சரிபாருங்கள். “செலுத்து” என்பதைத் தட்டுங்கள். செலுத்தும் முன் “உறுதியா?” என்று செயலி கேட்கும்."},
"g.scan.4.cap":{en:"Tap Pay $5.50.",zh:"点“付款 $5.50”。",ms:"Ketik Bayar $5.50.",ta:"“$5.50 செலுத்து” என்பதைத் தட்டுங்கள்."},
"g.pay550":{en:"Pay $5.50",zh:"付款 $5.50",ms:"Bayar $5.50",ta:"$5.50 செலுத்து"},
"g.balance.title":{en:"Check your balance",zh:"查看户口余额",ms:"Semak baki anda",ta:"உங்கள் இருப்பைப் பார்த்தல்"},
"g.balance.2.t":{en:"Log in",zh:"登录",ms:"Log masuk",ta:"உள்நுழையுங்கள்"},
"g.balance.2.d":{en:"Use your face, your fingerprint or your passcode. Never tell anyone your passcode.",zh:"用脸、指纹或密码登录。千万不要把密码告诉别人。",ms:"Guna muka, cap jari atau kod laluan anda. Jangan beritahu sesiapa kod laluan anda.",ta:"முகம், கைரேகை அல்லது கடவுக்குறியீட்டைப் பயன்படுத்துங்கள். கடவுக்குறியீட்டை யாரிடமும் சொல்லாதீர்கள்."},
"g.balance.2.cap":{en:"Tap Log in with face or fingerprint.",zh:"点“用脸或指纹登录”。",ms:"Ketik Log masuk dengan muka atau cap jari.",ta:"“முகம் அல்லது கைரேகை மூலம் உள்நுழை” என்பதைத் தட்டுங்கள்."},
"g.loginFace":{en:"Log in with face or fingerprint",zh:"用脸或指纹登录",ms:"Log masuk dengan muka atau cap jari",ta:"முகம் அல்லது கைரேகை மூலம் உள்நுழை"},
"g.loginCode":{en:"Use my passcode",zh:"用密码",ms:"Guna kod laluan saya",ta:"கடவுக்குறியீட்டைப் பயன்படுத்து"},
"g.balance.3.t":{en:"Tap Show",zh:"点“显示”",ms:"Ketik Tunjuk",ta:"“காட்டு” என்பதைத் தட்டுங்கள்"},
"g.balance.3.d":{en:"Your balance is hidden to keep it safe. Tap Show to see it.",zh:"为了安全，余额是隐藏的。点“显示”就能看到。",ms:"Baki anda disembunyikan supaya selamat. Ketik Tunjuk untuk melihatnya.",ta:"பாதுகாப்புக்காக உங்கள் இருப்பு மறைக்கப்பட்டுள்ளது. பார்க்க “காட்டு” என்பதைத் தட்டுங்கள்."},
"g.balance.3.cap":{en:"Tap Show.",zh:"点“显示”。",ms:"Ketik Tunjuk.",ta:"“காட்டு” என்பதைத் தட்டுங்கள்."},
"g.balance.4.t":{en:"Hide it again",zh:"再隐藏起来",ms:"Sembunyikan semula",ta:"மீண்டும் மறையுங்கள்"},
"g.balance.4.d":{en:"Before you put the phone down, tap Hide so nobody else sees it.",zh:"放下手机前，点“隐藏”，别人就看不到。",ms:"Sebelum meletakkan telefon, ketik Sembunyi supaya orang lain tidak nampak.",ta:"தொலைபேசியைக் கீழே வைக்கும் முன், மற்றவர்கள் பார்க்காமல் இருக்க “மறை” என்பதைத் தட்டுங்கள்."},
"g.balance.4.cap":{en:"Tap Hide.",zh:"点“隐藏”。",ms:"Ketik Sembunyi.",ta:"“மறை” என்பதைத் தட்டுங்கள்."},
/* ---- 1-minute scam lesson + quick check ---- */
"sl.badge":{en:"1-minute lesson · {a} of 3",zh:"1 分钟小课 · 第 {a} 课，共 3 课",ms:"Pelajaran 1 minit · {a} daripada 3",ta:"1 நிமிடப் பாடம் · 3-இல் {a}"},
"sl.title":{en:"3 signs of a scam",zh:"诈骗的 3 个迹象",ms:"3 tanda penipuan",ta:"மோசடியின் 3 அறிகுறிகள்"},
"sl.1.t":{en:"It rushes you",zh:"催您赶快",ms:"Ia menggesa anda",ta:"அவசரப்படுத்துகிறது"},
"sl.1.d":{en:"“Pay within 2 hours.” “Act now.” Real banks give you time.",zh:"“2 小时内付款”、“马上行动”。真正的银行会给您时间。",ms:"“Bayar dalam 2 jam.” “Bertindak sekarang.” Bank sebenar memberi anda masa.",ta:"“2 மணி நேரத்துக்குள் செலுத்துங்கள்.” “உடனே செய்யுங்கள்.” உண்மையான வங்கிகள் உங்களுக்கு நேரம் தரும்."},
"sl.2.t":{en:"It has a strange link",zh:"有奇怪的链接",ms:"Ia ada pautan yang pelik",ta:"விசித்திரமான இணைப்பு உள்ளது"},
"sl.2.d":{en:"A link is blue words that open a website. If you do not know the website, do not tap it.",zh:"链接是一串蓝色的字，点了会打开一个网站。不认识的网站，千万不要点。",ms:"Pautan ialah perkataan biru yang membuka laman web. Jika anda tidak kenal laman web itu, jangan ketik.",ta:"இணைப்பு என்பது ஓர் இணையதளத்தைத் திறக்கும் நீல நிற எழுத்துகள். அந்த இணையதளம் தெரியாவிட்டால் அதைத் தட்டாதீர்கள்."},
"sl.3.t":{en:"It asks for money or codes",zh:"要钱或要密码",ms:"Ia minta wang atau kod",ta:"பணம் அல்லது குறியீடு கேட்கிறது"},
"sl.3.d":{en:"No real bank or government office asks for your PIN or your SMS code.",zh:"真正的银行或政府部门，绝对不会向您要密码或短信验证码。",ms:"Tiada bank atau pejabat kerajaan sebenar yang meminta PIN atau kod SMS anda.",ta:"எந்த உண்மையான வங்கியும் அரசு அலுவலகமும் உங்கள் PIN எண்ணையோ SMS குறியீட்டையோ கேட்காது."},
"quiz.badge":{en:"Quick check",zh:"小测验",ms:"Semakan pantas",ta:"சிறு சோதனை"},
"quiz.title":{en:"Scam or safe?",zh:"是诈骗还是安全？",ms:"Penipuan atau selamat?",ta:"மோசடியா, பாதுகாப்பானதா?"},
"quiz.from":{en:"SMS from a number you do not know",zh:"来自陌生号码的短信",ms:"SMS daripada nombor yang anda tidak kenal",ta:"தெரியாத எண்ணிலிருந்து வந்த SMS"},
"quiz.msg":{en:"Your parcel is on hold. Pay a $1.99 fee at parcel-fee-sg.com within 2 hours or it will be returned.",zh:"您的包裹被扣留了。请在 2 小时内到 parcel-fee-sg.com 支付 $1.99 费用，否则包裹会被退回。",ms:"Bungkusan anda ditahan. Bayar yuran $1.99 di parcel-fee-sg.com dalam masa 2 jam atau ia akan dipulangkan.",ta:"உங்கள் பார்சல் நிறுத்தி வைக்கப்பட்டுள்ளது. 2 மணி நேரத்துக்குள் parcel-fee-sg.com இல் $1.99 கட்டணம் செலுத்துங்கள், இல்லையெனில் திருப்பி அனுப்பப்படும்."},
"quiz.scam":{en:"Scam",zh:"诈骗",ms:"Penipuan",ta:"மோசடி"},
"quiz.safe":{en:"Safe",zh:"安全",ms:"Selamat",ta:"பாதுகாப்பானது"},
"quiz.right":{en:"Well spotted!",zh:"看得真准！",ms:"Bagus, anda nampak!",ta:"சரியாகக் கண்டுபிடித்தீர்கள்!"},
"quiz.again":{en:"Let’s look again together.",zh:"我们一起再看一遍。",ms:"Mari kita lihat sekali lagi bersama.",ta:"சேர்ந்து மீண்டும் பார்ப்போம்."},
"quiz.why":{en:"It rushes you (2 hours), it has a strange link, and it asks you to pay. That is all 3 signs.",zh:"它催您（2 小时），有奇怪的链接，还要您付钱。3 个迹象全都有。",ms:"Ia menggesa anda (2 jam), ada pautan pelik, dan minta anda bayar. Itulah ketiga-tiga tanda.",ta:"அது அவசரப்படுத்துகிறது (2 மணி நேரம்), விசித்திரமான இணைப்பு உள்ளது, பணம் கேட்கிறது. மூன்று அறிகுறிகளும் உள்ளன."},
"quiz.collect":{en:"Collect my stamp",zh:"领取我的印章",ms:"Ambil setem saya",ta:"என் முத்திரையைப் பெறு"},

/* ---- scam check ---- */
"sc.title":{en:"Is this message a scam?",zh:"这条信息是诈骗吗？",ms:"Adakah mesej ini penipuan?",ta:"இந்தச் செய்தி மோசடியா?"},
"sc.sub":{en:"Copy the message into the box, or type it. Kaki checks it for the usual warning signs.",zh:"把信息复制到框里，或者打出来。Kaki 会帮您找常见的警告迹象。",ms:"Salin mesej ke dalam kotak, atau taip. Kaki akan semak tanda amaran yang biasa.",ta:"செய்தியைப் பெட்டிக்குள் நகலெடுங்கள் அல்லது தட்டச்சு செய்யுங்கள். வழக்கமான எச்சரிக்கை அறிகுறிகளைக் காக்கி சரிபார்க்கும்."},
"sc.label":{en:"The message to check",zh:"要检查的信息",ms:"Mesej untuk disemak",ta:"சரிபார்க்க வேண்டிய செய்தி"},
"sc.ph":{en:"Put the message here…",zh:"把信息放在这里…",ms:"Letak mesej di sini…",ta:"செய்தியை இங்கே வையுங்கள்…"},
"sc.check":{en:"Check this message",zh:"检查这条信息",ms:"Semak mesej ini",ta:"இந்தச் செய்தியைச் சரிபார்"},
"sc.example":{en:"Use an example",zh:"用一个例子",ms:"Guna contoh",ta:"ஓர் உதாரணத்தைப் பயன்படுத்து"},
"sc.exTitle":{en:"Choose an example message",zh:"选一个例子",ms:"Pilih contoh mesej",ta:"ஓர் உதாரணச் செய்தியைத் தேர்ந்தெடுங்கள்"},
"sc.empty":{en:"There is no message to check yet. Type or paste the message in the box, then tap Check this message.",zh:"还没有要检查的信息。请把信息打进或贴进框里，再点“检查这条信息”。",ms:"Belum ada mesej untuk disemak. Taip atau tampal mesej dalam kotak, kemudian ketik Semak mesej ini.",ta:"சரிபார்க்க இன்னும் செய்தி இல்லை. செய்தியைப் பெட்டியில் தட்டச்சு செய்யுங்கள் அல்லது ஒட்டுங்கள், பிறகு “இந்தச் செய்தியைச் சரிபார்” என்பதைத் தட்டுங்கள்."},
"ex.1.n":{en:"Parcel fee",zh:"包裹费",ms:"Yuran bungkusan",ta:"பார்சல் கட்டணம்"},
"ex.1.t":{en:"Your parcel is on hold. Pay a $1.99 fee at parcel-fee-sg.com within 2 hours or it will be returned.",zh:"您的包裹被扣留了。请在 2 小时内到 parcel-fee-sg.com 支付 $1.99 费用，否则包裹会被退回。",ms:"Bungkusan anda ditahan. Bayar yuran $1.99 di parcel-fee-sg.com dalam masa 2 jam atau ia akan dipulangkan.",ta:"உங்கள் பார்சல் நிறுத்தி வைக்கப்பட்டுள்ளது. 2 மணி நேரத்துக்குள் parcel-fee-sg.com இல் $1.99 கட்டணம் செலுத்துங்கள், இல்லையெனில் திருப்பி அனுப்பப்படும்."},
"ex.2.n":{en:"A new number",zh:"新号码",ms:"Nombor baharu",ta:"புதிய எண்"},
"ex.2.t":{en:"Hi Ma, this is my new number. My phone spoilt. Can you transfer $500 to me today? Urgent.",zh:"妈，这是我的新号码，我的手机坏了。今天可以转 $500 给我吗？很急。",ms:"Hai Mak, ini nombor baharu saya. Telefon saya rosak. Boleh pindahkan $500 kepada saya hari ini? Segera.",ta:"அம்மா, இது என் புதிய எண். என் தொலைபேசி பழுதாகிவிட்டது. இன்று எனக்கு $500 அனுப்ப முடியுமா? அவசரம்."},
"ex.3.n":{en:"Lunch plan",zh:"约吃午饭",ms:"Rancangan makan tengah hari",ta:"மதிய உணவுத் திட்டம்"},
"ex.3.t":{en:"Hi Auntie, lunch at the hawker centre on Sunday at 12? Wei Ming and the kids are coming too.",zh:"阿姨，星期天中午 12 点去小贩中心吃午饭好吗？Wei Ming 和孩子们也会来。",ms:"Hai Mak Cik, makan tengah hari di pusat penjaja hari Ahad pukul 12? Wei Ming dan anak-anak pun datang.",ta:"ஆன்ட்டி, ஞாயிறு மதியம் 12 மணிக்கு உணவங்காடியில் மதிய உணவு சாப்பிடலாமா? Wei Ming-உம் பிள்ளைகளும் வருகிறார்கள்."},
"sr.msg":{en:"Your message",zh:"您的信息",ms:"Mesej anda",ta:"உங்கள் செய்தி"},
"sr.red":{en:"Likely a scam",zh:"很可能是诈骗",ms:"Mungkin penipuan",ta:"பெரும்பாலும் மோசடி"},
"sr.amber":{en:"Be careful",zh:"要小心",ms:"Berhati-hati",ta:"கவனமாக இருங்கள்"},
"sr.green":{en:"Looks normal",zh:"看起来正常",ms:"Nampak biasa",ta:"சாதாரணமாகத் தெரிகிறது"},
"sr.count1":{en:"1 warning sign:",zh:"1 个警告迹象：",ms:"1 tanda amaran:",ta:"1 எச்சரிக்கை அறிகுறி:"},
"sr.count":{en:"{n} warning signs:",zh:"{n} 个警告迹象：",ms:"{n} tanda amaran:",ta:"{n} எச்சரிக்கை அறிகுறிகள்:"},
"sr.none":{en:"Kaki found none of the usual warning signs.",zh:"Kaki 没有找到常见的警告迹象。",ms:"Kaki tidak menemui sebarang tanda amaran yang biasa.",ta:"வழக்கமான எச்சரிக்கை அறிகுறிகள் எதையும் காக்கி காணவில்லை."},
"sr.todoRed":{en:"What to do: do not tap the link and do not pay. Delete the message. Not sure? Call the ScamShield Helpline at 1799.",zh:"怎么做：不要点链接，也不要付钱，把信息删掉。不确定的话，打 ScamShield 热线 1799。",ms:"Apa perlu dibuat: jangan ketik pautan dan jangan bayar. Padam mesej itu. Tidak pasti? Telefon Talian Bantuan ScamShield di 1799.",ta:"என்ன செய்வது: இணைப்பைத் தட்டாதீர்கள், பணம் செலுத்தாதீர்கள். செய்தியை அழித்துவிடுங்கள். உறுதியில்லையா? ScamShield உதவி எண் 1799-ஐ அழையுங்கள்."},
"sr.todoGreen":{en:"Still unsure? Ask someone you trust before you reply.",zh:"还是不确定？回复之前，先问问您信任的人。",ms:"Masih tidak pasti? Tanya seseorang yang anda percaya sebelum membalas.",ta:"இன்னும் உறுதியில்லையா? பதில் அனுப்பும் முன் நம்பிக்கையான ஒருவரிடம் கேளுங்கள்."},
"sr.ai":{en:"Kaki is an AI helper and can make mistakes. In this prototype, simple rules stand in for the AI.",zh:"Kaki 是人工智能助手，也可能会出错。在这个原型里，用简单的规则代替人工智能。",ms:"Kaki ialah pembantu AI dan boleh tersilap. Dalam prototaip ini, peraturan mudah menggantikan AI.",ta:"காக்கி ஒரு AI உதவியாளர், தவறு செய்யக்கூடும். இந்த மாதிரியில் AI-க்குப் பதிலாக எளிய விதிகள் பயன்படுத்தப்படுகின்றன."},
"sr.learn":{en:"Learn the 3 signs",zh:"学 3 个迹象",ms:"Belajar 3 tanda",ta:"3 அறிகுறிகளைக் கற்றுக்கொள்"},
"sr.family":{en:"Ask my family",zh:"问我的家人",ms:"Tanya keluarga saya",ta:"என் குடும்பத்தினரிடம் கேள்"},
"sr.another":{en:"Check another message",zh:"检查另一条信息",ms:"Semak mesej lain",ta:"வேறு செய்தியைச் சரிபார்"},
"sign.rush":{en:"It rushes you",zh:"它催您赶快",ms:"Ia menggesa anda",ta:"அவசரப்படுத்துகிறது"},
"sign.link":{en:"It has a link to a website",zh:"它有网站链接",ms:"Ia ada pautan ke laman web",ta:"இணையதள இணைப்பு உள்ளது"},
"sign.code":{en:"It asks for a code or password",zh:"它要验证码或密码",ms:"Ia minta kod atau kata laluan",ta:"குறியீடு அல்லது கடவுச்சொல் கேட்கிறது"},
"sign.money":{en:"It asks for money",zh:"它要钱",ms:"Ia minta wang",ta:"பணம் கேட்கிறது"},
"sign.newnum":{en:"Family on a new number",zh:"“家人”用新号码联系",ms:"“Keluarga” guna nombor baharu",ta:"புதிய எண்ணில் “குடும்பத்தினர்”"},
"sign.locked":{en:"It says your account is locked",zh:"它说您的户口被锁了",ms:"Ia kata akaun anda dikunci",ta:"உங்கள் கணக்கு முடக்கப்பட்டது என்கிறது"},

/* ---- Kaki chat ---- */
"chat.title":{en:"Ask Kaki",zh:"问 Kaki",ms:"Tanya Kaki",ta:"காக்கியிடம் கேளுங்கள்"},
"chat.hello":{en:"Hello {n}! What can I help you with?",zh:"{n}，您好！我可以帮您什么？",ms:"Helo {n}! Apa yang boleh saya bantu?",ta:"வணக்கம் {n}! நான் உங்களுக்கு எப்படி உதவலாம்?"},
"chat.ideas":{en:"Tap an idea, or type your question below.",zh:"点一个建议，或者在下面打您的问题。",ms:"Ketik satu cadangan, atau taip soalan anda di bawah.",ta:"ஒரு யோசனையைத் தட்டுங்கள், அல்லது கீழே உங்கள் கேள்வியைத் தட்டச்சு செய்யுங்கள்."},
"chat.s1":{en:"Book a clinic visit",zh:"预约看医生",ms:"Tempah lawatan klinik",ta:"மருத்துவர் சந்திப்பை முன்பதிவு செய்"},
"chat.s2":{en:"Is this message a scam?",zh:"这条信息是诈骗吗？",ms:"Adakah mesej ini penipuan?",ta:"இந்தச் செய்தி மோசடியா?"},
"chat.s3":{en:"Help me send money",zh:"教我转钱",ms:"Bantu saya hantar wang",ta:"பணம் அனுப்ப உதவுங்கள்"},
"chat.label":{en:"Your question for Kaki",zh:"您要问 Kaki 的问题",ms:"Soalan anda untuk Kaki",ta:"காக்கியிடம் உங்கள் கேள்வி"},
"chat.ph":{en:"Type your question here",zh:"在这里打您的问题",ms:"Taip soalan anda di sini",ta:"உங்கள் கேள்வியை இங்கே தட்டச்சு செய்யுங்கள்"},
"chat.talk":{en:"Talk",zh:"说话",ms:"Cakap",ta:"பேசு"},
"chat.stop":{en:"Stop",zh:"停",ms:"Berhenti",ta:"நிறுத்து"},
"chat.send":{en:"Send",zh:"发送",ms:"Hantar",ta:"அனுப்பு"},
"chat.listening":{en:"Kaki is listening. Speak, then tap Stop.",zh:"Kaki 在听。说完后点“停”。",ms:"Kaki sedang mendengar. Bercakap, kemudian ketik Berhenti.",ta:"காக்கி கேட்கிறது. பேசிவிட்டு “நிறுத்து” என்பதைத் தட்டுங்கள்."},
"chat.heard":{en:"Help me book a polyclinic appointment",zh:"帮我预约综合诊疗所",ms:"Bantu saya tempah temu janji poliklinik",ta:"பலதுறை மருந்தகச் சந்திப்பை முன்பதிவு செய்ய உதவுங்கள்"},
"chat.empty":{en:"There is no question yet. Type your question in the box, or tap Talk.",zh:"还没有问题。请在框里打您的问题，或者点“说话”。",ms:"Belum ada soalan. Taip soalan anda dalam kotak, atau ketik Cakap.",ta:"இன்னும் கேள்வி இல்லை. பெட்டியில் உங்கள் கேள்வியைத் தட்டச்சு செய்யுங்கள், அல்லது “பேசு” என்பதைத் தட்டுங்கள்."},
"chat.more":{en:"Tell me more",zh:"多讲一点",ms:"Beritahu lagi",ta:"இன்னும் சொல்லுங்கள்"},
"chat.mine":{en:"My chats",zh:"我的聊天",ms:"Perbualan saya",ta:"என் உரையாடல்கள்"},
"chat.you":{en:"You",zh:"您",ms:"Anda",ta:"நீங்கள்"},
"chat.note":{en:"Questions to Kaki are sent straight away. Nothing is sent to other people without asking you first.",zh:"给 Kaki 的问题会马上发出。没有先问过您，什么都不会发给别人。",ms:"Soalan kepada Kaki dihantar terus. Tiada apa dihantar kepada orang lain tanpa bertanya anda dahulu.",ta:"காக்கியிடம் கேட்கும் கேள்விகள் உடனே அனுப்பப்படும். உங்களிடம் முதலில் கேட்காமல் மற்றவர்களுக்கு எதுவும் அனுப்பப்படாது."},
"r.scam":{en:"I can check it for you. Put the message into the scam check.",zh:"我可以帮您检查。把信息放进“诈骗检查”里。",ms:"Saya boleh semak untuk anda. Letak mesej itu dalam semakan penipuan.",ta:"நான் உங்களுக்காகச் சரிபார்க்கிறேன். செய்தியை மோசடிச் சோதனையில் வையுங்கள்."},
"r.scam.more":{en:"Scam messages often rush you, have a strange link, or ask for money or a code. If you are not sure, do not tap anything, and call the ScamShield Helpline at 1799.",zh:"诈骗信息常常催您、有奇怪的链接，或者要钱、要验证码。不确定的话，什么都不要点，打 ScamShield 热线 1799。",ms:"Mesej penipuan selalu menggesa anda, ada pautan pelik, atau minta wang atau kod. Jika tidak pasti, jangan ketik apa-apa, dan telefon Talian Bantuan ScamShield di 1799.",ta:"மோசடிச் செய்திகள் அடிக்கடி அவசரப்படுத்தும், விசித்திரமான இணைப்பு இருக்கும், அல்லது பணம் அல்லது குறியீடு கேட்கும். உறுதியில்லையென்றால் எதையும் தட்டாதீர்கள், ScamShield உதவி எண் 1799-ஐ அழையுங்கள்."},
"r.scam.btn":{en:"Open scam check",zh:"打开诈骗检查",ms:"Buka semakan penipuan",ta:"மோசடிச் சோதனையைத் திற"},
"r.pay":{en:"PayNow sends money using a phone number. Would you like to practise with pretend money?",zh:"PayNow 用手机号码转钱。要不要用假钱练习一下？",ms:"PayNow menghantar wang menggunakan nombor telefon. Mahu berlatih dengan wang olok-olok?",ta:"PayNow தொலைபேசி எண் மூலம் பணம் அனுப்பும். போலிப் பணத்துடன் பயிற்சி செய்ய விரும்புகிறீர்களா?"},
"r.pay.more":{en:"You choose a saved person, pick the amount, check the name, then send. I show you each step, and you do the tapping.",zh:"您选一个存好的人，选金额，检查名字，然后发送。我带您走每一步，您自己点。",ms:"Anda pilih orang yang disimpan, pilih jumlah, semak nama, kemudian hantar. Saya tunjuk setiap langkah, anda yang ketik.",ta:"சேமித்த ஒருவரைத் தேர்ந்தெடுத்து, தொகையைத் தேர்ந்தெடுத்து, பெயரைச் சரிபார்த்து, அனுப்புங்கள். ஒவ்வொரு படியையும் நான் காட்டுவேன், நீங்கள் தட்டுவீர்கள்."},
"r.pay.btn":{en:"Start the PayNow lesson",zh:"开始 PayNow 课",ms:"Mula pelajaran PayNow",ta:"PayNow பாடத்தைத் தொடங்கு"},
"r.clinic":{en:"You can book a polyclinic visit in the HealthHub app. I can show you the steps.",zh:"您可以在 HealthHub 应用里预约综合诊疗所。我可以带您看步骤。",ms:"Anda boleh tempah lawatan poliklinik dalam aplikasi HealthHub. Saya boleh tunjuk langkahnya.",ta:"HealthHub செயலியில் பலதுறை மருந்தகச் சந்திப்பை முன்பதிவு செய்யலாம். படிகளை நான் காட்டுகிறேன்."},
"r.clinic.more":{en:"Open HealthHub, tap Appointments, choose a time, then check the date before you confirm.",zh:"打开 HealthHub，点“预约”，选时间，确认之前检查日期。",ms:"Buka HealthHub, ketik Temu Janji, pilih masa, kemudian semak tarikh sebelum mengesahkan.",ta:"HealthHub-ஐத் திறந்து, “சந்திப்புகள்” என்பதைத் தட்டி, நேரத்தைத் தேர்ந்தெடுத்து, உறுதிசெய்யும் முன் தேதியைச் சரிபாருங்கள்."},
"r.clinic.btn":{en:"Show me the steps",zh:"给我看步骤",ms:"Tunjuk langkahnya",ta:"படிகளைக் காட்டுங்கள்"},
"r.person":{en:"You can talk to a person at Kaki Corner, Lion Befrienders, every Tuesday at 10 am.",zh:"每个星期二上午 10 点，您可以到 Kaki 学习角（狮子乐龄之友）找人谈谈。",ms:"Anda boleh bercakap dengan seseorang di Sudut Kaki, Lion Befrienders, setiap Selasa pukul 10 pagi.",ta:"ஒவ்வொரு செவ்வாய்க்கிழமை காலை 10 மணிக்கு காக்கி மூலையில் (Lion Befrienders) ஒருவரிடம் பேசலாம்."},
"r.person.more":{en:"Or I can write a short message for your family, and you decide if you want to send it.",zh:"或者我帮您写一条短信给家人，要不要发由您决定。",ms:"Atau saya boleh tulis mesej ringkas untuk keluarga anda, dan anda putuskan sama ada mahu menghantarnya.",ta:"அல்லது உங்கள் குடும்பத்தினருக்கு ஒரு சிறு செய்தியை நான் எழுதுகிறேன், அனுப்புவதா என்பதை நீங்களே முடிவு செய்யுங்கள்."},
"r.person.btn":{en:"Talk to a person",zh:"找人谈谈",ms:"Bercakap dengan seseorang",ta:"ஒருவரிடம் பேசு"},
"r.default":{en:"I am not sure about that yet. I can help with banking, health bookings, Singpass, transport and scam checks.",zh:"这个我还不太清楚。我可以帮您处理银行、预约看病、Singpass、交通和诈骗检查。",ms:"Saya belum pasti tentang itu. Saya boleh bantu tentang perbankan, tempahan kesihatan, Singpass, pengangkutan dan semakan penipuan.",ta:"அதைப் பற்றி எனக்கு இன்னும் உறுதியாகத் தெரியவில்லை. வங்கி, மருத்துவ முன்பதிவு, Singpass, போக்குவரத்து, மோசடிச் சோதனை ஆகியவற்றில் உதவ முடியும்."},
"r.default.more":{en:"If you like, I can connect you to a person at Kaki Corner instead.",zh:"如果您愿意，我可以帮您联系 Kaki 学习角的工作人员。",ms:"Jika anda mahu, saya boleh hubungkan anda dengan seseorang di Sudut Kaki.",ta:"நீங்கள் விரும்பினால், காக்கி மூலையில் உள்ள ஒருவருடன் உங்களை இணைக்கிறேன்."},

"set.privacy":{en:"Kaki keeps only your level and your progress. You choose how long to keep your chats.",zh:"Kaki 只保存您的级别和进度。聊天要保留多久，由您决定。",ms:"Kaki hanya menyimpan tahap dan kemajuan anda. Anda pilih berapa lama perbualan disimpan.",ta:"காக்கி உங்கள் நிலையையும் முன்னேற்றத்தையும் மட்டுமே வைத்திருக்கும். உரையாடல்களை எவ்வளவு காலம் வைத்திருப்பது என்பதை நீங்களே தேர்ந்தெடுக்கலாம்."},
"set.levelChanged":{en:"Your starting point is now Level {n}.",zh:"您的起点现在是第 {n} 级。",ms:"Titik permulaan anda kini Tahap {n}.",ta:"உங்கள் தொடக்கப் புள்ளி இப்போது நிலை {n}."},
"set.notSet":{en:"Not chosen yet",zh:"还没有选",ms:"Belum dipilih",ta:"இன்னும் தேர்ந்தெடுக்கவில்லை"},

/* ---- help ---- */
"help.title":{en:"How can we help?",zh:"我们可以怎样帮您？",ms:"Bagaimana kami boleh bantu?",ta:"நாங்கள் எப்படி உதவலாம்?"},
"help.sub":{en:"You did nothing wrong. Everything is saved, and you can go back to where you were.",zh:"您没有做错任何事。一切都已保存，您可以回到刚才的地方。",ms:"Anda tidak buat apa-apa kesilapan. Semuanya disimpan, dan anda boleh kembali ke tempat tadi.",ta:"நீங்கள் எந்தத் தவறும் செய்யவில்லை. எல்லாம் சேமிக்கப்பட்டுள்ளது, நீங்கள் இருந்த இடத்துக்குத் திரும்பலாம்."},
"help.ask":{en:"Ask Kaki a question",zh:"问 Kaki 一个问题",ms:"Tanya Kaki soalan",ta:"காக்கியிடம் ஒரு கேள்வி கேளுங்கள்"},
"help.person":{en:"Talk to a person",zh:"找人谈谈",ms:"Bercakap dengan seseorang",ta:"ஒருவரிடம் பேசுங்கள்"},
"help.back":{en:"Go back to where I was",zh:"回到我刚才的地方",ms:"Kembali ke tempat saya tadi",ta:"நான் இருந்த இடத்துக்குத் திரும்பு"},
"help.tip":{en:"Tip: the Back button is always at the top left. The Help button is always at the top right.",zh:"小提示：“返回”按钮一直在左上角，“帮助”按钮一直在右上角。",ms:"Petua: butang Kembali sentiasa di atas sebelah kiri. Butang Bantuan sentiasa di atas sebelah kanan.",ta:"குறிப்பு: “பின் செல்” பொத்தான் எப்போதும் மேலே இடது பக்கத்தில் இருக்கும். “உதவி” பொத்தான் எப்போதும் மேலே வலது பக்கத்தில் இருக்கும்."},

"p.when":{en:"Next session: Tuesday, 10 am. A volunteer sits with you.",zh:"下一次：星期二上午 10 点。会有义工陪着您。",ms:"Sesi seterusnya: Selasa, 10 pagi. Seorang sukarelawan akan duduk bersama anda.",ta:"அடுத்த அமர்வு: செவ்வாய், காலை 10 மணி. ஒரு தன்னார்வலர் உங்களுடன் அமர்வார்."},
"p.book":{en:"Book a seat",zh:"预订座位",ms:"Tempah tempat duduk",ta:"இருக்கையை முன்பதிவு செய்"},
"p.family":{en:"Ask my family",zh:"问我的家人",ms:"Tanya keluarga saya",ta:"என் குடும்பத்தினரிடம் கேள்"},
"p.familySub":{en:"Kaki writes the message. You see exactly what is sent.",zh:"Kaki 帮您写信息，发什么您都看得清清楚楚。",ms:"Kaki tulis mesej. Anda nampak apa yang dihantar dengan tepat.",ta:"காக்கி செய்தியை எழுதும். என்ன அனுப்பப்படுகிறது என்பதை நீங்கள் துல்லியமாகப் பார்க்கலாம்."},
"p.msg":{en:"Hi Wei Ming, can you help me with PayNow? I am practising on Kaki. (My balance is not shared.)",zh:"Wei Ming，你可以教我用 PayNow 吗？我在 Kaki 上练习。（我的余额不会被分享。）",ms:"Hai Wei Ming, boleh tolong saya dengan PayNow? Saya sedang berlatih di Kaki. (Baki saya tidak dikongsi.)",ta:"வணக்கம் Wei Ming, PayNow-இல் எனக்கு உதவ முடியுமா? நான் காக்கியில் பயிற்சி செய்கிறேன். (என் இருப்பு பகிரப்படவில்லை.)"},
