<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banking practice simulator (version 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* =========================================================
   PAGE TOKENS (the coaching panel around the phone)
   ========================================================= */
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --page:#E7ECEA; --panel:#FFFFFF; --text:#1C2329; --sub:#56636B; --rule:#D3DBD8; --chip:#EFF3F2;
  --taskBg:#FFF5D6; --taskInk:#3A2A00;
  /* app brand (fictional "Practice Bank") */
  --brand:#0F5C6B; --brand2:#14808F; --brandInk:#093C46; --tint:#E2F0F1;
  /* the guide colour: reserved ONLY for hints, so seniors learn "amber = help" */
  --guide:#F2A900; --guideInk:#352600;
  --ok:#1E8A55; --err:#B3261E;
  --font:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#101619; --panel:#192226; --text:#E5ECEE; --sub:#9DABB1; --rule:#2C383D; --chip:#222D32;
    --taskBg:#3A3115; --taskInk:#FBE9B4;
  }
}
:root[data-theme="dark"]{
  --page:#101619; --panel:#192226; --text:#E5ECEE; --sub:#9DABB1; --rule:#2C383D; --chip:#222D32;
  --taskBg:#3A3115; --taskInk:#FBE9B4;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--page);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid #0A66D6;outline-offset:2px}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:minmax(290px,370px) auto;gap:44px;justify-content:center;align-items:start;padding:28px 24px;min-height:100%}
.coach{background:var(--panel);border-radius:20px;padding:24px;position:sticky;top:24px;max-height:calc(100dvh - 48px);overflow:auto}
.stage{display:flex;justify-content:center}
.phone{width:390px;height:800px;max-height:calc(100dvh - 56px);min-height:640px;border-radius:46px;background:#0C1012;padding:10px;box-shadow:0 30px 70px -24px rgba(8,40,46,.55)}

/* ---------- coach panel ---------- */
.c-head h1{font-size:1.55rem;line-height:1.2;margin:0 0 6px}
.c-head p{color:var(--sub);margin:0;line-height:1.5}
.c-lbl{display:block;font-weight:700;margin:20px 0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:2px solid var(--rule);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;font-size:1.05rem;display:flex;flex-direction:column;gap:2px;min-height:48px}
.seg small{font-weight:400;color:var(--sub);font-size:.85rem}
.seg button.on{border-color:var(--brand2);background:var(--chip)}
.c-task{margin-top:18px;padding:16px;border-radius:14px;background:var(--taskBg);color:var(--taskInk);border-left:6px solid var(--guide)}
.c-task h2{font-size:.95rem;margin:0 0 6px}
.scen{font-size:1.12rem;line-height:1.45;margin:0}
.c-btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.cbtn{border:2px solid currentColor;border-radius:10px;padding:8px 14px;font-weight:700;min-height:44px}
.c-select{display:none;width:100%;margin-top:10px;font:inherit;font-size:1rem;padding:10px;border-radius:10px;border:2px solid var(--rule);background:var(--panel);color:var(--text)}
.tlist{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:4px}
.tlist button{width:100%;text-align:left;display:grid;grid-template-columns:30px 1fr;column-gap:12px;align-items:center;padding:9px 10px;border-radius:12px;border:2px solid transparent;font-size:1rem;min-height:50px}
.tlist button:hover{background:var(--chip)}
.tlist button.cur{border-color:var(--brand2);background:var(--chip)}
.tlist .n{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--chip);border:1.5px solid var(--rule);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.tlist .n.fin{background:var(--ok);border-color:var(--ok);color:#fff}
.marks{font-size:.82rem;color:var(--sub)}
.c-foot{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:12px}
.lnk{color:var(--sub);text-decoration:underline;font-size:.92rem;padding:6px 0;min-height:36px}

@media (max-width:820px){
  .app{grid-template-columns:1fr;padding:0;gap:0}
  .coach{position:static;border-radius:0;padding:12px 14px 14px;max-height:none}
  .c-head p,.tlist,.seg small{display:none}
  .c-head h1{font-size:1.15rem;margin:0}
  .c-lbl{margin:10px 0 6px;font-size:.9rem}
  .seg button{padding:8px 10px;font-size:.98rem}
  .c-task{margin-top:10px;padding:10px 12px}
  .scen{font-size:1rem}
  .c-select{display:block}
  .c-foot{margin-top:10px;padding-top:6px}
  .phone{width:100%;height:86dvh;min-height:600px;max-height:none;border-radius:0;padding:0;box-shadow:none}
  .phone .screen{border-radius:0}
}

/* =========================================================
   THE PHONE SCREEN (app tokens are fixed: the app is always light)
   ========================================================= */
.screen{--a-bg:#F2F4F5;--a-ink:#1B2328;--a-muted:#66727A;--a-line:#E0E5E8;--a-dark:#24343C;
  position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--a-bg);color:var(--a-ink);
  font-size:15px;line-height:1.35;-webkit-tap-highlight-color:transparent}
.screen.big{font-size:17px}
.view{position:absolute;inset:0}
.ic{width:1.45em;height:1.45em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mark{width:1.25em;height:1.25em;flex:none}

/* status bar */
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 24px 0 32px;font-weight:700;font-size:14px;z-index:30;pointer-events:none;color:#111}
.sb.light{color:#fff}
.sb-r{display:flex;gap:6px;align-items:center}
.sb-r svg{height:12px;width:auto;fill:currentColor}

/* generic screen scaffolding */
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--a-bg)}
.hdr{background:#fff;padding-top:44px;border-bottom:1px solid var(--a-line);flex:none}
.hbar{height:50px;display:grid;grid-template-columns:52px 1fr 52px;align-items:center;padding:0 4px}
.ht{text-align:center;font-weight:700;font-size:1.05em}
.ib{width:44px;height:44px;display:inline-grid;place-items:center;border-radius:50%;position:relative;color:inherit}
.ib.light{color:#fff}
.badge{position:absolute;top:3px;left:23px;background:#D63A2F;color:#fff;font-size:.62em;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.kp-open .scroll{padding-bottom:290px}
.foot{flex:none;background:#fff;padding:12px 16px 26px;border-top:1px solid var(--a-line)}
.foot.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:1.02em;padding:0 12px}
.btn:disabled{background:#B7C3C6}
.btn.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
.btn .ic{width:1.1em;height:1.1em}

/* pre-login */
.pre{background:#0F1B1E;color:#fff}
.pre-hero{position:relative;flex:1;display:flex;flex-direction:column;padding-top:44px;overflow:hidden}
.hero-art{position:absolute;top:0;left:0;width:100%;height:64%}
.pre-hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,22,24,.05) 0%,rgba(10,22,24,.35) 38%,#0F1B1E 66%);z-index:1}
.pre-hero>*:not(.hero-art){position:relative;z-index:2}
.pre-top{display:flex;justify-content:space-between;padding:0 6px}
.scam{margin:4px 14px 0;background:rgba(14,26,29,.75);border:1px solid rgba(255,255,255,.2);border-radius:6px;padding:9px 11px;font-size:.78em;line-height:1.38}
.peek-btn{margin:auto auto 12px;display:flex;flex-direction:column;align-items:center;font-size:.74em;padding:8px 20px;border-radius:8px;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.peek-btn b{font-weight:400;font-size:1.12em;letter-spacing:.06em}
.pre-grid{display:grid;grid-template-columns:repeat(3,1fr);row-gap:10px;padding:4px 10px 16px}
.pt{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.74em;text-align:center;color:#fff;padding:8px 2px;border-radius:10px;min-height:72px}
.pt .ic{width:1.9em;height:1.9em;stroke-width:1.5}
.pt .lgi{width:28px;height:28px;border-radius:6px;background:var(--brand2);display:grid;place-items:center}
.pre-sheet{flex:none;background:var(--a-bg);border-radius:16px 16px 0 0;padding:8px 14px 20px;color:var(--a-ink)}
.handle{display:block;width:36px;height:4px;border-radius:2px;background:#C3CACE;margin:2px auto 10px}
.promo{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.08);display:block;width:100%;text-align:left}
.promo svg{display:block;width:100%;height:84px}
.promo-t{padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.promo-t small{color:var(--a-muted);font-size:.78em}

/* peek overlay */
.peek{position:absolute;inset:0;z-index:35;background:rgba(18,30,34,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;padding:52px 12px 0;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none}
.peek-card{width:100%;background:rgba(255,255,255,.95);border-radius:14px;overflow:hidden;color:var(--a-ink)}
.pk-h{text-align:center;padding:14px 14px 10px;display:flex;flex-direction:column;gap:2px}
.pk-h b{font-size:1.5em}
.pk-h span{font-size:.75em;color:var(--a-muted)}
.pk-sec{background:#E7EBED;font-size:.7em;color:var(--a-muted);padding:6px 14px;letter-spacing:.03em}
.pk-row{display:grid;grid-template-columns:1fr auto;padding:9px 14px;border-top:1px solid var(--a-line);font-size:.85em;gap:2px 10px}
.pk-row small{color:var(--a-muted);font-size:.85em}
.peek-hint{margin-top:16px;text-align:center;font-size:.74em}

/* login */
.login{background:#3A4247;color:#fff}
.lg-top{background:var(--brand);padding-top:44px;height:104px;display:grid;grid-template-columns:52px 1fr 52px;align-items:start;flex:none}
.lg-top .ib{margin-top:2px}
.wm{display:inline-flex;align-items:center;gap:6px;font-weight:700;justify-self:center;margin-top:12px;letter-spacing:-.01em}
.lg-body{display:flex;flex-direction:column;align-items:center;padding:0 22px;margin-top:-30px}
.avatar{width:60px;height:60px;border-radius:50%;background:#fff;color:var(--brand);display:grid;place-items:center;border:3px solid #3A4247}
.avatar .ic{width:34px;height:34px}
.lg-name{margin-top:8px;font-weight:700;font-size:.9em;letter-spacing:.02em;text-align:center}
.lg-not{font-size:.76em;text-decoration:underline;color:#D3DADD;padding:6px}
.pin-field{margin-top:14px;width:100%;height:48px;background:#fff;border-radius:4px;color:var(--a-ink);text-align:left;padding:0 12px;display:flex;align-items:center;gap:12px;border:2px solid transparent}
.pin-field.focus{border-color:#79C6CF}
.dot{width:12px;height:12px;border-radius:50%;background:#111}
.ph{color:#97A1A7;font-weight:400}
.lg-err{align-self:stretch;margin-top:8px;background:#FCE8E6;color:var(--err);padding:8px 10px;border-radius:6px;font-size:.85em}
.lg-forgot{align-self:flex-start;font-size:.8em;margin:8px 0 18px;color:#E3E9EB;padding:4px 0}
.face{margin-top:22px;border:1px solid rgba(255,255,255,.35);border-radius:10px;width:48px;height:48px}

/* face id */
.faceid{background:#fff;align-items:center;justify-content:center;gap:16px}
.fid{width:112px;height:112px;border-radius:26px;background:#111;display:grid;place-items:center;color:#4CD964}
.fid .ic{width:64px;height:64px;stroke-width:1.4}
.fid.scan .ic{animation:fid .8s ease-in-out infinite alternate}
@keyframes fid{to{transform:scale(.88);opacity:.6}}
.faceid p{margin:0;color:var(--a-muted)}

/* home */
.hm-hdr{background:linear-gradient(160deg,var(--brand2),var(--brand) 55%,var(--brandInk));color:#fff;padding:44px 8px 44px;flex:none}
.hm-row{display:flex;align-items:center}
.sp{flex:1}
.pill{border:1.5px solid rgba(255,255,255,.85);border-radius:20px;padding:4px 12px;font-size:.72em;font-weight:700;color:#fff;margin-right:6px;min-height:32px}
.hm-hi{margin:6px 14px 0;font-size:1.22em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hm-body{margin-top:-28px;position:relative;padding:0 12px 16px;border-radius:18px 18px 0 0}
.tiles{background:#fff;border-radius:14px;display:grid;grid-template-columns:repeat(3,1fr);padding:10px 4px;row-gap:4px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 2px;font-size:.8em;text-align:center;border-radius:10px;min-height:86px}
.ti{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;flex:none}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin:14px 2px 4px}
.acct{width:100%;background:#fff;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:flex-start;text-align:left;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.06);min-height:88px}
.acct-r{display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:4px}
.acct-r span{font-size:.78em;color:var(--a-muted)}
.acct-r b{font-size:1.12em}
.cnt{display:inline-grid;place-items:center;background:#E5EAEC;font-size:.7em;border-radius:9px;min-width:18px;height:18px;margin-left:6px;vertical-align:2px}
.bnav{flex:none;display:grid;grid-template-columns:1fr 1fr;background:#1D2A30;color:#A9B5BA;padding:6px 0 24px}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.74em;padding:6px;min-height:48px}
.bnav .on{color:#fff}

/* lists, tabs, cards */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--a-line);flex:none;overflow-x:auto}
.tabs button{flex:1;padding:13px 10px;font-size:.92em;color:var(--a-muted);border-bottom:3px solid transparent;white-space:nowrap;min-height:46px}
.tabs button.on{color:var(--a-ink);font-weight:700;border-color:var(--brand)}
.tabs.dark{background:transparent;border-color:rgba(255,255,255,.15)}
.tabs.dark button{color:#C3CCD0}
.tabs.dark button.on{color:#fff;border-color:#fff}
.note{display:flex;gap:10px;align-items:flex-start;margin:12px;background:#fff;border:1px solid var(--a-line);border-left:4px solid var(--brand2);padding:10px;border-radius:6px;font-size:.84em}
.note .ic{color:var(--brand2);width:1.3em;height:1.3em}
.list-h{padding:16px 16px 6px;font-size:.84em;color:var(--a-muted)}
.list{background:#fff;border-top:1px solid var(--a-line);border-bottom:1px solid var(--a-line)}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--a-line);min-height:54px}
.row:last-child{border-bottom:0}
.row .rt{flex:1;display:flex;flex-direction:column;min-width:0}
.row small{color:var(--a-muted);font-size:.8em}
.row>.ic:first-child{color:var(--a-muted)}
.cv{color:#9AA4AA;width:1.15em!important}
.row:disabled{opacity:.42}
.av{width:36px;height:36px;border-radius:50%;background:#D7EEE5;color:#1C664B;display:grid;place-items:center;font-weight:700;font-size:.78em;flex:none}
.card{background:#fff;margin:12px;border-radius:10px;padding:14px;border:1px solid var(--a-line)}
.card p{margin:0;font-size:.9em;line-height:1.45}
.card-h{font-weight:700;margin-bottom:6px}
.lbl{display:block;font-size:.8em;color:var(--a-muted);margin:12px 0 5px}
.sel{display:flex;justify-content:space-between;align-items:center;gap:6px;border:1px solid #C7CFD3;border-radius:6px;padding:8px 12px;min-height:44px;background:#fff;width:100%;text-align:left}
.sel .ic{width:1.1em;color:var(--a-muted)}
.mob-row{display:flex;gap:8px}
.cc{display:flex;align-items:center;gap:2px;border:1px solid #C7CFD3;border-radius:6px;padding:0 6px 0 10px;font-size:.92em}
.cc .ic{width:1em}
.field{flex:1;text-align:left;border:1px solid #C7CFD3;border-radius:6px;padding:0 12px;min-height:46px;font-size:1.05em;letter-spacing:.04em;background:#fff}
.field.focus,.amt.focus{border-color:#7FD0D9;box-shadow:0 0 0 3px rgba(20,128,143,.25)}
.box{border:1px solid #C7CFD3;border-radius:6px;width:46px;height:46px}
.ver{color:var(--ok);display:flex;align-items:center;gap:6px;font-size:.85em;margin-top:8px}
.ver .ic{background:var(--ok);color:#fff;border-radius:50%;width:1.15em;height:1.15em;padding:2px;stroke-width:3}
.pn-name{font-weight:700;letter-spacing:.03em}
.ferr{color:var(--err);font-size:.85em;margin-top:8px}
.err-box{margin:0 12px 8px;background:#FCE8E6;color:var(--err);padding:9px 12px;border-radius:6px;font-size:.86em}
.party{display:flex;align-items:center;gap:12px;background:#fff;padding:12px 16px;border-bottom:1px solid var(--a-line)}
.party .rt{flex:1;display:flex;flex-direction:column;min-width:0}
.party small{color:var(--a-muted);font-size:.8em}
.flag{width:32px;height:32px;border-radius:7px;background:var(--brand);color:#fff;display:grid;place-items:center;flex:none}
.flag.sm{width:26px;height:26px;border-radius:6px}
.rb{font-size:.8em;color:var(--a-muted);text-align:right}
.tag{font-size:.62em;font-weight:700;border:1px solid #8E6BD1;color:#6A45B3;border-radius:4px;padding:2px 5px;letter-spacing:.04em}
.send{background:var(--a-dark);color:#fff;margin:12px;border-radius:8px;padding:14px;display:grid;grid-template-columns:1fr auto;align-items:center;row-gap:12px}
.send-l{display:flex;flex-direction:column;font-size:.85em}
.send-l b{font-size:1.3em}
.amt{min-width:128px;text-align:right;font-size:1.7em;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.45);border-radius:6px;padding:4px 10px;min-height:50px}
.amt.static{border-color:transparent}
.amt .ph{color:rgba(255,255,255,.4)}
.send-f{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;font-size:.78em;color:#C7D1D6;border-top:1px solid rgba(255,255,255,.15);padding-top:10px}
.send-f b{color:#fff;font-size:1.1em}
.send-f button{color:#fff;text-decoration:underline;padding:4px 0}
.inp{width:100%;border:1px solid #C7CFD3;border-radius:6px;padding:10px 12px;font:inherit;min-height:46px;color:var(--a-ink)}
.cnt-r{text-align:right;font-size:.75em;color:var(--a-muted);margin-top:4px}
.rv-h{font-size:1.15em;margin:16px 16px 0}
.dl{margin:0}
.dl dt{font-size:.8em;color:var(--a-muted);margin-top:12px}
.dl dd{margin:2px 0 0;font-weight:700;display:flex;flex-direction:column}
.dl dd small{font-weight:400;color:var(--a-muted)}
.terms{font-size:.8em;color:var(--a-muted);margin:4px 16px 16px}
.ok-wrap{display:flex;flex-direction:column;align-items:center;padding:22px 0 4px}
.ok-circle{width:62px;height:62px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.ok-circle .ic{width:34px;height:34px;stroke-width:3}
.ok-wrap h2{margin:10px 0 2px;font-size:1.2em}
.ok-wrap span{font-size:.82em;color:var(--a-muted)}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* account history */
.acc-sum{background:#fff;padding:16px;display:flex;flex-direction:column;gap:2px;border-bottom:1px solid var(--a-line)}
.acc-sum span{font-size:.82em;color:var(--a-muted)}
.acc-sum b{font-size:1.6em}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px}
.card .chips{margin:4px 0 0}
.chip{border:1.5px solid #C7CFD3;border-radius:20px;padding:8px 16px;background:#fff;min-height:44px;font-weight:700}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp-h{padding:16px 16px 6px;font-size:.78em;color:var(--a-muted);letter-spacing:.03em}
.tx{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--a-line)}
.tx small{color:var(--a-muted);font-size:.78em}
.tx b{text-align:right}
.cr{color:var(--ok)}
.empty{padding:30px 22px;text-align:center;color:var(--a-muted)}
.hint{margin:4px 16px 12px;font-size:.86em;color:var(--a-muted);line-height:1.45}

/* scan & pay */
.scan{background:#11171A;color:#fff}
.hdr.dark{background:#11171A;border-color:transparent;color:#fff}
.cam{position:relative;flex:1;overflow:hidden}
.scene{position:absolute;inset:0}
.scene svg{width:100%;height:100%;display:block}
.stall{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-4deg);background:#fff;color:#1B1B1B;border-radius:10px;padding:8px 10px 8px;width:146px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 14px 30px rgba(0,0,0,.55);border-top:18px solid #2E7D5B}
.st-name{font-weight:700;font-size:.78em;letter-spacing:.04em}
.st-qr{width:112px}
.qr{display:block;width:100%;height:auto}
.st-cap{font-size:.58em;font-weight:700;letter-spacing:.1em}
.frame{position:absolute;left:50%;top:42%;width:214px;height:214px;transform:translate(-50%,-50%);pointer-events:none;
  background:
   linear-gradient(#fff,#fff) top left/30px 4px no-repeat, linear-gradient(#fff,#fff) top left/4px 30px no-repeat,
   linear-gradient(#fff,#fff) top right/30px 4px no-repeat, linear-gradient(#fff,#fff) top right/4px 30px no-repeat,
   linear-gradient(#fff,#fff) bottom left/30px 4px no-repeat, linear-gradient(#fff,#fff) bottom left/4px 30px no-repeat,
   linear-gradient(#fff,#fff) bottom right/30px 4px no-repeat, linear-gradient(#fff,#fff) bottom right/4px 30px no-repeat}
.frame.scanning::after{content:"";position:absolute;left:10px;right:10px;height:3px;background:#5EE6A8;box-shadow:0 0 12px #5EE6A8;top:8%;animation:scanline .9s linear forwards}
@keyframes scanline{to{top:90%}}
.cam-txt{position:absolute;left:0;right:0;bottom:0;padding:40px 22px 30px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.78) 35%)}
.cam-txt b{display:block;font-size:1.15em}
.cam-txt span{display:block;font-size:.8em;color:#D1D9DC;margin:4px 0 14px}
.pill.outline{border-color:#fff;margin:0;padding:6px 16px;min-height:38px}

/* dialogs & sheets */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:45;display:grid;place-items:center;padding:26px}
.dlg{background:#F2F2F5;border-radius:14px;width:100%;max-width:280px;text-align:center;color:#111;overflow:hidden}
.dlg-b{padding:18px 16px 14px}
.dlg h3{margin:0 0 6px;font-size:1em}
.dlg p{margin:0;font-size:.82em;color:#444;line-height:1.4}
.dlg-btn{display:block;width:100%;padding:12px;border-top:1px solid #D3D3D8;color:#0A66D6;font-size:1em;min-height:46px}
.dlg-btn.strong{font-weight:700}
.dlg.dlgapp{background:#fff;max-width:300px;text-align:left}
.dlg.dlgapp .dlg-b{padding:20px 18px 6px}
.dlg.dlgapp .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 18px 18px}
.sheet{position:absolute;inset:0;z-index:44;background:rgba(0,0,0,.4);display:flex;flex-direction:column;justify-content:flex-end}
.sheet-in{background:#fff;border-radius:16px 16px 0 0;max-height:82%;display:flex;flex-direction:column;color:var(--a-ink)}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:700;border-bottom:1px solid var(--a-line)}
.sheet-h button{color:#0A66D6;font-weight:400;min-height:40px;padding:0 4px}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;overflow:auto;padding-bottom:20px}
.th{aspect-ratio:1;display:block;width:100%;overflow:hidden;position:relative;background:#ddd}
.th svg{width:100%;height:100%;display:block}
.th-qr{background:#fff;padding:14%}
.th.picked{outline:4px solid #0A66D6;outline-offset:-4px}
.lib-note{background:#E4572E;color:#fff;text-align:center;font-size:.84em;font-weight:700;padding:8px 12px}

/* wallet */
.w-card{margin:12px;border-radius:14px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--brand2),var(--brandInk));display:flex;flex-direction:column;gap:3px}
.w-card span{font-size:.85em;opacity:.88}
.w-card b{font-size:1.9em}
.w-card small{opacity:.88;font-size:.8em;margin-top:6px;line-height:1.5}
.w-acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 12px}
.w-act{background:#fff;border-radius:12px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.82em;border:1px solid var(--a-line);min-height:88px;text-align:center}
.sw-row{display:flex;gap:12px;align-items:center}
.sw-row>span{flex:1;display:flex;flex-direction:column;gap:2px}
.sw-row small{color:var(--a-muted);font-size:.8em}
.sw{width:56px;height:34px;border-radius:17px;background:#C2C9CD;position:relative;flex:none;transition:background .2s}
.sw span{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw.on{background:var(--ok)}
.sw.on span{transform:translateX(22px)}
.rd{width:24px;height:24px;border-radius:50%;border:2px solid #A6B0B5;flex:none}
.rd.on{border:7px solid var(--brand)}

/* eDocuments */
.filters{display:flex;gap:10px;padding:12px 12px 0}
.doc-row{display:flex;align-items:center;background:#fff;border-top:1px solid var(--a-line);border-bottom:1px solid var(--a-line)}
.doc-main{flex:1;display:flex;gap:12px;align-items:center;padding:12px 16px;text-align:left;min-height:58px}
.doc-main .rt{display:flex;flex-direction:column}
.doc-main small{color:var(--a-muted);font-size:.8em}
.doc-ic{width:38px;height:38px;border-radius:8px;background:#EDF0F1;display:grid;place-items:center;color:var(--a-muted);flex:none}
.paper{background:#fff;margin:12px;padding:18px 16px;border-radius:3px;box-shadow:0 2px 12px rgba(0,0,0,.14);font-size:.76em;line-height:1.45}
.pp-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;color:var(--brand)}
.pp-top span{text-align:right;color:var(--a-ink)}
.pp-addr{margin:14px 0;color:#333}
.pp-sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#F2F5F6;padding:10px;border-radius:4px}
.pp-sum span{display:block;color:var(--a-muted)}
.pp-t{width:100%;border-collapse:collapse;margin-top:12px}
.pp-t th,.pp-t td{text-align:left;padding:5px 3px;border-bottom:1px solid #EEE;vertical-align:top}
.pp-t th:last-child,.pp-t td:last-child{text-align:right;white-space:nowrap}
.pp-fine{color:var(--a-muted);margin:12px 0 0}

/* keypad */
.kp{position:absolute;left:0;right:0;bottom:0;background:#D0D4DA;z-index:40;padding-bottom:20px}
.kp-bar{display:flex;justify-content:flex-end;background:#EFF0F2;padding:4px 10px;border-top:1px solid #C5C9CF}
.kp-done{color:#0A66D6;font-weight:700;font-size:1.05em;padding:8px 12px;min-height:44px}
.kp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 7px}
.key{height:52px;background:#fff;border-radius:7px;font-size:1.55em;box-shadow:0 1px 0 #898E95;color:#111;display:grid;place-items:center}
.key:active{background:#BFC4CB}
.key.blank{background:transparent;box-shadow:none}

/* feedback: toast, notification banner, completion */
.toast{position:absolute;left:16px;right:16px;bottom:104px;z-index:70;background:#1F2A30;color:#fff;padding:12px 14px;border-radius:10px;font-size:.92em;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.banner{position:absolute;left:10px;right:10px;top:8px;z-index:72;background:rgba(246,247,248,.98);color:#111;border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;font-size:.8em;line-height:1.35;box-shadow:0 8px 24px rgba(0,0,0,.28);transform:translateY(-140%);transition:transform .35s;pointer-events:none}
.banner.show{transform:none}
.banner small{color:#777}
.done{position:absolute;inset:0;z-index:66;background:rgba(8,30,35,.6);display:grid;place-items:center;padding:20px}
.done-card{background:#fff;border-radius:18px;padding:22px 18px 14px;text-align:center;width:100%}
.done-card .ok-circle{margin:0 auto}
.done-card h2{margin:12px 0 4px;font-size:1.35em}
.done-card p{margin:0 0 6px}
.done-card .sub{color:var(--a-muted);font-size:.9em;margin-bottom:8px}
.done-card .btn{margin-top:8px}
.lnk2{margin-top:10px;color:var(--a-muted);text-decoration:underline;min-height:40px;padding:4px 8px}

/* guide (the one bold element) */
.ring{position:absolute;z-index:60;border:3px solid var(--guide);border-radius:14px;pointer-events:none;box-shadow:0 0 0 4px rgba(242,169,0,.3);animation:pulse 1.6s ease-in-out infinite;transition:left .25s,top .25s,width .25s,height .25s}
@keyframes pulse{50%{box-shadow:0 0 0 11px rgba(242,169,0,0)}}
.bubble{position:absolute;z-index:61;left:14px;right:14px;background:var(--guide);color:var(--guideInk);font-weight:700;font-size:1.04em;line-height:1.38;padding:12px 14px;border-radius:14px;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.28)}
.bubble::after{content:"";position:absolute;left:var(--ax,50%);width:14px;height:14px;background:var(--guide);transform:translateX(-50%) rotate(45deg)}
.bubble.below::after{top:-6px}
.bubble.above::after{bottom:-6px}
.bubble.free::after{display:none}
@media (prefers-reduced-motion:reduce){
  .ring,.fid.scan .ic,.ok-circle,.frame.scanning::after{animation:none}
  .ring,.toast,.banner,.sw,.sw span{transition:none}
}
</style>

/* deterministic fake QR code */
const qrCache = {};
function qr(seed){
  if (qrCache[seed]) return qrCache[seed];
  const n = 25; let a = seed * 7919 % 233280;
  const rnd = () => (a = (a * 9301 + 49297) % 233280) / 233280;
  const inFinder = (x,y) => (x < 8 && y < 8) || (x > n-9 && y < 8) || (x < 8 && y > n-9);
  let cells = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (!inFinder(x,y) && rnd() < .47) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  const f = (x,y) => `<rect x="${x}" y="${y}" width="7" height="7"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3"/>`;
  return qrCache[seed] = `<svg class="qr" viewBox="-1 -1 ${n+2} ${n+2}" shape-rendering="crispEdges" aria-hidden="true"><rect x="-1" y="-1" width="${n+2}" height="${n+2}" fill="#fff"/><g fill="#111">${cells}${f(0,0)}${f(n-7,0)}${f(0,n-7)}</g></svg>`;
}

function stmtRows(key){
  let a = [...key].reduce((x,c) => (x * 31 + c.charCodeAt(0)) % 233280, 7);
  const rnd = () => (a = (a * 9301 + 49297) % 233280) / 233280;
  const [y,m] = key.split('-').map(Number), last = new Date(y, m, 0).getDate();
  return [['Mobile phone bill (GIRO)',-28,5],['Supermarket',-(15+rnd()*30),3],['Pension credit',1200,7],['Cash withdrawal at ATM',-100,9],
    ['Town council fees',-75.5,12],['Kopitiam',-(4+rnd()*6),14],['Electricity and water (GIRO)',-(80+rnd()*40),20],
    ['Transfer from TAN MEI LING',200,26],['Interest credit',0.4+rnd()*0.1,last]]
    .map(([d,amt,day]) => ({ d, amt:r2(amt), day })).sort((p,q) => p.day - q.day);
}

/* =========================================================
   6. NAVIGATION + ACTIONS
   ========================================================= */
function clearTransient(){ s.keypad = null; s.sheet = null; s.dialog = null; s.photoLib = false; s.pick = null; }
function enter(scr){                         // runs when a screen is opened going forward
  if (scr === 'login') { s.pin = ''; s.pinError = ''; }
  if (scr === 'paynow') s.pnTab = 'transfer';
  if (scr === 'pn_mobile') s.pn = { mobile:'', name:'', err:'', amount:'', ref:'PayNow transfer' };
  if (scr === 'topup') s.topup = { amount:'' };
  if (scr === 'auto') s.autoDraft = { ...s.auto };
  if (scr === 'limit') s.limitDraft = s.walletLimit;
  if (scr === 'account') s.histFilter = '30';
  if (scr === 'edocs') s.docsTab = 'stmt';
}
function go(scr){ s.stack.push(s.screen); s.screen = scr; clearTransient(); enter(scr); render(); }
function back(){ clearTransient(); s.screen = s.stack.pop() || (s.loggedIn ? 'home' : 'prelogin'); render(); }
function goHome(){ clearTransient(); s.stack = []; s.screen = s.loggedIn ? 'home' : 'prelogin'; render(); }

function loginOK(){
  s.loggedIn = true; s.pin = ''; s.pinError = ''; s.wrong = 0; clearTransient();
  s.stack = []; s.screen = 'home'; render(); complete('login');
}
function verifyMobile(){
  const m = s.pn.mobile; s.pn.name = ''; s.pn.err = '';
  if (m.length < 8) return;
  if (!/^[89]/.test(m)) { s.pn.err = 'This is not a Singapore mobile number. It should start with 8 or 9.'; return; }
  const f = FAMILY.find(x => x.mobile === m);
  s.pn.name = f ? f.name : STRANGERS[[...m].reduce((a,c) => a + +c, 0) % STRANGERS.length];
}
const FIELDS = { pin:['pin'], mobile:['pn','mobile'], amount:['pn','amount'], scanAmt:['scan','amount'], topup:['topup','amount'] };
const getF = f => { const p = FIELDS[f]; return (p.length === 1 ? s[p[0]] : s[p[0]][p[1]]) || ''; };
const setF = (f,v) => { const p = FIELDS[f]; if (p.length === 1) s[p[0]] = v; else s[p[0]][p[1]] = v; };

const A = {
  na(){ toast('This button is not part of the practice yet. Try another one.'); },
  needLogin(){ toast('Please log in first.'); go('login'); },
  go(scr){ go(scr); },
  back(){ back(); },
  home(){ goHome(); },
  tab(t){ clearTransient(); s.stack = []; s.screen = t; render(); },

  /* keypad */
  openKp(f){ s.keypad = { field:f }; render(); },
  kpDone(){ s.keypad = null; render(); },
  key(k){
    const f = s.keypad.field; let v = getF(f);
    if (k === 'del') v = v.slice(0, -1);
    else if (k === '.') { if (!v.includes('.')) v = (v || '0') + '.'; }
    else {
      if (f === 'pin') { if (v.length >= 6) return; s.pinError = ''; }
      else if (f === 'mobile') { if (v.length >= 8) return; }
      else { const [i, d] = v.split('.'); if (d !== undefined ? d.length >= 2 : i.length >= 6) return; if (v === '0') v = ''; }
      v += k;
    }
    setF(f, v);
    if (f === 'mobile') verifyMobile();
    render();
  },

  /* login */
  login(){
    s.keypad = null;
    if (s.pin.length < 6) s.pinError = 'Please type your 6-digit PIN.';
    else if (s.pin !== PIN) {
      s.wrong++; s.pin = '';
      s.pinError = s.wrong >= 2 ? 'Wrong PIN again. In a real banking app, your access may be locked after a few wrong tries.' : 'The PIN is wrong. Please try again.';
    } else return loginOK();
    render();
  },
  faceid(){
    go('faceid'); s.fid = 'scan'; render();
    setTimeout(() => { if (s.screen !== 'faceid') return; s.fid = 'ok'; render();
      setTimeout(() => { if (s.screen === 'faceid') loginOK(); }, 700); }, 1500);
  },
  logout(){ s.loggedIn = false; clearTransient(); s.stack = []; s.screen = 'prelogin'; render(); toast('You have logged out.'); },
  toggleHide(){ s.hideBal = !s.hideBal; render(); },
  hf(f){ s.histFilter = f; render(); if (f === 'today') complete('history'); },

  /* PayNow */
  pnTab(t){ s.pnTab = t; render(); },
  pickFam(i){ const f = FAMILY[i]; s.pn = { mobile:f.mobile, name:f.name, err:'', amount:'', ref:'PayNow transfer' }; go('pn_amount'); },
  contacts(){ s.keypad = null; s.sheet = 'contacts'; render(); },
  sheetClose(){ s.sheet = null; render(); },
  ctPick(i){ s.pn.mobile = FAMILY[i].mobile; verifyMobile(); s.sheet = null; render(); },
  toReview(kind){
    const P = {
      paynow:{ title:'PayNow Transfer', toName:mask(s.pn.name), toSub:'Mobile +65 ' + spaced(s.pn.mobile), amount:r2(+s.pn.amount), comment:s.pn.ref, cta:'Transfer now', verb:'transferring', again:'Send again' },
      scan:{ title:'Scan &amp; Pay', toName:s.scan.merchant && s.scan.merchant.name, toSub:s.scan.merchant && s.scan.merchant.sub, amount:r2(+s.scan.amount), comment:s.scan.ref, cta:'Pay now', verb:'paying', again:'Scan again' },
      topup:{ title:'Top up PayLah!', toName:'PayLah!', toSub:'Your PayLah! wallet', amount:r2(+s.topup.amount), comment:'', cta:'Top up now', verb:'topping up', again:'Top up again' }
    };
    s.pending = { kind, ...P[kind] }; go('review');
  },
  commit(){
    const p = s.pending, now = new Date(), amt = p.amount;
    if (p.kind === 'topup') {
      s.balance = r2(s.balance - amt); s.wallet = r2(s.wallet + amt);
      s.txns.unshift({ date:now.toISOString(), desc:'Top-up to PayLah!', amt:-amt });
      s.wtx.unshift({ date:now.toISOString(), desc:'Top-up from My Account', amt });
    } else {
      s.balance = r2(s.balance - amt); s.dailyLeft = r2(s.dailyLeft - amt);
      s.txns.unshift({ date:now.toISOString(), desc:(p.kind === 'scan' ? 'QR payment to ' : 'PayNow to ') + p.toName, amt:-amt });
    }
    p.time = now; p.ref = 'PB' + now.getTime().toString().slice(-10);
    clearTransient(); s.stack = []; s.screen = 'success'; render();
    setTimeout(() => banner(p.kind === 'topup' ? `Top-up successful: SGD ${fmt(amt)} added to your PayLah!.` :
      `Successful ${p.kind === 'scan' ? 'QR payment' : 'PayNow'}: SGD ${fmt(amt)} to ${p.toName}.`), 450);
    complete(p.kind);
  },
  again(){
    const k = s.pending.kind; s.stack = ['home'];
    if (k === 'paynow') { s.screen = 'paynow'; enter('paynow'); render(); }
    else if (k === 'scan') { s.screen = 'scan'; render(); }
    else { s.stack = ['home','wallet']; s.screen = 'topup'; enter('topup'); render(); }
  },

  /* Scan & Pay */
  scanCam(){
    if (s.scanning) return;
    s.scanning = true; render();
    setTimeout(() => { s.scanning = false; if (s.screen === 'scan') foundMerchant(); }, 950);
  },
  /* v2 order, as in the real app: open picker -> choose a photo -> access pop-up -> result */
  photoLib(){ s.photoLib = true; s.pick = null; render(); },
  libClose(){ s.photoLib = false; s.pick = null; render(); },
  libPick(i){
    s.pick = +i;
    if (!s.photoPerm) { s.dialog = 'perm'; render(); }   // first time: ask for photo access
    else usePick();
  },
  permOk(){ s.photoPerm = true; s.dialog = null; usePick(); },          // Keep Current Selection
  permMore(){ s.photoPerm = true; s.dialog = null; s.pick = null; render(); }, // Select More Photos: back to picker
  errOk(){ s.dialog = null; s.pick = null; render(); },

  /* Wallet */
  topChip(v){ s.topup.amount = String(v); s.keypad = null; render(); },
  autoToggle(){ s.autoDraft.on = !s.autoDraft.on; render(); },
  autoSet(arg){ const [k, v] = arg.split(':'); s.autoDraft[k] = +v; render(); },
  autoSave(){
    s.auto = { ...s.autoDraft }; back();
    toast(s.auto.on ? 'Auto top-up is now on.' : 'Auto top-up is now off.');
    if (s.auto.on) complete('auto');
  },
  limPick(v){ s.limitDraft = +v; render(); },
  limSave(){ s.dialog = 'limconfirm'; render(); },
  dlgCancel(){ s.dialog = null; render(); },
  limConfirm(){ s.walletLimit = s.limitDraft; back(); toast(`Wallet limit changed to SGD ${fmt0(s.walletLimit)}.`); complete('limit'); },

  /* eDocuments */
  docTab(t){ s.docsTab = t; render(); },
  docYear(){ const y = new Date().getFullYear(); s.docYear = s.docYear === y ? y - 1 : y; render(); },
  openDoc(k){ s.doc = k; go('docview'); complete('estmt'); },
  dlDoc(){ toast('Statement saved to your phone. (Practice only: no file is saved.)'); },

  /* completion card */
  doneDo(){ s.guideOn = false; savePrefs(); startTask(s.task); },
  doneNext(){ const i = TASKS.findIndex(t => t.id === s.task); startTask(TASKS[i + 1].id); },
  doneAgain(){ startTask(s.task); },
  doneClose(){ s.showDone = false; render(); }
};
function usePick(){
  if (THUMBS[s.pick] && THUMBS[s.pick].qr) { s.photoLib = false; s.pick = null; foundMerchant(); }
  else { s.dialog = 'qrerr'; render(); }
}
function foundMerchant(){ s.scan = { merchant:MERCHANT, amount:'', ref:'' }; go('scan_pay'); }

/* =========================================================
   7. TASKS + PROGRESS
   ========================================================= */
function complete(id){
  if (s.task !== id || s.completed) return;
  s.completed = true;
  const p = progress[id] || {};
  if (s.guideOn) p.learn = true; else p.do = true;
  progress[id] = p; store.set('progress', progress);
  const mine = s;                                   // ignore if the user restarts meanwhile
  setTimeout(() => { if (s === mine) { s.showDone = true; render(); } }, 1400);
  render();
}
function startTask(id){ s = fresh({ task:id, guideOn:s.guideOn, big:s.big }); lastScreen = null; render(); }
function savePrefs(){ store.set('prefs', { guideOn:s.guideOn, big:s.big }); }

/* =========================================================
   8. THE GUIDE: what to point at, and what to say, for the current screen
   Every guide is screen-based, so it recovers if the learner wanders off.
   ========================================================= */
function amtGuide(val, target){
  const ok = parseFloat(val || 0) === parseFloat(target);
  if (s.keypad) return ok ? { sel:'kp-done', text:'Good. Tap “Done” to close the keypad.' }
                          : { sel:'keypad', text:`Type ${target.split('').join(' ')}. Tap ⌫ to delete a mistake.` };
  if (!ok) return { sel:'amt-field', text: val ? `The amount should be S$${target}. Tap the amount to change it.` : `Tap the amount box to type S$${target}.` };
  return null;
}
function wrongPlace(){
  if (s.sheet) return { sel:'sheet-close', text:'Close this list first. Tap “Cancel”.' };
  if (s.keypad) return { sel:'kp-done', text:'Tap “Done” to close the keypad.' };
  if (s.screen === 'more') return { sel:'nav-home', text:'Tap “Home” at the bottom to go back.' };
  if (viewEl.querySelector('[data-g="back"]')) return { sel:'back', text:'This page is not part of this task. Tap the back arrow to go back.' };
  if (viewEl.querySelector('[data-g="close"]')) return { sel:'close', text:'This page is not part of this task. Tap X to close it.' };
  return null;
}
function gLogin(){
  if (s.screen === 'prelogin') return { sel:'login-btn', text:'Tap “Log in”.' };
  if (s.screen === 'faceid') return { text:'The phone is checking your face. Please wait.' };
  if (s.screen === 'login') {
    if (s.keypad) return s.pin.length < 6
      ? { sel:'keypad', text:`Type your PIN: 1 2 3 4 5 6. You have typed ${s.pin.length} of 6 numbers.` }
      : { sel:'kp-done', text:'Good. Tap “Done” to close the keypad.' };
    if (s.pin.length < 6) return { sel:'pin-field', text: s.pinError ? 'Tap the PIN box and type 1 2 3 4 5 6 again.' : 'Tap the white PIN box. Your practice PIN is 123456.' };
    return { sel:'login-submit', text:'Tap “LOGIN”.' };
  }
  return null;
}
const GUIDES = {
  peek(){
    if (s.peek) return { text:'This shows your balance and latest spending. Lift your finger to close it.', pos:'bottom' };
    if (s.screen === 'prelogin') return { sel:'peek', text:'Press and hold your finger on “Peek balance”. Keep your finger down.' };
    if (s.screen === 'home') return { sel:'logout', text:'Peek works before you log in. Tap “Log out” first.' };
    if (s.screen === 'login') return { sel:'close', text:'You do not need to log in for this. Tap X to close.' };
    return null;
  },
  history(){
    if (s.screen === 'home') return { sel:'acct-dep', text:'Tap “Deposits” to see your bank account.' };
    if (s.screen === 'account' && s.histFilter !== 'today') return { sel:'f-today', text:'Tap “Today” to see only today’s spending.' };
    return null;
  },
  scan(){
    const sc = s.screen;
    if (sc === 'home') return { sel:'tile-scan', text:'Tap “Scan & Pay”.' };
    if (sc === 'scan') {
      if (s.dialog === 'perm') return { sel:'perm-keep', place:'below', text:'The phone asks if the app may use the photo you chose. Tap “Keep Current Selection”.' };
      if (s.dialog === 'qrerr') return { sel:'err-ok', place:'below', text:'That photo is not a QR code. Tap “OK”, then choose the QR code photo.' };
      if (s.photoLib) return { sel:'lib-qr', place:'below', text:'Tap the photo of the QR code.' };
      if (s.scanning) return { text:'Hold your phone still. Scanning…' };
      return { sel:'cam-qr', text:'Point the camera at the shop’s QR code. In this practice, tap the QR code in the picture.' };
    }
    if (sc === 'scan_pay') return amtGuide(s.scan.amount, '4.60') || { sel:'next', text:'Check that the shop is Ah Huat Kopi. Then tap “Next”.' };
    if (sc === 'review') return { sel:'confirm', text:'Check the shop name and the amount, S$4.60. If both are right, tap “Pay now”.' };
    return null;
  },
  paynow(){
    const sc = s.screen, p = s.pn, ML = FAMILY[0];
    if (sc === 'home') return { sel:'tile-paynow', text:'Tap “PayNow”.' };
    if (sc === 'paynow') return s.pnTab === 'recip' ? { sel:'fam-0', text:'Tap Mei Ling to pay her.' } : { sel:'pn-mobile', text:'Tap “PayNow to mobile”.' };
    if (sc === 'pn_mobile') {
      if (s.sheet === 'contacts') return { sel:'ct-0', text:'Tap Mei Ling.' };
      if (s.keypad) {
        if (p.mobile === ML.mobile) return { sel:'kp-done', text:'Tap “Done”.' };
        if (!ML.mobile.startsWith(p.mobile)) return { sel:'keypad', text:'That number is not right. Tap ⌫ to delete, then type 9 1 2 3 4 5 6 7.' };
        return { sel:'keypad', text:'Type Mei Ling’s number: 9 1 2 3 4 5 6 7.' };
      }
      if (p.name && p.mobile !== ML.mobile) return { sel:'pn-name', place:'below', text:'This name is not Mei Ling. Always check the name before paying! Tap the number box and fix the number.' };
      if (!p.name) return { sel:'mobile-field', text:'Tap the mobile number box and type 9123 4567.' };
      return { sel:'next', text:`The name shown is ${mask(p.name)}. That is Mei Ling, so tap “Next”.` };
    }
    if (sc === 'pn_amount') return amtGuide(p.amount, '50') || { sel:'next', text:'Tap “Next”.' };
    if (sc === 'review') return { sel:'confirm', text:'Check: is it Mei Ling, and is it S$50.00? If both are right, tap “Transfer now”.' };
    return null;
  },
  topup(){
    const sc = s.screen;
    if (sc === 'home') return { sel:'acct-wallet', text:'Tap “PayLah!”.' };
    if (sc === 'wallet') return { sel:'w-topup', text:'Tap “Top up”.' };
    if (sc === 'topup') {
      if (s.keypad) return +s.topup.amount === 20 ? { sel:'kp-done', text:'Tap “Done”.' } : { sel:'keypad', text:'Type 2 0.' };
      return +s.topup.amount !== 20 ? { sel:'chip-20', text:'Tap “S$20” to choose the amount.' } : { sel:'next', text:'Tap “Next”.' };
    }
    if (sc === 'review') return { sel:'confirm', text:'Check the amount is S$20.00. Then tap “Top up now”.' };
    return null;
  },
  auto(){
    const sc = s.screen;
    if (sc === 'home') return { sel:'acct-wallet', text:'Tap “PayLah!”.' };
    if (sc === 'wallet') return { sel:'w-auto', text:'Tap “Auto top-up”.' };
    if (sc === 'auto') return !s.autoDraft.on ? { sel:'auto-toggle', text:'Tap the switch to turn auto top-up on.' }
      : { sel:'auto-save', text:`Now, when your PayLah! drops below S$${s.autoDraft.below}, S$${s.autoDraft.amount} is added by itself. Tap “Save”.` };
    return null;
  },
  limit(){
    const sc = s.screen;
    if (sc === 'home') return { sel:'acct-wallet', text:'Tap “PayLah!”.' };
    if (sc === 'wallet') return { sel:'w-limit', text:'Tap “Wallet limit”.' };
    if (sc === 'limit') {
      if (s.dialog === 'limconfirm') return { sel:'lim-confirm', place:'below', text:'Tap “Confirm”.' };
      return s.limitDraft !== 500 ? { sel:'lim-500', text:'Tap “SGD 500”.' } : { sel:'lim-save', text:'Tap “Save”.' };
    }
    return null;
  },
  estmt(){
    if (s.screen === 'home') return { sel:'tile-edocs', text:'Tap “eDocuments”.' };
    if (s.screen === 'edocs') {
      if (s.docsTab !== 'stmt') return { sel:'tab-stmt', text:'Tap “eStatements”.' };
      if (!stmtMonths().length) return { sel:'year', text:'Tap the year to see last year’s statements.' };
      return { sel:'doc-0', text:'Your newest statement is at the top. Tap it to open.' };
    }
    return null;
  }
};
function guide(){
  if (!s.task) return null;
  if (s.task === 'peek') return GUIDES.peek() || wrongPlace();
  if (!s.loggedIn) return gLogin();
  if (s.task === 'login') return null;
  return GUIDES[s.task]() || wrongPlace();
}

/* draws the amber ring + speech bubble over the target element */
let lastSel = null;
function placeGuide(){
  const ring = $('#ring'), bub = $('#bubble');
  const on = s.task && !s.completed && !s.showDone && (s.guideOn || Date.now() < s.hintUntil);
  const g = on ? guide() : null;
  if (!g) { ring.hidden = true; bub.hidden = true; lastSel = null; return; }
  if (bub.textContent !== g.text) bub.textContent = g.text;
  bub.hidden = false;
  const sr = screenEl.getBoundingClientRect();
  const el = g.sel ? viewEl.querySelector(`[data-g="${g.sel}"]`) : null;
  bub.classList.remove('above','below','free');
  bub.style.top = bub.style.bottom = '';
  if (el) {
    // scroll the target into view inside its own scroll area (never the whole page)
    if (g.sel !== lastSel) {
      const sc = el.closest('.scroll');
      if (sc) { const r0 = el.getBoundingClientRect(), cr = sc.getBoundingClientRect();
        if (r0.top < cr.top + 70 || r0.bottom > cr.bottom - 30) sc.scrollTop += (r0.top - cr.top) - cr.height / 3; }
    }
    const r = el.getBoundingClientRect(), x = r.left - sr.left, y = r.top - sr.top;
    Object.assign(ring.style, { left:(x-5)+'px', top:(y-5)+'px', width:(r.width+10)+'px', height:(r.height+10)+'px' });
    ring.hidden = false;
    bub.style.setProperty('--ax', Math.min(Math.max(x + r.width/2 - 14, 22), sr.width - 28 - 22) + 'px');
    // v2: a guide can ask to sit below its target so it never hides a pop-up's own text
    const goBelow = g.place === 'below' || (g.place !== 'above' && y + r.height/2 <= sr.height * 0.5);
    if (!goBelow) { bub.classList.add('above'); bub.style.bottom = (sr.height - y + 16) + 'px'; }
    else { bub.classList.add('below'); bub.style.top = (y + r.height + 16) + 'px'; }
  } else {
    ring.hidden = true; bub.classList.add('free');
    if (g.pos === 'bottom') bub.style.bottom = '90px'; else bub.style.top = '64px';
  }
  lastSel = g.sel;
}

/* =========================================================
   9. RENDERING
   ========================================================= */
const screenEl = $('#screen'), viewEl = $('#view'), coachEl = $('#coach');
let lastScreen = null, coachSig = '';
const LIGHT_BAR = ['prelogin','login','home','scan'];

function render(){
  const old = viewEl.querySelector('.scroll'), keep = old && lastScreen === s.screen ? old.scrollTop : 0;
  viewEl.innerHTML = (S[s.screen] || S.home)() + (s.keypad ? keypad() : '') + (s.peek ? S.peekOverlay() : '') + (s.showDone ? doneCard() : '');
  const sc = viewEl.querySelector('.scroll'); if (sc) sc.scrollTop = keep;
  if (lastScreen !== s.screen) lastSel = null;
  lastScreen = s.screen;
  screenEl.classList.toggle('big', s.big);
  screenEl.classList.toggle('kp-open', !!s.keypad);
  $('#sb').classList.toggle('light', LIGHT_BAR.includes(s.screen) || s.peek);
  renderCoach();
  requestAnimationFrame(placeGuide);
}

function renderCoach(){
  const sig = JSON.stringify([s.task, s.guideOn, s.big, s.completed, progress]);
  if (sig === coachSig) return;
  coachSig = sig;
  const cur = TASKS.find(t => t.id === s.task);
  coachEl.innerHTML = `
  <header class="c-head"><h1>Banking practice <span style="font-weight:400;color:var(--sub)">v2</span></h1>
    <p>A safe copy of a banking app. Nothing here is real: no money moves, and mistakes are fine.</p></header>
  <span class="c-lbl" id="modeLbl">How do you want to practise?</span>
  <div class="seg" role="group" aria-labelledby="modeLbl">
    <button class="${s.guideOn?'on':''}" data-c="mode:learn" aria-pressed="${s.guideOn}">Learn Together<small>Show me each step</small></button>
    <button class="${!s.guideOn?'on':''}" data-c="mode:do" aria-pressed="${!s.guideOn}">Do<small>I’ll try on my own</small></button>
  </div>
  <select class="c-select" data-c-select aria-label="Choose a task">
    <option value="" ${!s.task?'selected':''}>Explore freely (no task)</option>
    ${TASKS.map((t,i) => `<option value="${t.id}" ${s.task===t.id?'selected':''}>${i+1}. ${t.title}${progress[t.id]?.do ? ' ✓' : ''}</option>`).join('')}
  </select>
  <section class="c-task" aria-live="polite">
    ${cur ? `<h2>Your task</h2><p class="scen">${cur.scen}</p>
      <div class="c-btns">${!s.guideOn && !s.completed ? '<button class="cbtn" data-c="hint">Show me a hint</button>' : ''}<button class="cbtn" data-c="restart">Start over</button></div>`
    : `<h2>Pick a task</h2><p class="scen">Choose a task to begin. Or just explore: you can tap anything.</p>`}
  </section>
  <ol class="tlist">${TASKS.map((t,i) => { const p = progress[t.id] || {};
    return `<li><button data-c="task:${t.id}" class="${s.task===t.id?'cur':''}" ${s.task===t.id?'aria-current="true"':''}>
      <span class="n ${p.do?'fin':''}">${p.do ? '✓' : i+1}</span><span>${t.title}</span>
      <span class="marks">${p.learn || p.do ? [p.learn?'Learnt with hints':'', p.do?'Done on my own':''].filter(Boolean).join(', ') : 'Not tried yet'}</span></button></li>`; }).join('')}</ol>
  <div class="c-foot"><button class="lnk" data-c="big" aria-pressed="${s.big}">${s.big ? 'Use normal text size' : 'Make text bigger'}</button>
    <button class="lnk" data-c="reset">Clear my progress</button></div>`;
}

/* toasts and notification banner */
let toastT, bannerT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800); }
function banner(msg){
  const b = $('#banner');
  b.innerHTML = `<span class="flag sm">${mark()}</span><span><b>Practice Bank</b> <small>now</small><br>${esc(msg)}</span>`;
  b.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(() => b.classList.remove('show'), 4500);
}

/* =========================================================
   10. EVENT WIRING
   ========================================================= */
function endPeek(){
  if (!s.peek) return;
  const held = Date.now() - s.peekAt;
  s.peek = false; render();
  if (held > 700) complete('peek');
}
screenEl.addEventListener('pointerdown', e => {
  if (!e.target.closest('[data-hold]')) return;
  e.preventDefault(); s.peek = true; s.peekAt = Date.now(); render();
});
window.addEventListener('pointerup', endPeek);
window.addEventListener('pointercancel', endPeek);
screenEl.addEventListener('contextmenu', e => { if (e.target.closest('[data-hold]') || s.peek) e.preventDefault(); });

screenEl.addEventListener('click', e => {
  const hold = e.target.closest('[data-hold]');
  if (hold && e.detail === 0) {            // keyboard users: Enter/Space shows peek for 3 s
    s.peek = true; s.peekAt = Date.now() - 1000; render(); setTimeout(endPeek, 3000); return;
  }
  const el = e.target.closest('[data-a]');
  if (!el || el.disabled) return;
  const [name, ...rest] = el.dataset.a.split(':');
  if (A[name]) A[name](rest.join(':'));
});
screenEl.addEventListener('input', e => {
  const k = e.target.dataset.input; if (!k) return;
  if (k === 'pnRef') s.pn.ref = e.target.value;
  if (k === 'scanRef') s.scan.ref = e.target.value;
  const c = e.target.parentElement.querySelector('.cnt-r'); if (c) c.textContent = e.target.value.length + '/25';
});
screenEl.addEventListener('focusin', e => {   // typing a comment closes the number keypad without losing focus
  if (e.target.matches('input') && s.keypad) {
    s.keypad = null; const kp = viewEl.querySelector('.kp'); if (kp) kp.remove();
    screenEl.classList.remove('kp-open'); viewEl.querySelectorAll('.focus').forEach(x => x.classList.remove('focus'));
    requestAnimationFrame(placeGuide);
  }
});
screenEl.addEventListener('scroll', () => requestAnimationFrame(placeGuide), true);
window.addEventListener('resize', () => requestAnimationFrame(placeGuide));

coachEl.addEventListener('click', e => {
  const el = e.target.closest('[data-c]'); if (!el) return;
  const [cmd, arg] = el.dataset.c.split(':');
  if (cmd === 'mode') { s.guideOn = arg === 'learn'; savePrefs(); render(); }
  if (cmd === 'task') startTask(arg);
  if (cmd === 'restart') startTask(s.task);
  if (cmd === 'hint') { s.hintUntil = Date.now() + 6000; placeGuide(); setTimeout(placeGuide, 6100); }
  if (cmd === 'big') { s.big = !s.big; savePrefs(); render(); }
  if (cmd === 'reset') { progress = {}; store.set('progress', progress); coachSig = ''; render(); toast('Progress cleared.'); }
});
coachEl.addEventListener('change', e => {
  if (!e.target.matches('[data-c-select]')) return;
  if (e.target.value) startTask(e.target.value);
  else { s = fresh({ guideOn:s.guideOn, big:s.big }); render(); }
});

/* live clock in the phone status bar */
function tick(){ const d = new Date(); $('#clock').textContent = `${d.getHours() % 12 || 12}:${pad(d.getMinutes())}`; }
tick(); setInterval(tick, 20000);

render();
</script>
