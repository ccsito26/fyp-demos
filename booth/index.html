<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Booth">
<meta name="theme-color" content="#121011">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Booth</title>
<style>
:root{--bg:#121011;--panel:#1e1a1b;--line:#332d2e;--ink:#f4efe6;--dim:#a89f97;--red:#e5352b;--red2:#ff5a4e;--stage:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto auto;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px}
.brand{font:700 22px/1 ui-rounded,-apple-system,sans-serif;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px #3a1614}
.fxname{flex:1;text-align:center;color:var(--dim);font-size:15px}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
.iconbtn:active{background:#2b2526}
.iconbtn svg{width:22px;height:22px}
.stage{position:relative;margin:0 16px;border-radius:20px;overflow:hidden;background:var(--stage);border:1px solid var(--line)}
#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.grid{position:absolute;inset:10px 10px 58px;display:grid;grid-template:repeat(3,minmax(0,1fr))/repeat(3,minmax(0,1fr));gap:8px}
.cell{position:relative;border-radius:12px;box-shadow:0 0 0 6px var(--stage);display:flex;align-items:flex-end;justify-content:center;padding:8px;outline:none}
.cell span{background:rgba(0,0,0,.62);color:#fff;font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;white-space:nowrap}
.cell.on{box-shadow:0 0 0 6px var(--stage),inset 0 0 0 3px var(--red2)}
.cell:active span{background:var(--red)}
.pager{position:absolute;left:0;right:0;bottom:8px;height:44px;display:flex;align-items:center;justify-content:center;gap:18px}
.pager .iconbtn{background:#1b1819}
.dots{display:flex;gap:10px}
.dots b{width:9px;height:9px;border-radius:50%;background:#4a4243}
.dots b.on{background:var(--ink)}
.count{position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(120px,26vh,260px)/1 ui-rounded,-apple-system,sans-serif;color:#fff;text-shadow:0 6px 40px rgba(0,0,0,.6);pointer-events:none}
.count.tick{animation:pop .9s ease-out}
@keyframes pop{0%{transform:scale(1.35);opacity:0}20%{opacity:1}100%{transform:scale(.9);opacity:.85}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .7s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.rec{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:6px 14px;border-radius:99px;font-variant-numeric:tabular-nums;font-weight:600;display:flex;gap:8px;align-items:center}
.rec i{width:10px;height:10px;border-radius:50%;background:var(--red2);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.four{position:absolute;top:14px;right:14px;display:grid;grid-template-columns:repeat(2,16px);gap:3px}
.four b{height:12px;border-radius:2px;background:rgba(255,255,255,.3)}
.four b.on{background:#fff}
.toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:rgba(20,17,18,.86);border:1px solid #3d3536;padding:8px 16px;border-radius:99px;font-size:15px;white-space:nowrap;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.start{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 30%,#3a1513,#120d0e 70%);padding:24px;text-align:center}
.start h1{font:800 clamp(40px,7vw,64px)/1.05 ui-rounded,-apple-system,sans-serif;letter-spacing:-.03em;margin:0 0 10px}
.start p{color:#cdbfb5;margin:0 auto 26px;max-width:30em}
.start .err{color:#ffb3a8}
.big{display:inline-flex;align-items:center;gap:10px;background:var(--red);color:#fff;font-weight:700;font-size:18px;padding:15px 28px;border-radius:99px;box-shadow:0 8px 30px rgba(229,53,43,.35)}
.big:active{background:#c42a21}
.link{display:block;margin:18px auto 0;color:#e8d9cf;text-decoration:underline;text-underline-offset:3px;font-size:15px;min-height:44px}
.controls{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:14px 20px 10px}
.modes{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;justify-self:start}
.modes button{min-width:64px;height:40px;padding:0 12px;border-radius:10px;font-size:15px;font-weight:600;color:var(--dim)}
.modes button.on{background:#3a3233;color:var(--ink)}
.right{display:flex;gap:10px;justify-self:end}
.pill{height:44px;padding:0 16px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.pill.on{background:var(--ink);color:#1a1617;border-color:var(--ink)}
.pill svg{width:18px;height:18px}
.shutter{width:78px;height:78px;border-radius:50%;background:#2a2425;border:3px solid #4b4243;display:grid;place-items:center}
.shutter span{width:58px;height:58px;border-radius:50%;background:var(--red);display:grid;place-items:center;transition:all .2s}
.shutter span svg{width:28px;height:28px;color:#fff}
.shutter:active span{transform:scale(.92);background:#c42a21}
.shutter.recording span{width:30px;height:30px;border-radius:7px}
.shutter.recording span svg{display:none}
.shutter:disabled{opacity:.5}
.strip{height:104px;margin:0 16px 12px;border-radius:14px;background:#0b0a0a repeating-linear-gradient(90deg,transparent 0 10px,#2a2425 10px 20px) top/100% 7px no-repeat;position:relative;overflow:hidden}
.strip::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(90deg,transparent 0 10px,#2a2425 10px 20px)}
.reel{position:absolute;inset:12px 0;display:flex;gap:8px;padding:0 10px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.reel::-webkit-scrollbar{display:none}
.thumb{flex:0 0 auto;height:80px;aspect-ratio:4/3;border-radius:6px;overflow:hidden;position:relative;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb em{position:absolute;left:5px;bottom:5px;background:rgba(0,0,0,.65);font:600 11px/1 -apple-system,sans-serif;font-style:normal;padding:3px 6px;border-radius:4px}
.empty{color:#7d736c;font-size:15px;align-self:center;padding-left:8px}
.viewer{position:fixed;inset:0;background:rgba(8,7,7,.96);display:grid;grid-template-rows:minmax(0,1fr) auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:5}
.vbody{display:grid;place-items:center;min-height:0}
.vbody img,.vbody video{max-width:100%;max-height:100%;border-radius:12px;display:block}
.vbar{display:flex;justify-content:center;gap:12px;padding-top:16px;flex-wrap:wrap}
.vbar .pill{min-width:110px;justify-content:center}
.pill.danger{color:#ff8a80}
.pill.danger.armed{background:var(--red);color:#fff;border-color:var(--red)}
#video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
@media (orientation:portrait){.strip{height:112px}.thumb{height:88px}}
@media (max-width:620px){.modes button{min-width:0;padding:0 9px}.pill .lbl{display:none}.controls{padding:12px 16px 8px}.top{padding:8px 16px}.fxname{font-size:14px}}
@media (prefers-reduced-motion:reduce){.count.tick,.rec i{animation:none}.flash.go{animation-duration:.2s}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><i></i>Booth</div>
    <div class="fxname" id="fxName">Normal</div>
    <button class="iconbtn" id="photoBtn" aria-label="Use a photo instead of the camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg></button>
    <button class="iconbtn" id="flipBtn" aria-label="Switch camera"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><path d="M9.5 13.5a3 3 0 0 0 5.2 1.6M14.5 12.5a3 3 0 0 0-5.2-1.6"/><path d="M14.7 17v-2h-2M9.3 9v2h2"/></svg></button>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="grid" id="grid" hidden></div>
    <div class="pager" id="pager" hidden>
      <button class="iconbtn" id="prevPage" aria-label="Previous effects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m15 5-7 7 7 7"/></svg></button>
      <div class="dots" id="dots"></div>
      <button class="iconbtn" id="nextPage" aria-label="Next effects"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m9 5 7 7-7 7"/></svg></button>
    </div>
    <div class="four" id="four" hidden><b></b><b></b><b></b><b></b></div>
    <div class="rec" id="rec" hidden><i></i><span id="recTime">0:00</span></div>
    <div class="count" id="count" hidden></div>
    <div class="flash" id="flash"></div>
    <div class="toast" id="toast"></div>
    <div class="start" id="start">
      <div>
        <h1>Booth</h1>
        <p id="startMsg">Thirty-five live camera effects, including hearts that follow your face, a 3-2-1 countdown, four-up photo strips and short clips. Everything stays on this iPad.</p>
        <button class="big" id="startBtn"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Start camera</button>
        <button class="link" id="startPhoto">Or try the effects on a photo</button>
      </div>
    </div>
  </main>

  <div class="controls">
    <div class="modes" id="modes" role="radiogroup" aria-label="Capture mode">
      <button data-m="four" role="radio">4-Up</button>
      <button data-m="photo" role="radio" class="on">Photo</button>
      <button data-m="clip" role="radio">Clip</button>
    </div>
    <button class="shutter" id="shutter" aria-label="Take photo"><span id="shutterIcon"></span></button>
    <div class="right">
      <button class="pill on" id="timerBtn" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2h5"/></svg><span class="lbl">3s</span></button>
      <button class="pill" id="fxBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="9.5" y="3" width="5" height="5" rx="1"/><rect x="16" y="3" width="5" height="5" rx="1"/><rect x="3" y="9.5" width="5" height="5" rx="1"/><rect x="9.5" y="9.5" width="5" height="5" rx="1"/><rect x="16" y="9.5" width="5" height="5" rx="1"/><rect x="3" y="16" width="5" height="5" rx="1"/><rect x="9.5" y="16" width="5" height="5" rx="1"/><rect x="16" y="16" width="5" height="5" rx="1"/></svg><span class="lbl">Effects</span></button>
    </div>
  </div>

  <div class="strip"><div class="reel" id="reel"></div></div>
</div>

<div class="viewer" id="viewer" hidden>
  <div class="vbody" id="vbody"></div>
  <div class="vbar">
    <button class="pill" id="vPrev" aria-label="Previous">‹</button>
    <button class="pill" id="vShare">Save / Share</button>
    <button class="pill danger" id="vDel">Delete</button>
    <button class="pill" id="vClose">Done</button>
    <button class="pill" id="vNext" aria-label="Next">›</button>
  </div>
</div>

<input type="file" id="file" accept="image/*" hidden>
<video id="video" playsinline muted autoplay></video>

<script>
{
const FX = [
  [['Sepia',1],['Black & White',2],['Glow',3],['Comic Book',4],['Normal',0],['Colored Pencil',6],['Thermal Camera',7],['X-Ray',8],['Pop Art',9]],
  [['Bulge',10],['Dent',11],['Twirl',12],['Squeeze',13],['Normal',0],['Mirror',15],['Light Tunnel',16],['Fish Eye',17],['Stretch',18]],
  [['Kaleidoscope',20],['Neon',21],['Halftone',22],['Pixels',23],['Normal',0],['Ripple',25],['Night Vision',26],['Vintage',27],['Spectral',28]],
  [['Heart Halo',30],['Heart Eyes',31],['Floating Hearts',32],['Heart Frame',33],['Normal',0],['Heart Glow',35],['Blushing',36],['Heart Lens',37],['Heart Shower',38]]
];
const NAME = {}; FX.flat().forEach(([n,i]) => NAME[i] = n);
const HEARTS = new Set([30,31,33,36,37]);
const MOVABLE = new Set([10,11,12,13,15,16,17,18,20,25,30,31,33,36,37]);
const $ = id => document.getElementById(id);
const canvas = $('gl'), video = $('video'), stage = $('stage'), grid = $('grid');
const sleep = ms => new Promise(r => setTimeout(r, ms));

/* ---------- WebGL ---------- */
const VS = `attribute vec2 a;varying vec2 v;void main(){v=vec2(a.x*.5+.5,.5-a.y*.5);gl_Position=vec4(a,0.,1.);}`;
const FS = `precision highp float;
varying vec2 v;
uniform sampler2D T;
uniform vec2 uScale,uOffset,uCell,uCenter;
uniform float uMirror,uTime,uHasFace;
uniform vec4 uFace,uEyes;
uniform int uFx;
float shadeK;
vec3 tex(vec2 uv){uv=clamp(uv,0.,1.);vec2 t=uOffset+uv*uScale;if(uMirror>.5)t.x=1.-t.x;return texture2D(T,t).rgb;}
float L(vec3 c){return dot(c,vec3(.299,.587,.114));}
float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
vec2 rot(vec2 p,float a){float c=cos(a),s=sin(a);return vec2(c*p.x-s*p.y,s*p.x+c*p.y);}
float sobel(vec2 uv){
  vec2 d=max(1.,uCell.y/520.)/uCell;
  float tl=L(tex(uv+d*vec2(-1.,-1.))),t=L(tex(uv+d*vec2(0.,-1.))),tr=L(tex(uv+d*vec2(1.,-1.)));
  float l=L(tex(uv+d*vec2(-1.,0.))),r=L(tex(uv+d*vec2(1.,0.)));
  float bl=L(tex(uv+d*vec2(-1.,1.))),b=L(tex(uv+d*vec2(0.,1.))),br=L(tex(uv+d*vec2(1.,1.)));
  float gx=-tl-2.*l-bl+tr+2.*r+br,gy=-tl-2.*t-tr+bl+2.*b+br;
  return length(vec2(gx,gy));
}
vec3 thermal(float t){
  vec3 c0=vec3(.02,.0,.3),c1=vec3(.45,.0,.75),c2=vec3(.95,.08,.3),c3=vec3(1.,.62,.0),c4=vec3(1.,1.,.8);
  t=clamp(t,0.,1.)*4.;
  if(t<1.)return mix(c0,c1,t);if(t<2.)return mix(c1,c2,t-1.);if(t<3.)return mix(c2,c3,t-2.);return mix(c3,c4,t-3.);
}
vec2 warp(vec2 uv){
  float asp=uCell.x/uCell.y;vec2 k=vec2(asp,1.);vec2 c=uCenter;vec2 p=(uv-c)*k;float r=length(p);
  if(uFx==10){float R=.42;if(r<R){float x=max(r/R,1e-4);p*=.3+.7*pow(x,1.2);}}
  else if(uFx==11){float R=.42;if(r<R){float x=max(r/R,1e-4);p/=.35+.65*pow(x,1.2);}}
  else if(uFx==12){float R=.5;if(r<R){float x=1.-r/R;p=rot(p,3.2*x*x);}}
  else if(uFx==13){p.x*=1.+1.1*exp(-(p.x*p.x)/.06);}
  else if(uFx==15){p.x=-abs(p.x);}
  else if(uFx==16){float R=.24;if(r>R){p=p/r*(R-.003);shadeK=mix(1.,.3,smoothstep(R,R+.9,r));}}
  else if(uFx==17){float R=length(k)*.5;float x=r/R;if(x<1.&&x>1e-4){p*=mix(1.,(1.-sqrt(1.-x*x))/x,.72);}shadeK=1.-.55*pow(min(x,1.),4.);}
  else if(uFx==18){p.y*=1.-.55*exp(-(p.y*p.y)/.08);}
  else if(uFx==20){float a=atan(p.y,p.x)+uTime*.12;float s=1.0472;a=mod(a,s);a=abs(a-s*.5);p=r*vec2(cos(a),sin(a));}
  else if(uFx==23){float n=56.;vec2 g=vec2(n*asp,n);return (floor(uv*g)+.5)/g;}
  else if(uFx==25){if(r>.001)p+=p/r*sin(r*55.-uTime*5.)*.008;}
  return c+p/k;
}
vec3 popArt(vec2 uv){
  vec2 q=floor(uv*2.);uv=fract(uv*2.);float i=q.x+2.*q.y;
  float l=L(tex(uv));
  vec3 d,m,h;
  if(i<.5){d=vec3(.1,.1,.45);m=vec3(1.,.2,.55);h=vec3(1.,.9,.2);}
  else if(i<1.5){d=vec3(.35,.05,.45);m=vec3(1.,.5,.1);h=vec3(.35,.9,1.);}
  else if(i<2.5){d=vec3(.75,.04,.1);m=vec3(.55,.9,.2);h=vec3(1.,.78,.86);}
  else{d=vec3(.05,.05,.08);m=vec3(.1,.45,1.);h=vec3(1.,.75,.2);}
  return l<.33?d:(l<.58?m:h);
}
vec3 color(vec2 uv){
  vec3 c=tex(uv);float l=L(c);
  if(uFx==1){vec3 s=vec3(dot(c,vec3(.393,.769,.189)),dot(c,vec3(.349,.686,.168)),dot(c,vec3(.272,.534,.131)));return min(s,1.);}
  if(uFx==2){return vec3(clamp((l-.5)*1.3+.5,0.,1.));}
  if(uFx==3){vec3 b=vec3(0.);float asp=uCell.x/uCell.y;
    for(int i=0;i<12;i++){float a=float(i)*.5236;vec2 o=vec2(cos(a)/asp,sin(a));b+=tex(uv+o*.012);b+=tex(uv+o*.028);}
    b/=24.;vec3 g=1.-(1.-c)*(1.-b*.9);return min(g*1.03+.02,1.);}
  if(uFx==4){float e=sobel(uv);float s=uCell.y/110.;vec2 f=fract(uv*uCell/s)-.5;
    float val=l>.6?1.:(l>.3?smoothstep(.26,.34,length(f)):0.);
    val*=1.-smoothstep(.22,.55,e);return vec3(.98,.97,.93)*val;}
  if(uFx==6){float e=sobel(uv);vec3 paper=vec3(.97,.96,.92);vec3 stroke=clamp(mix(vec3(l),c,1.7)*.85,0.,1.);
    vec2 px=uv*uCell;float hatch=.5+.5*sin((px.x+px.y)*.9);float n=hash(floor(px/2.));
    float amt=clamp(smoothstep(.06,.45,e)*1.2+(1.-l)*.4*hatch*n,0.,1.);return mix(paper,stroke,amt);}
  if(uFx==7){return thermal(pow(l,.9));}
  if(uFx==8){float x=pow(1.-l,1.3);return vec3(x*.72,x*.88,x)+vec3(0.,.02,.07);}
  if(uFx==21){float e=smoothstep(.05,.45,sobel(uv));vec3 h=.5+.5*cos(6.2832*(uv.y*.6+uv.x*.3+uTime*.08+vec3(0.,.33,.67)));return h*e*1.6+c*.05;}
  if(uFx==22){float s=uCell.y/90.;vec2 g=rot(uv*uCell,.785)/s;vec2 f=fract(g)-.5;float rad=sqrt(1.-l)*.62;
    float dotm=1.-smoothstep(rad-.07,rad,length(f));return mix(vec3(.98,.95,.88),clamp(c*.55,0.,1.),dotm);}
  if(uFx==26){float g=l*1.7+(hash(uv*uCell+fract(uTime))-.5)*.2;float scan=.85+.15*sin(uv.y*uCell.y*1.4);
    float vig=1.-smoothstep(.35,.75,length(uv-.5));return vec3(g*.25,g,g*.3)*scan*vig;}
  if(uFx==27){c=c*vec3(1.08,1.,.84)+vec3(.06,.04,0.);c=mix(c,vec3(L(c)),.25)*.85+.1;
    float vig=1.-.6*smoothstep(.3,.8,length(uv-.5));return c*vig+(hash(uv*uCell)-.5)*.05;}
  if(uFx==28){vec2 d=(uv-.5)*.022;return vec3(tex(uv+d).r,c.g,tex(uv-d).b);}
  return c;
}
float dot2(vec2 p){return dot(p,p);}
float sdHeart(vec2 p){p.x=abs(p.x);
  if(p.y+p.x>1.)return sqrt(dot2(p-vec2(.25,.75)))-.35355;

    if (S.mode === 'photo') {
      await countdown(); flash(); const b = await grab(); await addShot({type: 'image', blob: b, fx: S.fx});
    } else {
      const four = $('four'), boxes = [...four.children]; four.hidden = false; boxes.forEach(x => x.classList.remove('on'));
      await countdown(); const blobs = [];
      for (let i = 0; i < 4; i++) { if (i) await sleep(900); flash(); boxes[i].classList.add('on'); blobs.push(await grab()); }
      const imgs = await Promise.all(blobs.map(loadImg)), W = imgs[0].width, H = imgs[0].height, g = Math.round(W * .025);
      const c = document.createElement('canvas'); c.width = W * 2 + g * 3; c.height = H * 2 + g * 3;
      const x = c.getContext('2d'); x.fillStyle = '#f7f3ec'; x.fillRect(0, 0, c.width, c.height);
      imgs.forEach((im, i) => { x.drawImage(im, g + (i % 2) * (W + g), g + Math.floor(i / 2) * (H + g)); URL.revokeObjectURL(im.src); });
      const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .92)); await addShot({type: 'image', blob: b, fx: S.fx, four: true});
      await sleep(400); four.hidden = true;
    }
  } finally { S.busy = false; $('shutter').disabled = false; }
}
$('shutter').onclick = shoot;

async function startClip() {
  if (!canvas.captureStream || !window.MediaRecorder) { toast('Clip recording needs iPadOS 14.5 or later'); return; }
  openGrid(false); S.busy = true; $('shutter').disabled = true;
  await countdown(); S.busy = false; $('shutter').disabled = false;
  const stream = canvas.captureStream(30);
  try { if (!S.mic) S.mic = await navigator.mediaDevices.getUserMedia({audio: true}); S.mic.getAudioTracks().forEach(t => stream.addTrack(t)); } catch (e) {}
  const mime = ['video/mp4;codecs=avc1', 'video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(m => MediaRecorder.isTypeSupported?.(m));
  const rec = new MediaRecorder(stream, mime ? {mimeType: mime} : undefined), chunks = [];
  const thumb = await grab();
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  rec.onstop = async () => {
    const type = (rec.mimeType || mime || 'video/mp4').split(';')[0];
    stream.getVideoTracks().forEach(t => t.stop());
    await addShot({type: 'video', blob: new Blob(chunks, {type}), thumb, fx: S.fx});
  };
  rec.start(250); S.rec = rec; S.recStart = Date.now();
  $('shutter').classList.add('recording'); $('shutter').setAttribute('aria-label', 'Stop recording'); $('rec').hidden = false;
  S.recTimer = setInterval(() => { const s = Math.floor((Date.now() - S.recStart) / 1000); $('recTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); if (s >= 60) stopClip(); }, 250);
}
function stopClip() {
  if (!S.rec) return; clearInterval(S.recTimer); S.rec.stop(); S.rec = null;
  $('shutter').classList.remove('recording'); $('shutter').setAttribute('aria-label', 'Record clip'); $('rec').hidden = true; $('recTime').textContent = '0:00';
}

/* ---------- storage ---------- */
let dbp = null;
function db() {
  if (!dbp) dbp = new Promise((res, rej) => { try { const r = indexedDB.open('booth', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('shots', {keyPath: 'id', autoIncrement: true});
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });
  return dbp;
}
async function tx(mode, fn) { const d = await db(); return new Promise((res, rej) => { const t = d.transaction('shots', mode), q = fn(t.objectStore('shots')); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); }
async function addShot(s) {
  s.created = Date.now(); s.thumb = s.thumb ? await thumbOf(s.thumb) : await thumbOf(s.blob);
  try { s.id = await tx('readwrite', st => st.add({type: s.type, blob: s.blob, thumb: s.thumb, fx: s.fx, created: s.created})); } catch (e) { s.id = 'm' + s.created; }
  S.shots.unshift(s); drawReel(true);
}
async function loadShots() { try { const all = await tx('readonly', st => st.getAll()); S.shots = (all || []).sort((a, b) => b.created - a.created); } catch (e) {} drawReel(); }
const urls = new Map();
const urlOf = b => { if (!urls.has(b)) urls.set(b, URL.createObjectURL(b)); return urls.get(b); };
function drawReel(scroll) {
  const r = $('reel');
  r.innerHTML = S.shots.length ? S.shots.map((s, i) => `<button class="thumb" data-i="${i}" aria-label="Open ${s.type === 'video' ? 'clip' : 'photo'}"><img alt="" src="${urlOf(s.thumb || s.blob)}">${s.type === 'video' ? '<em>CLIP</em>' : s.four ? '<em>4-UP</em>' : ''}</button>`).join('')
    : '<div class="empty">Your photos and clips will line up here.</div>';
  if (scroll) r.scrollLeft = 0;
}
$('reel').onclick = e => { const b = e.target.closest('.thumb'); if (b) openView(+b.dataset.i); };

/* ---------- viewer ---------- */
function openView(i) {
  if (i < 0 || i >= S.shots.length) return; S.view = i; const s = S.shots[i], v = $('vbody');
  v.innerHTML = s.type === 'video' ? `<video src="${urlOf(s.blob)}" controls playsinline autoplay></video>` : `<img alt="Captured photo" src="${urlOf(s.blob)}">`;
  $('viewer').hidden = false; $('vDel').classList.remove('armed'); $('vDel').textContent = 'Delete';
  $('vPrev').disabled = i === 0; $('vNext').disabled = i === S.shots.length - 1;
}
function closeView() { $('viewer').hidden = true; $('vbody').innerHTML = ''; S.view = -1; }
$('vClose').onclick = closeView;
$('vPrev').onclick = () => openView(S.view - 1); $('vNext').onclick = () => openView(S.view + 1);
$('vShare').onclick = async () => {
  const s = S.shots[S.view]; if (!s) return;
  const ext = s.blob.type.includes('mp4') ? 'mp4' : s.blob.type.includes('webm') ? 'webm' : 'jpg';
  const name = 'booth-' + new Date(s.created).toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.' + ext;
  const file = new File([s.blob], name, {type: s.blob.type});
  if (navigator.canShare && navigator.canShare({files: [file]})) { try { await navigator.share({files: [file]}); } catch (e) {} return; }
  const a = document.createElement('a'); a.href = urlOf(s.blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
};
$('vDel').onclick = async () => {
  const b = $('vDel');
  if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = 'Tap to confirm'; return; }
  const s = S.shots[S.view]; if (!s) return;
  try { if (typeof s.id === 'number') await tx('readwrite', st => st.delete(s.id)); } catch (e) {}
  S.shots.splice(S.view, 1); drawReel();
  if (S.shots.length) openView(Math.min(S.view, S.shots.length - 1)); else closeView();
};

/* ---------- keyboard (Magic Keyboard / Smart Keyboard) ---------- */
document.addEventListener('keydown', e => {
  if (!$('viewer').hidden) { if (e.key === 'Escape') closeView(); if (e.key === 'ArrowLeft') openView(S.view - 1); if (e.key === 'ArrowRight') openView(S.view + 1); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); shoot(); }
  else if (e.key === 'e') openGrid(!S.gridOpen);
  else if (e.key === 'Escape') openGrid(false);
  else if (S.gridOpen && e.key === 'ArrowLeft') page(-1);
  else if (S.gridOpen && e.key === 'ArrowRight') page(1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden && S.rec) stopClip(); });

if (!gl) setMsg('This device could not start WebGL, which Booth needs for its effects.', true);
setMode('photo'); loadShots();
window.__booth = {S, pickFx, openGrid, page, FACE};
}
</script>
</body>
